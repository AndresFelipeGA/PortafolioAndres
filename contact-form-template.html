<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Colombian Coffee</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            color: #333;
            overflow: auto;
            height: 100vh;
            scroll-behavior: smooth;
        }
        
        .contact-container {
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 100vh;
            position: relative;
            scroll-behavior: smooth;
        }
        
        /* Estilos para el scrollbar - más visible */
        ::-webkit-scrollbar {
            width: 12px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: #A67C52;
            border-radius: 10px;
            border: 2px solid #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #6F4E37;
        }
        
        /* Indicador de desplazamiento */
        .scroll-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background-color: rgba(166, 124, 82, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            animation: bounce 2s infinite;
            z-index: 100;
            pointer-events: none;
        }
        
        /* Botón de regreso en la esquina superior izquierda */
        .back-corner-button {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background-color: rgba(166, 124, 82, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s ease;
        }
        
        .back-corner-button:hover {
            background-color: rgba(111, 78, 55, 0.9);
            transform: scale(1.1);
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .form-header h1 {
            margin: 0;
            color: #5D4037;
            font-size: 24px;
        }
        
        .form-header .service-icon {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin: 10px auto;
            display: block;
        }
        
        .form-header .service-description {
            font-size: 14px;
            color: #7D5A50;
            text-align: center;
            margin: 10px 0;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .contact-form {
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
            background: #f9f9f9;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #5D4037;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
        }
        
        .form-group textarea {
            height: 120px;
            resize: vertical;
        }
        
        .form-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .back-button {
            background: #E0E0E0;
            color: #5D4037;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .submit-button {
            background: linear-gradient(135deg, #6F4E37, #A67C52);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .back-button:hover, .submit-button:hover {
            transform: scale(1.05);
        }
        
        .back-button:active, .submit-button:active {
            transform: scale(0.98);
        }
        
        .back-icon {
            margin-right: 5px;
            font-size: 16px;
        }
        
        /* Campos específicos para cada servicio estarán aquí */
        .service-specific-fields {
            border-top: 1px solid #ddd;
            margin-top: 15px;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="contact-container">
        <div class="back-corner-button" onclick="window.location.href='cafe-menu.html'">←</div>
        <div class="scroll-indicator" id="scrollIndicator">↓</div>
        <div class="form-header">
            <h1>Contact Form</h1>
            <img src="" alt="Service Icon" class="service-icon" id="serviceIcon">
            <h2 id="serviceTitle">Service Name</h2>
            <p class="service-description" id="serviceDescription">Description of the selected service.</p>
        </div>
        
        <form class="contact-form" id="contactForm">
            <!-- Common fields for all services -->
            <div class="form-group">
                <label for="nombre">Full Name*</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address*</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="telefono">Phone</label>
                <input type="tel" id="telefono" name="telefono">
            </div>
            
            <div class="form-group">
                <label for="empresa">Company/Organization</label>
                <input type="text" id="empresa" name="empresa">
            </div>
            
            <!-- Specific fields for each service -->
            <div class="service-specific-fields" id="specificFields">
                <!-- These fields will be loaded dynamically according to the selected service -->
            </div>
            
            <div class="form-group">
                <label for="mensaje">Additional Message</label>
                <textarea id="mensaje" name="mensaje"></textarea>
            </div>
            
            <div class="form-buttons">
                <button type="button" class="back-button" onclick="window.location.href='cafe-menu.html'">
                    <span class="back-icon">←</span> Back to Menu
                </button>
                <button type="submit" class="submit-button">Send Request</button>
            </div>
        </form>
    </div>

    <script>
        // Function to get URL parameters
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }
        
        // Function to load the selected service data
        function loadServiceData() {
            const service = getUrlParameter('service');
            
            // Default configuration if no service is specified
            if (!service) {
                window.location.href = 'cafe-menu.html';
                return;
            }
            
            // Here the specific data for each service will be loaded
            // This function will be customized in each form
        }
        
        // Function to handle scrolling
        function handleScroll() {
            const container = document.querySelector('.contact-container');
            const scrollIndicator = document.getElementById('scrollIndicator');
            
            // Show/hide the scroll indicator as needed
            if (container.scrollHeight > container.clientHeight) {
                // There is content that can be scrolled
                if (container.scrollTop + container.clientHeight >= container.scrollHeight - 20) {
                    // We are near the end, hide the indicator
                    scrollIndicator.style.display = 'none';
                } else {
                    // There is still content to scroll, show the indicator
                    scrollIndicator.style.display = 'flex';
                }
            } else {
                // Not enough content to scroll
                scrollIndicator.style.display = 'none';
            }
        }
        
        // Function to handle mouse wheel events
        function handleMouseWheel(event) {
            const container = document.querySelector('.contact-container');
            
            // Prevent default behavior
            event.preventDefault();
            
            // Scroll the container
            container.scrollTop += event.deltaY;
            
            // Update the scroll indicator
            handleScroll();
        }
        
        // Load data when starting the page
        document.addEventListener('DOMContentLoaded', function() {
            loadServiceData();
            
            // Configure scroll handling
            const container = document.querySelector('.contact-container');
            
            // Check if we need to show the scroll indicator
            handleScroll();
            
            // Add scroll event
            container.addEventListener('scroll', handleScroll);
            
            // Add mouse wheel event for scrolling
            container.addEventListener('wheel', handleMouseWheel, { passive: false });
            
            // Add click event to the scroll indicator
            document.getElementById('scrollIndicator').addEventListener('click', function() {
                container.scrollTop += 100; // Scroll down when clicking the indicator
            });
        });
        
        // Handle form submission
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Here would go the logic to process the form
            // For now, we'll just show a success message
            alert('Thank you for your interest! Your request has been sent successfully.');
            
            // Redirect to the main menu
            window.location.href = 'cafe-menu.html';
        });
    </script>
</body>
</html>

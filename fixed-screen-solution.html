<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Screen Solution</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Three.js core library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r132/three.min.js"></script>
    
    <!-- Three.js components -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // Configuración inicial
        let camera, scene, renderer, controls;
        let model = null;
        
        // Inicializar la escena
        init();
        animate();
        
        function init() {
            // Crear escena con fondo negro
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Crear cámara
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            
            // Crear renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Controles de órbita
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Crear la pantalla con textura
            createScreen();
            
            // Manejar redimensionamiento de ventana
            window.addEventListener('resize', onWindowResize);
        }
        
        function createScreen() {
            // Coordenadas de la pantalla (ajustar según sea necesario)
            const width = 2.3;
            const height = 1.46;
            
            // Crear geometría del plano
            const screenGeometry = new THREE.PlaneGeometry(width, height);
            
            // Cargar textura para el frente
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(
                'media/icons/coffeDisplayBackground.jpg',
                function(texture) {
                    console.log("Textura cargada correctamente");
                    
                    // Crear material para el frente (solo visible desde el frente)
                    const frontMaterial = new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.FrontSide, // IMPORTANTE: Solo visible desde el frente
                        transparent: false,
                        opacity: 1.0,
                        depthWrite: true,
                        depthTest: true
                    });
                    
                    // Crear el plano frontal
                    const frontPlane = new THREE.Mesh(screenGeometry, frontMaterial);
                    frontPlane.position.set(0, 0, 0);
                    scene.add(frontPlane);
                    console.log("Plano frontal añadido a la escena");
                    
                    // Crear material para la parte trasera (negro y solo visible desde atrás)
                    const backMaterial = new THREE.MeshBasicMaterial({
                        color: 0x000000, // Negro
                        side: THREE.BackSide, // IMPORTANTE: Solo visible desde atrás
                        transparent: false,
                        opacity: 1.0,
                        depthWrite: true,
                        depthTest: true
                    });
                    
                    // Crear el plano trasero (ligeramente más grande para evitar z-fighting)
                    const backGeometry = new THREE.PlaneGeometry(width * 1.01, height * 1.01);
                    const backPlane = new THREE.Mesh(backGeometry, backMaterial);
                    backPlane.position.copy(frontPlane.position);
                    backPlane.position.z -= 0.001; // Ligeramente detrás del plano frontal
                    scene.add(backPlane);
                    console.log("Plano trasero añadido a la escena");
                    
                    // Cargar textura para el menú
                    textureLoader.load(
                        'media/icons/typeOfCoffes/cafeNumeroUno.png',
                        function(menuTexture) {
                            // Crear material para el menú
                            const menuMaterial = new THREE.MeshBasicMaterial({
                                map: menuTexture,
                                side: THREE.FrontSide,
                                transparent: true,
                                opacity: 1.0
                            });
                            
                            // Crear plano para el menú (más pequeño)
                            const menuGeometry = new THREE.PlaneGeometry(width * 0.4, height * 0.4);
                            const menuPlane = new THREE.Mesh(menuGeometry, menuMaterial);
                            
                            // Posicionar el menú ligeramente por delante del plano frontal
                            menuPlane.position.copy(frontPlane.position);
                            menuPlane.position.z += 0.01;
                            
                            // Añadir el menú a la escena
                            scene.add(menuPlane);
                            console.log("Plano del menú añadido a la escena");
                        },
                        undefined,
                        function(error) {
                            console.error("Error al cargar la textura del menú:", error);
                        }
                    );
                },
                undefined,
                function(error) {
                    console.error("Error al cargar la textura:", error);
                }
            );
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Actualizar controles
            controls.update();
            
            // Renderizar escena
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

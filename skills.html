<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habilidades</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: #ffffff;
            overflow: hidden;
        }
        
        .container {
            padding: 20px;
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        
        h1 {
            font-size: 2.5em;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            flex: 1;
            min-height: 0;
        }
        
        .skill-category {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
        }
        
        .skill-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .skill-list {
            line-height: 1.5;
            opacity: 0.9;
            font-size: 0.9em;
            flex: 1;
        }
        
        /* Botón de volver minimalista */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
            font-size: 20px;
            color: white;
        }
        
        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .back-button::before {
            content: '←';
            font-weight: bold;
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="goBackToBox()" title="Volver al menú"></button>
    
    <div class="container">
        <h1>⚡ Mis Habilidades</h1>
        
        <div class="skills-grid">
            <div class="skill-category">
                <div class="skill-title">Frontend</div>
                <div class="skill-list">
                    • React.js<br>
                    • Vue.js<br>
                    • JavaScript (ES6+)<br>
                    • HTML5 & CSS3<br>
                    • Three.js
                </div>
            </div>
            
            <div class="skill-category">
                <div class="skill-title">Backend</div>
                <div class="skill-list">
                    • Node.js<br>
                    • Python<br>
                    • Express.js<br>
                    • MongoDB<br>
                    • PostgreSQL
                </div>
            </div>
            
            <div class="skill-category">
                <div class="skill-title">Herramientas</div>
                <div class="skill-list">
                    • Git & GitHub<br>
                    • Docker<br>
                    • AWS<br>
                    • VS Code<br>
                    • Figma
                </div>
            </div>
            
            <div class="skill-category">
                <div class="skill-title">Metodologías</div>
                <div class="skill-list">
                    • Agile/Scrum<br>
                    • TDD<br>
                    • CI/CD<br>
                    • REST APIs<br>
                    • Responsive Design
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function goBackToBox() {
            // Comunicar al iframe padre para volver al box.html
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'navigateToBox' }, '*');
            }
        }
    </script>
</body>
</html>

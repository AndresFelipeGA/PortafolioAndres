<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed 3D Model Loader</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            max-width: 400px;
            z-index: 100;
        }
        #loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
            overflow: hidden;
        }
        /* Estilos para el GIF de la taza de café */
        .coffee-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }
        .coffee-gif {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 10;
            /* Filtros para eliminar el fondo #fff4cc y hacer el café de color café */
            filter: brightness(1.1) contrast(1.5) invert(1) hue-rotate(180deg);
            mix-blend-mode: exclusion;
            transform: scale(0.75); /* Tamaño reducido */
        }
        /* Indicador de progreso de texto */
        .progress-text {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 20;
        }
        #loading-text {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        #loading-stats {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
        }
        #coordinates-display {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            color: white;
            z-index: 100;
            font-family: monospace;
        }
        #coordinates-toggle {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            z-index: 100;
        }
        
        /* Contenedor para los botones flotantes */
        .floating-buttons-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none; /* Initially hidden */
            gap: 20px; /* Espacio entre botones */
            z-index: 2000;
            /* Will be set to flex when visible */
        }
        
        /* Estilo para los botones flotantes con iconos */
        .floating-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 15px rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .floating-button:hover {
            background-color: rgba(0, 0, 0, 0.8);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }
        
        .floating-button img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            filter: brightness(10) contrast(1.5) invert(1); /* Hace que el icono sea más blanco y visible */
        }
        
        /* Estilo específico para iconos que ya son blancos */
        .floating-button img[src*="iconContact"],
        .floating-button img[src*="iconClientes"],
        .floating-button img[src*="iconServices"],
        .floating-button img[src*="iconProducts"] {
            filter: brightness(1.5) contrast(1.2); /* Sin invertir ya que la imagen ya es blanca */
        }
        
    </style>
</head>
<body>
    <div id="loading-container">
        <div class="coffee-container">
            <img src="images/icons/coffeGif.gif" class="coffee-gif" alt="Cargando...">
        </div>
    </div>

    <div id="info">
    </div>

    <div id="coordinates-display">
        <h3>Sistema de Coordenadas</h3>
        <div id="camera-position">Cámara: X: 0.00, Y: 0.00, Z: 0.00</div>
        <div id="camera-target">Objetivo: X: 0.00, Y: 0.00, Z: 0.00</div>
        <div id="mouse-position">Ratón: X: 0.00, Y: 0.00, Z: 0.00</div>
    </div>
    
    <button id="coordinates-toggle">Mostrar Coordenadas</button>
    
    <!-- Contenedor de botones flotantes -->
    <div class="floating-buttons-container">
        <!-- Botón flotante con el icono personalizado -->
        <div class="floating-button">
            <img src="images/icons/iconMe.png" alt="Icono personalizado">
        </div>
        <!-- Botón flotante con el icono de carpeta -->
        <div class="floating-button">
            <img src="images/icons/CarpetaPNG.png" alt="Icono de carpeta">
        </div>
        <!-- Botón flotante con el icono de contacto -->
        <div class="floating-button">
            <img src="images/icons/iconContact.png" alt="Icono de contacto">
        </div>
        <!-- Botón flotante con el icono de clientes -->
        <div class="floating-button">
            <img src="images/icons/iconClientes.png?v=3" alt="Icono de clientes">
        </div>
        <!-- Botón flotante con el icono de servicios -->
        <div class="floating-button">
            <img src="images/icons/iconServices.png?v=2" alt="Icono de servicios">
        </div>
        <!-- Botón flotante con el icono de productos -->
        <div class="floating-button">
            <img src="images/icons/iconProducts.png" alt="Icono de productos">
        </div>
    </div>

    <!-- Three.js core library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r132/three.min.js"></script>
    
    <!-- Three.js components - using same version and ensuring proper load order -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/renderers/CSS3DRenderer.js"></script>

    <script>
        // Configuración inicial
        let camera, scene, renderer, controls;
        let model = null;
        
        // Variables para el sistema de coordenadas
        let coordinatesVisible = false; // Inicialmente oculto
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let mousePosition = new THREE.Vector3();
        let axesHelper; // Para visualizar los ejes X, Y, Z
        
        // Variables para la animación de la cámara
        let cameraAnimation = {
            enabled: false,
            duration: 10080, // Duración de la animación en milisegundos (10.08 segundos - 25% más rápido)
            startTime: 0,
            initialPosition: new THREE.Vector3(),
            targetPosition: new THREE.Vector3(),
            initialTarget: new THREE.Vector3(),
            finalTarget: new THREE.Vector3(),
            originalControlsEnabled: true,
            waypoints: [] // Puntos intermedios para crear una trayectoria circular
        };
        
        // Variables para CSS3D y pantalla interactiva
        let css3dScene, css3dRenderer;
        let screenPlane; // Plano invisible para raycasting
        
        // Punto de origen personalizado (offset para el sistema de coordenadas)
        const originOffset = new THREE.Vector3(-10.00, -14.10, -2.20);
        
        // Elementos DOM
        const loadingContainer = document.getElementById('loading-container');

        // Inicializar la escena
        init();
        
        function init() {
            // Crear escena con fondo negro
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Crear cámara
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            
            // Crear renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Controles de órbita
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Configurar sistema de coordenadas
            setupCoordinateSystem();
            
            // Cargar el modelo
            loadModel();
            
            // Manejar redimensionamiento de ventana
            window.addEventListener('resize', onWindowResize);
            
            // Iniciar bucle de animación
            animate();
            
            // Configurar pantalla interactiva
            setupInteractiveScreen();
        }
        
        function setupCoordinateSystem() {
            // Crear ejes X, Y, Z (rojo, verde, azul)
            axesHelper = new THREE.AxesHelper(5); // Tamaño de 5 unidades para cada eje
            
            // Posicionar los ejes en el punto de origen personalizado
            axesHelper.position.copy(originOffset);
            
            // Añadir los ejes a la escena
            scene.add(axesHelper);
            
            // Configurar elementos de la UI
            const coordDisplay = document.getElementById('coordinates-display');
            const coordToggle = document.getElementById('coordinates-toggle');
            
            // Establecer visibilidad inicial basada en coordinatesVisible
            coordDisplay.style.display = coordinatesVisible ? 'block' : 'none';
            axesHelper.visible = coordinatesVisible;
            
            // Establecer texto y color inicial del botón
            coordToggle.textContent = coordinatesVisible ? 'Ocultar Coordenadas' : 'Mostrar Coordenadas';
            coordToggle.style.backgroundColor = coordinatesVisible ? '#f44336' : '#4CAF50';
            
            // Actualizar coordenadas solo si están visibles
            if (coordinatesVisible) {
                updateCoordinatesDisplay();
            }
            
            // Manejar eventos de ratón para raycasting
            document.addEventListener('mousemove', onMouseMove);
            
            // Configurar botón para mostrar/ocultar coordenadas
            coordToggle.addEventListener('click', function() {
                coordinatesVisible = !coordinatesVisible;
                
                // Actualizar visibilidad del display y los ejes
                coordDisplay.style.display = coordinatesVisible ? 'block' : 'none';
                axesHelper.visible = coordinatesVisible;
                
                // Actualizar texto del botón
                this.textContent = coordinatesVisible ? 'Ocultar Coordenadas' : 'Mostrar Coordenadas';
                this.style.backgroundColor = coordinatesVisible ? '#f44336' : '#4CAF50';
            });
        }
        
        // Función para calcular posición 3D del ratón mediante raycasting
        function onMouseMove(event) {
            if (!coordinatesVisible) return;
            
            // Calcular posición normalizada del ratón (-1 a +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Actualizar raycaster
            raycaster.setFromCamera(mouse, camera);
            
            // Calcular intersecciones con toda la escena, no solo el modelo
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            // Si hay intersección, actualizar posición del ratón en 3D
            if (intersects.length > 0) {
                mousePosition.copy(intersects[0].point);
                // Actualizar inmediatamente las coordenadas
                updateCoordinatesDisplay();
            }
        }
        
        // Función para actualizar la visualización de coordenadas
        function updateCoordinatesDisplay() {
            if (!coordinatesVisible) return;
            
            const camPos = camera.position;
            const target = controls.target;
            
            // Crear copias de los vectores para aplicar el offset
            const adjustedCamPos = new THREE.Vector3().copy(camPos).sub(originOffset);
            const adjustedTarget = new THREE.Vector3().copy(target).sub(originOffset);
            const adjustedMousePos = new THREE.Vector3().copy(mousePosition).sub(originOffset);
            
            // Formatear coordenadas con 2 decimales
            const formatCoord = (vec) => `X: ${vec.x.toFixed(2)}, Y: ${vec.y.toFixed(2)}, Z: ${vec.z.toFixed(2)}`;
            
            // Actualizar texto en la UI con coordenadas relativas al nuevo origen
            document.getElementById('camera-position').textContent = `Cámara: ${formatCoord(adjustedCamPos)}`;
            document.getElementById('camera-target').textContent = `Objetivo: ${formatCoord(adjustedTarget)}`;
            document.getElementById('mouse-position').textContent = `Ratón: ${formatCoord(adjustedMousePos)}`;
        }
        
        function loadModel() {
            // Crear loading manager para seguimiento de progreso
            const manager = new THREE.LoadingManager();
            
            // Setup progress tracking
            manager.onProgress = function(url, loaded, total) {
                // Solo seguimos el progreso sin mostrar texto
            };
            
            // Handle loading errors
            // Crear un mapa para rastrear intentos de carga de texturas
            const textureLoadAttempts = new Map();
            const MAX_TEXTURE_LOAD_ATTEMPTS = 3;
            
            // Función mejorada para intentar recargar una textura
            function retryTextureLoad(url, onSuccess, onError) {
                // Incrementar contador de intentos
                const attempts = textureLoadAttempts.get(url) || 0;
                textureLoadAttempts.set(url, attempts + 1);
                
                console.log(`Reintentando carga de textura (${attempts + 1}/${MAX_TEXTURE_LOAD_ATTEMPTS}): ${url}`);
                
                if (attempts < MAX_TEXTURE_LOAD_ATTEMPTS) {
                    // Special handling for blob URLs
                    if (url.startsWith('blob:')) {
                        console.log('Attempting to reload Blob URL texture with enhanced error handling');
                        
                        try {
                            // For Blob URLs, we'll try a different approach
                            const img = new Image();
                            img.crossOrigin = 'anonymous';
                            
                            img.onload = function() {
                                console.log('Blob URL image loaded successfully, creating texture');
                                const texture = new THREE.Texture(img);
                                texture.needsUpdate = true;
                                onSuccess(texture);
                            };
                            
                            img.onerror = function(err) {
                                console.error('Failed to load Blob URL image:', err);
                                onError(new Error(`Failed to load image from Blob URL: ${url}`));
                            };
                            
                            // Set the source to trigger loading
                            img.src = url;
                        } catch (e) {
                            console.error('Exception during Blob URL texture reload:', e);
                            onError(e);
                        }
                    } else {
                        // Standard approach for non-blob URLs
                        // Crear un nuevo cargador de texturas
                        const textureLoader = new THREE.TextureLoader();
                        textureLoader.crossOrigin = 'anonymous';
                        
                        // Intentar cargar la textura de nuevo
                        textureLoader.load(
                            url,
                            onSuccess,
                            undefined, // onProgress no se usa
                            onError
                        );
                    }
                } else {
                    console.error(`Máximo de intentos alcanzado para textura: ${url}`);
                    onError(new Error(`Máximo de intentos alcanzado (${MAX_TEXTURE_LOAD_ATTEMPTS})`));
                }
            }
            
            // Handle loading errors with retry mechanism and enhanced debugging
            manager.onError = function(url) {
                console.error('Error loading:', url);
                
                // Add detailed diagnostics for Blob URLs
                if (url.startsWith('blob:')) {
                    console.log('Debugging Blob URL:', url);
                    
                    // Check if the Blob URL is still valid
                    try {
                        const xhr = new XMLHttpRequest();
                        xhr.open('HEAD', url, false); // Synchronous request to check URL validity
                        xhr.onreadystatechange = function() {
                            if (xhr.readyState === 4) {
                                console.log(`Blob URL status: ${xhr.status}, valid: ${xhr.status !== 0 && xhr.status < 400}`);
                            }
                        };
                        xhr.send();
                    } catch (e) {
                        console.error('Error checking Blob URL validity:', e);
                    }
                }
                
                // Verificar si es una textura (por la extensión o tipo de URL)
                const isTexture = url.match(/\.(jpe?g|png|gif|bmp|tga|dds)$/i) || url.startsWith('blob:');
                
                if (isTexture) {
                    // Si es una textura, intentar recargarla
                    const attempts = textureLoadAttempts.get(url) || 0;
                    console.log(`Texture load attempt ${attempts + 1}/${MAX_TEXTURE_LOAD_ATTEMPTS} for: ${url}`);
                    
                    if (attempts < MAX_TEXTURE_LOAD_ATTEMPTS) {
                        console.log(`Error de carga de textura, reintentando: ${url}`);
                        // No mostrar error aún, intentaremos recargar
                        
                        // Add a small delay before retry to allow any pending operations to complete
                        setTimeout(() => {
                            retryTextureLoad(
                                url,
                                (texture) => {
                                    console.log(`Textura recargada con éxito: ${url}`);
                                    
                                    // Intentar aplicar la textura al material correspondiente
                                    if (model) {
                                        model.traverse((child) => {
                                            if (child.isMesh && child.material) {
                                                // Comprobar si este material usa la textura que falló
                                                const materials = Array.isArray(child.material) ? child.material : [child.material];
                                                
                                                materials.forEach(mat => {
                                                    // Comprobar todas las propiedades de textura comunes
                                                    const textureProps = ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap'];
                                                    
                                                    textureProps.forEach(prop => {
                                                        if (mat[prop] && mat[prop].image && mat[prop].image.src === url) {
                                                            console.log(`Aplicando textura recargada a ${child.name}.material.${prop}`);
                                                            mat[prop] = texture;
                                                            mat.needsUpdate = true;
                                                        }
                                                    });
                                                });
                                            }
                                        });
                                    }
                                },
                                (error) => {
                                    console.error(`Error al recargar textura (intento ${attempts + 1}/${MAX_TEXTURE_LOAD_ATTEMPTS}):`, error);
                                    
                                    if (attempts + 1 >= MAX_TEXTURE_LOAD_ATTEMPTS) {
                                        console.error(`Máximo de intentos alcanzado para textura: ${url}`);
                                        // Aquí podríamos mostrar un mensaje de error al usuario
                                    }
                                }
                            );
                        }, 1000); // Esperar 1 segundo antes de reintentar
                    } else {
                        console.error(`Máximo de intentos alcanzado para textura: ${url}`);
                        // Mostrar error al usuario
                    }
                } else {
                    console.error(`Error de carga no recuperable: ${url}`);
                    // Mostrar error al usuario para recursos no recuperables
                }
            };
            
            // Configurar el cargador GLTF con soporte para Draco
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
            
            const loader = new THREE.GLTFLoader(manager);
            loader.setDRACOLoader(dracoLoader);
            
            // Cargar el modelo
            loader.load(
                'Modelo3DCafeColombiano.glb',
                function(gltf) {
                    model = gltf.scene;
                    
                    // Ajustar posición y escala
                    model.position.copy(originOffset);
                    model.scale.set(1, 1, 1);
                    
                    // Añadir a la escena
                    scene.add(model);
                    
                    // Ocultar pantalla de carga cuando el modelo esté listo
                    loadingContainer.style.opacity = 0;
                    setTimeout(() => {
                        loadingContainer.style.display = 'none';
                    }, 500);
                    
                    // Mostrar botones flotantes
                    document.querySelector('.floating-buttons-container').style.display = 'flex';
                    
                    // Configurar animación de cámara
                    setupCameraAnimation();
                },
                function(xhr) {
                    // Actualizar progreso
                    const percentComplete = (xhr.loaded / xhr.total) * 100;
                    // No mostramos el progreso en la UI
                },
                function(error) {
                    console.error('Error loading model:', error);
                }
            );
        }
        
        function setupCameraAnimation() {
            // Definir puntos de vista interesantes alrededor del modelo
            const viewpoints = [
                { position: new THREE.Vector3(0, 5, 10).add(originOffset), target: new THREE.Vector3(0, 0, 0).add(originOffset) },
                { position: new THREE.Vector3(10, 5, 0).add(originOffset), target: new THREE.Vector3(0, 0, 0).add(originOffset) },
                { position: new THREE.Vector3(0, 5, -10).add(originOffset), target: new THREE.Vector3(0, 0, 0).add(originOffset) },
                { position: new THREE.Vector3(-10, 5, 0).add(originOffset), target: new THREE.Vector3(0, 0, 0).add(originOffset) }
            ];
            
            // Configurar waypoints para la animación circular
            cameraAnimation.waypoints = viewpoints;
            
            // Iniciar la animación
            startCameraAnimation();
        }
        
        function startCameraAnimation() {
            // Guardar estado inicial
            cameraAnimation.initialPosition.copy(camera.position);
            cameraAnimation.initialTarget.copy(controls.target);
            cameraAnimation.originalControlsEnabled = controls.enabled;
            
            // Configurar animación
            cameraAnimation.enabled = true;
            cameraAnimation.startTime = Date.now();
            
            // Deshabilitar controles durante la animación
            controls.enabled = false;
        }
        
        function updateCameraAnimation() {
            if (!cameraAnimation.enabled) return;
            
            const elapsed = Date.now() - cameraAnimation.startTime;
            const duration = cameraAnimation.duration;
            
            if (elapsed >= duration) {
                // Finalizar animación
                cameraAnimation.enabled = false;
                controls.enabled = cameraAnimation.originalControlsEnabled;
                return;
            }
            
            // Calcular progreso (0 a 1)
            const progress = elapsed / duration;
            
            // Aplicar easing para suavizar el movimiento
            const easedProgress = easeInOutCubic(progress);
            
            // Calcular índice del waypoint actual y siguiente
            const totalWaypoints = cameraAnimation.waypoints.length;
            const waypointDuration = duration / totalWaypoints;
            const currentWaypointIndex = Math.floor((elapsed % duration) / waypointDuration);
            const nextWaypointIndex = (currentWaypointIndex + 1) % totalWaypoints;
            
            // Calcular progreso dentro del segmento actual (0 a 1)
            const segmentProgress = (elapsed % waypointDuration) / waypointDuration;
            const easedSegmentProgress = easeInOutCubic(segmentProgress);
            
            // Obtener waypoints actual y siguiente
            const currentWaypoint = cameraAnimation.waypoints[currentWaypointIndex];
            const nextWaypoint = cameraAnimation.waypoints[nextWaypointIndex];
            
            // Interpolar posición y objetivo
            camera.position.lerpVectors(
                currentWaypoint.position,
                nextWaypoint.position,
                easedSegmentProgress
            );
            
            controls.target.lerpVectors(
                currentWaypoint.target,
                nextWaypoint.target,
                easedSegmentProgress
            );
            
            // Actualizar controles
            controls.update();
        }
        
        function onWindowResize() {
            // Actualizar cámara
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            
            // Actualizar renderers
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (css3dRenderer) {
                css3dRenderer.setSize(window.innerWidth, window.innerHeight);
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Actualizar controles
            controls.update();
            
            // Actualizar animación de cámara si está activa
            if (cameraAnimation.enabled) {
                updateCameraAnimation();
            }
            
            // Actualizar coordenadas si están visibles
            if (coordinatesVisible) {
                updateCoordinatesDisplay();
            }
            
            // Renderizar escena
            renderer.render(scene, camera);
            
            // Renderizar CSS3D si está disponible
            if (css3dRenderer && css3dScene) {
                css3dRenderer.render(css3dScene, camera);
            }
        }
        
        // Función de easing para suavizar la animación
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

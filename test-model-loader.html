<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple 3D Model Loader</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            max-width: 400px;
            z-index: 100;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #progress-bar {
            width: 80%;
            max-width: 500px;
            height: 30px;
            background-color: #333;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }
        #progress {
            height: 100%;
            width: 0%;
            background-color: #4CAF50;
            transition: width 0.3s;
        }
        #status {
            font-size: 18px;
            margin-bottom: 10px;
        }
        #error {
            color: #ff5555;
            text-align: center;
            max-width: 80%;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>Cargando Modelo</h2>
        <div id="status">Inicializando...</div>
        <div id="progress-bar">
            <div id="progress"></div>
        </div>
        <div id="error"></div>
    </div>

    <div id="info">
        <h2>Test Model Loader</h2>
        <p>Probando carga de modelo 3D</p>
    </div>

    <!-- Three.js libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r132/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/DRACOLoader.js"></script>

    <script>
        // Basic Three.js setup
        let camera, scene, renderer, controls;
        let model = null;
        
        // UI elements
        const loadingScreen = document.getElementById('loading');
        const progressBar = document.getElementById('progress');
        const statusText = document.getElementById('status');
        const errorText = document.getElementById('error');
        
        // Initialize scene
        init();
        
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Add controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            // Add lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Load model
            loadModel();
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
            
            // Start animation loop
            animate();
        }
        
        function loadModel() {
            statusText.textContent = "Preparando carga...";
            
            // Create loading manager
            const manager = new THREE.LoadingManager();
            
            // Setup progress tracking
            manager.onProgress = function(url, loaded, total) {
                const percent = (loaded / total) * 100;
                progressBar.style.width = percent + '%';
                statusText.textContent = `Cargando... ${Math.round(percent)}%`;
            };
            
            // Handle loading errors
            manager.onError = function(url) {
                console.error('Error loading:', url);
                showError(`Error cargando recurso: ${url}`);
            };
            
            // Create GLTF loader
            const loader = new THREE.GLTFLoader(manager);
            
            // Setup Draco decoder
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
            loader.setDRACOLoader(dracoLoader);
            
            // Log versions for debugging
            console.log("THREE.js version:", THREE.REVISION);
            console.log("GLTFLoader version:", THREE.GLTFLoader ? THREE.GLTFLoader.REVISION : "undefined");
            
            // Try loading with the first filename
            const modelUrl = "Modelo3DCafeColombiano.glb";
            console.log("Intentando cargar:", modelUrl);
            
            loader.load(
                modelUrl,
                // Success callback
                function(gltf) {
                    console.log("Modelo cargado exitosamente");
                    
                    // Process the loaded model
                    model = gltf.scene;
                    
                    // Center model
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    model.position.x = -center.x;
                    model.position.y = -center.y;
                    model.position.z = -center.z;
                    
                    // Add to scene
                    scene.add(model);
                    
                    // Hide loading screen
                    loadingScreen.style.display = 'none';
                    
                    // Update camera position
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    camera.position.set(maxDim, maxDim * 0.5, maxDim);
                    camera.lookAt(0, 0, 0);
                    
                    // Update info
                    document.getElementById('info').innerHTML += `
                        <p style="color: #4CAF50;">Modelo cargado correctamente</p>
                        <p>Nombre del archivo: ${modelUrl}</p>
                    `;
                },
                // Progress callback
                function(xhr) {
                    if (xhr.lengthComputable) {
                        const percent = (xhr.loaded / xhr.total) * 100;
                        progressBar.style.width = percent + '%';
                        
                        const loadedMB = (xhr.loaded / (1024 * 1024)).toFixed(2);
                        const totalMB = (xhr.total / (1024 * 1024)).toFixed(2);
                        statusText.textContent = `Cargando... ${loadedMB} MB de ${totalMB} MB (${Math.round(percent)}%)`;
                    }
                },
                // Error callback
                function(error) {
                    console.error("Error cargando modelo:", error);
                    
                    // Try alternative filename
                    const alternativeUrl = "Modelo3DCafeColombiana.glb";
                    console.log("Intentando con nombre alternativo:", alternativeUrl);
                    
                    loader.load(
                        alternativeUrl,
                        // Success callback for alternative
                        function(gltf) {
                            console.log("Modelo alternativo cargado exitosamente");
                            
                            // Process the loaded model
                            model = gltf.scene;
                            
                            // Center model
                            const box = new THREE.Box3().setFromObject(model);
                            const center = box.getCenter(new THREE.Vector3());
                            model.position.x = -center.x;
                            model.position.y = -center.y;
                            model.position.z = -center.z;
                            
                            // Add to scene
                            scene.add(model);
                            
                            // Hide loading screen
                            loadingScreen.style.display = 'none';
                            
                            // Update camera position
                            const size = box.getSize(new THREE.Vector3());
                            const maxDim = Math.max(size.x, size.y, size.z);
                            camera.position.set(maxDim, maxDim * 0.5, maxDim);
                            camera.lookAt(0, 0, 0);
                            
                            // Update info
                            document.getElementById('info').innerHTML += `
                                <p style="color: #4CAF50;">Modelo alternativo cargado correctamente</p>
                                <p>Nombre del archivo: ${alternativeUrl}</p>
                            `;
                        },
                        // Progress callback for alternative
                        function(xhr) {
                            if (xhr.lengthComputable) {
                                const percent = (xhr.loaded / xhr.total) * 100;
                                progressBar.style.width = percent + '%';
                                
                                const loadedMB = (xhr.loaded / (1024 * 1024)).toFixed(2);
                                const totalMB = (xhr.total / (1024 * 1024)).toFixed(2);
                                statusText.textContent = `Cargando alternativo... ${loadedMB} MB de ${totalMB} MB (${Math.round(percent)}%)`;
                            }
                        },
                        // Error callback for alternative
                        function(secondError) {
                            console.error("Error cargando modelo alternativo:", secondError);
                            showError(`No se pudo cargar el modelo con ninguno de los nombres de archivo. Error: ${secondError.message}`);
                        }
                    );
                }
            );
        }
        
        function showError(message) {
            console.error("ERROR:", message);
            errorText.textContent = message;
            errorText.style.display = 'block';
            progressBar.style.backgroundColor = '#ff3333';
            statusText.style.color = '#ff3333';
            
            // Add retry button
            const retryButton = document.createElement('button');
            retryButton.textContent = "Reintentar";
            retryButton.style.marginTop = "20px";
            retryButton.style.padding = "10px 20px";
            retryButton.style.backgroundColor = "#4CAF50";
            retryButton.style.color = "white";
            retryButton.style.border = "none";
            retryButton.style.borderRadius = "5px";
            retryButton.style.cursor = "pointer";
            
            retryButton.addEventListener('click', function() {
                location.reload();
            });
            
            loadingScreen.appendChild(retryButton);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

N<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed 3D Model Loader</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            max-width: 400px;
            z-index: 100;
        }
        #loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
            overflow: hidden;
        }
        
        /* Estilos para el botón de activar música */
        .music-button {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 10px 25px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Estilos para el botón de control de música en la esquina superior derecha */
        .music-control-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            opacity: 0.7;
            z-index: 1100;
        }
        
        /* Contenedor para el botón y el control de volumen */
        .music-control-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1100;
        }
        
        /* Estilos para el control deslizante de volumen */
        .volume-slider-container {
            position: absolute;
            top: 49px; /* Ajustado 1mm hacia abajo */
            right: 15px; /* Ajustado un poco más hacia la izquierda */
            width: 20px;
            height: 100px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Mostrar el control de volumen al pasar el mouse sobre el contenedor */
        .music-control-container:hover .volume-slider-container {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        
        /* Estilo para el slider vertical */
        .volume-slider {
            -webkit-appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            transform: rotate(270deg);
            transform-origin: center;
            position: relative;
            top: 40px;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }
        
        .volume-slider::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
        }
        
        /* Valor del volumen */
        .volume-value {
            color: white;
            font-size: 10px;
            margin-top: 5px;
            position: absolute;
            bottom: 10px;
            font-family: Arial, sans-serif;
        }
        
        .music-control-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            opacity: 1;
        }
        
        .music-control-button:active {
            transform: scale(0.95);
        }
        
        /* Icono de música para el botón de control */
        .music-control-icon {
            width: 20px;
            height: 20px;
            position: relative;
        }
        
        /* Icono de música activada */
        .music-on .music-control-icon::before,
        .music-on .music-control-icon::after {
            content: '';
            position: absolute;
            background-color: white;
        }
        
        .music-on .music-control-icon::before {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            top: 0;
            left: 0;
            box-shadow: 10px 0 0 0 white;
        }
        
        .music-on .music-control-icon::after {
            width: 2px;
            height: 10px;
            top: 6px;
            left: 2px;
            box-shadow: 10px 0 0 0 white;
        }
        
        /* Icono de música desactivada (con una línea diagonal) */
        .music-off .music-control-icon::before,
        .music-off .music-control-icon::after {
            content: '';
            position: absolute;
            background-color: white;
        }
        
        .music-off .music-control-icon::before {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            top: 0;
            left: 0;
            box-shadow: 10px 0 0 0 white;
            opacity: 0.5;
        }
        
        .music-off .music-control-icon::after {
            width: 2px;
            height: 10px;
            top: 6px;
            left: 2px;
            box-shadow: 10px 0 0 0 white;
            opacity: 0.5;
        }
        
        .music-off::before {
            content: '';
            position: absolute;
            width: 24px;
            height: 2px;
            background-color: white;
            transform: rotate(45deg);
            z-index: 1;
        }
        
        /* Se eliminaron los estilos del control de volumen */
        
        .music-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            opacity: 1;
        }
        
        .music-button:active {
            transform: translateX(-50%) scale(0.98);
        }
        
        .music-icon {
            width: 16px;
            height: 16px;
            display: inline-block;
            position: relative;
        }
        
        .music-icon::before,
        .music-icon::after {
            content: '';
            position: absolute;
            background-color: white;
        }
        
        .music-icon::before {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            top: 0;
            left: 0;
            box-shadow: 10px 0 0 0 white;
        }
        
        .music-icon::after {
            width: 2px;
            height: 10px;
            top: 6px;
            left: 2px;
            box-shadow: 10px 0 0 0 white;
        }
        /* Estilos para el GIF de la taza de café */
        .coffee-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }
        .coffee-gif {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 10;
            /* Filtros para eliminar el fondo #fff4cc y hacer el café de color café */
            filter: brightness(1.1) contrast(1.5) invert(1) hue-rotate(180deg);
            mix-blend-mode: exclusion;
            transform: scale(0.75); /* Tamaño reducido */
        }
        /* Indicador de progreso de texto */
        .progress-text {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 20;
        }
        #loading-text {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        #loading-stats {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
        }
        #coordinates-display {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            color: white;
            z-index: 100;
            font-family: monospace;
        }
        #coordinates-toggle {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            z-index: 100;
        }
        
        /* Contenedor para los botones flotantes */
        .floating-buttons-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none; /* Initially hidden */
            gap: 20px; /* Espacio entre botones */
            z-index: 2000;
            /* Will be set to flex when visible */
        }
        
        /* Estilo para los botones flotantes con iconos */
        .floating-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 15px rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .floating-button:hover {
            background-color: rgba(0, 0, 0, 0.8);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }
        
        .floating-button img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            filter: brightness(10) contrast(1.5) invert(1); /* Hace que el icono sea más blanco y visible */
        }
        
        /* Estilo específico para iconos que ya son blancos */
        .floating-button img[src*="iconContact"],
        .floating-button img[src*="iconClientes"],
        .floating-button img[src*="iconServices"],
        .floating-button img[src*="iconProducts"] {
            filter: brightness(1.5) contrast(1.2); /* Sin invertir ya que la imagen ya es blanca */
        }
        
    </style>
</head>
<body>
    <!-- No incluimos los controles aquí, los crearemos dinámicamente después de la carga -->
    
    <div id="loading-container">
        <div class="coffee-container">
            <img src="media/icons/coffeGif.gif" class="coffee-gif" alt="Cargando...">
        </div>
        
        <!-- Botón para activar música -->
        <button id="music-activate-btn" class="music-button">
            <span class="music-icon"></span>
            Activar Música
        </button>
        </div>
    </div>
    
    <!-- YouTube iframe for background music (hidden) -->
    <div id="youtube-container" style="position: fixed; bottom: 0; right: 0; width: 1px; height: 1px; opacity: 0.01; z-index: -1; pointer-events: none;">
        <!-- The iframe will be added when loading reaches 93% -->
    </div>

    <div id="info">
    </div>

    <div id="coordinates-display">
        <h3>Sistema de Coordenadas</h3>
        <div id="camera-position">Cámara: X: 0.00, Y: 0.00, Z: 0.00</div>
        <div id="camera-target">Objetivo: X: 0.00, Y: 0.00, Z: 0.00</div>
        <div id="mouse-position">Ratón: X: 0.00, Y: 0.00, Z: 0.00</div>
    </div>
    
    <button id="coordinates-toggle">Mostrar Coordenadas</button>
    
    <!-- Contenedor de botones flotantes -->
    <div class="floating-buttons-container">
        <!-- Botón flotante con el icono personalizado -->
        <div class="floating-button">
            <img src="media/icons/iconMe.png" alt="Icono personalizado">
        </div>
        <!-- Botón flotante con el icono de carpeta -->
        <div class="floating-button">
            <img src="media/icons/CarpetaPNG.png" alt="Icono de carpeta">
        </div>
        <!-- Botón flotante con el icono de contacto -->
        <div class="floating-button">
            <img src="media/icons/iconContact.png" alt="Icono de contacto">
        </div>
        <!-- Botón flotante con el icono de clientes -->
        <div class="floating-button">
            <img src="media/icons/iconClientes.png?v=3" alt="Icono de clientes">
        </div>
        <!-- Botón flotante con el icono de servicios -->
        <div class="floating-button">
            <img src="media/icons/iconServices.png?v=2" alt="Icono de servicios">
        </div>
        <!-- Botón flotante con el icono de productos -->
        <div class="floating-button">
            <img src="media/icons/iconProducts.png" alt="Icono de productos">
        </div>
    </div>

    <!-- Three.js core library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r132/three.min.js"></script>
    
    <!-- Three.js components - using same version and ensuring proper load order -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/renderers/CSS3DRenderer.js"></script>
    
    <!-- Custom music autoplay script -->
    <script src="music-autoplay.js"></script>

    <script>
        // Configuración inicial
        let camera, scene, renderer, controls;
        let model = null;
        
        // Configuración de música de fondo
        const musicTriggerPercentage = 90; // Reproducir cuando la carga llegue al 90%
        let musicPlayed = false;
        let musicButtonClicked = false;
        let musicMuted = false;
        let musicControlCreated = false;
        
        // YouTube video ID from the provided URL
        const youtubeVideoId = 'uALnlDC4yug';
        
        // Variables para rastrear el estado de la pantalla about-me
        let aboutMeIframeReady = false;
        let aboutMeScreenOn = false;
        let aboutMeIframe = null;
        let aboutMePlane = null;
        let aboutMeButtonClicked = false; // Nueva variable para rastrear si se ha hecho clic en el botón
        
        // Variables para el segundo plano About Me duplicado
        let aboutMe2IframeReady = false;
        let projectsScreenOn = false; // Cambié de aboutMe2 a projects
        let projectsIframe = null; // Cambié de aboutMe2 a projects
        let projectsPlane = null; // Cambié de aboutMe2 a projects
        let projectsButtonClicked = false; // Cambié de aboutMe2 a projects
        let projectsIframeReady = false; // Variable para rastrear si el iframe de projects está listo
        
        // Variables para la pantalla de contacto
        let contactScreenOn = false;
        let contactIframe = null;
        let contactPlane = null;
        let contactButtonClicked = false;
        let contactIframeReady = false;
        
        // Variables para cafe-menu
        let cafeMenuScreenOn = false;
        let cafeMenuIframe = null;
        let cafeMenuPlane = null;
        let cafeMenuButtonClicked = false;
        let cafeMenuIframeReady = false;
        
        // Escuchar mensajes de los iframes
        window.addEventListener('message', function(event) {
            console.log("Mensaje recibido en fixed-advanced-loader:", event.data);
            
            // Verificar si es el mensaje de que about-me.html está listo
            if (event.data && event.data.action === 'aboutMeReady') {
                console.log("Iframe de about-me.html está listo");
                aboutMeIframeReady = true;
                
                // Buscar el iframe de about-me.html
                const iframes = document.querySelectorAll('iframe');
                iframes.forEach(iframe => {
                    if (iframe.src && iframe.src.includes('about-me.html')) {
                        console.log("Encontrado iframe de about-me.html en el evento aboutMeReady");
                        aboutMeIframe = iframe;
                    }
                });
            }
            
            // Recibir confirmación de que la pantalla se encendió
            if (event.data && event.data.action === 'aboutMeScreenTurnedOn') {
                console.log("Recibida confirmación de que la pantalla de about-me se encendió");
                aboutMeScreenOn = true;
                
                // Solo hacer transparente el plano negro si el botón ha sido clickeado
                if (aboutMeButtonClicked && window.aboutMeScreenMaterial) {
                    window.aboutMeScreenMaterial.transparent = true;
                    window.aboutMeScreenMaterial.opacity = 0.0;
                    window.aboutMeScreenMaterial.needsUpdate = true;
                }
                
                // Solo mostrar el contenido HTML si el botón ha sido clickeado y estamos viendo desde el frente
                if (aboutMeButtonClicked && window.aboutMeCssObject && window.aboutMeCssObject.element && isAboutMePlaneVisibleFromFront()) {
                    window.aboutMeCssObject.element.style.visibility = 'visible';
                    window.aboutMeCssObject.element.style.pointerEvents = 'auto';
                }
            }
            
            // Recibir confirmación de que la pantalla se apagó
            if (event.data && event.data.action === 'aboutMeScreenTurnedOff') {
                console.log("Recibida confirmación de que la pantalla de about-me se apagó");
                aboutMeScreenOn = false;
                
                // Forzar que el cover negro sea visible cuando se apaga la pantalla
                if (window.aboutMeScreenMaterial && window.aboutMeBackPlane) {
                    window.aboutMeScreenMaterial.color.set(0x000000); // Asegurar color negro
                    window.aboutMeScreenMaterial.transparent = false;
                    window.aboutMeScreenMaterial.opacity = 1.0;
                    window.aboutMeScreenMaterial.needsUpdate = true;
                    window.aboutMeBackPlane.visible = true;
                    console.log("Cover negro forzado a visible al apagar pantalla");
                }
                
                // Ocultar el contenido HTML
                if (window.aboutMeCssObject && window.aboutMeCssObject.element) {
                    window.aboutMeCssObject.element.style.visibility = 'hidden';
                    window.aboutMeCssObject.element.style.pointerEvents = 'none';
                }
            }
            
            // ==========================================================
            // EVENT LISTENERS PARA EL SEGUNDO PLANO ABOUT ME DUPLICADO
            // ==========================================================
            
            // Verificar si es el mensaje de que projects.html está listo
            if (event.data && event.data.action === 'projectsReady') {
                console.log("Iframe de projects.html está listo");
                aboutMe2IframeReady = true; // Mantengo esta variable por compatibilidad
                
                // Buscar el iframe de projects.html
                const iframes = document.querySelectorAll('iframe');
                iframes.forEach(iframe => {
                    if (iframe.src && iframe.src.includes('projects.html')) {
                        console.log("Encontrado iframe de projects.html en el evento projectsReady");
                        projectsIframe = iframe;
                    }
                });
            }
            
            // Recibir confirmación de que la pantalla de projects se encendió
            if (event.data && event.data.action === 'projectsScreenTurnedOn') {
                console.log("Recibida confirmación de que la pantalla de projects se encendió");
                projectsScreenOn = true;
                
                // Solo hacer transparente el plano negro si el botón ha sido clickeado
                if (projectsButtonClicked && window.aboutMe2ScreenMaterial) {
                    window.aboutMe2ScreenMaterial.transparent = true;
                    window.aboutMe2ScreenMaterial.opacity = 0.0;
                    window.aboutMe2ScreenMaterial.needsUpdate = true;
                }
                
                // Solo mostrar el contenido HTML si el botón ha sido clickeado y estamos viendo desde el frente
                if (projectsButtonClicked && window.aboutMe2CssObject && window.aboutMe2CssObject.element && isAboutMe2PlaneVisibleFromFront()) {
                    window.aboutMe2CssObject.element.style.visibility = 'visible';
                    window.aboutMe2CssObject.element.style.pointerEvents = 'auto';
                }
            }
            
            // Recibir confirmación de que la pantalla de projects se apagó
            if (event.data && event.data.action === 'projectsScreenTurnedOff') {
                console.log("Recibida confirmación de que la pantalla de projects se apagó");
                projectsScreenOn = false;
                
                // Forzar que el cover negro sea visible cuando se apaga la pantalla
                if (window.aboutMe2ScreenMaterial && window.aboutMe2BackPlane) {
                    window.aboutMe2ScreenMaterial.color.set(0x000000); // Asegurar color negro
                    window.aboutMe2ScreenMaterial.transparent = false;
                    window.aboutMe2ScreenMaterial.opacity = 1.0;
                    window.aboutMe2ScreenMaterial.needsUpdate = true;
                    window.aboutMe2BackPlane.visible = true;
                    console.log("Cover negro forzado a visible al apagar pantalla de projects");
                }
                
                // Ocultar el contenido HTML
                if (window.aboutMe2CssObject && window.aboutMe2CssObject.element) {
                    window.aboutMe2CssObject.element.style.visibility = 'hidden';
                    window.aboutMe2CssObject.element.style.pointerEvents = 'none';
                }
            }
            
            // ==========================================================
            // EVENT LISTENERS PARA LA PANTALLA DE CONTACTO
            // ==========================================================
            
            // Verificar si es el mensaje de que contact.html está listo
            if (event.data && event.data.action === 'contactReady') {
                console.log("🟢 Iframe de contact.html está listo");
                contactIframeReady = true;
                
                // Buscar el iframe de contact.html
                const iframes = document.querySelectorAll('iframe');
                iframes.forEach(iframe => {
                    if (iframe.src && iframe.src.includes('contact.html')) {
                        console.log("🎯 Encontrado iframe de contact.html en el evento contactReady");
                        contactIframe = iframe;
                    }
                });
                
                // AUTO-activador de testing REMOVIDO - la pantalla solo se activa con el botón
            }
            
            // Recibir confirmación de que la pantalla de contact se encendió
            if (event.data && event.data.action === 'contactScreenTurnedOn') {
                console.log("Recibida confirmación de que la pantalla de contact se encendió");
                contactScreenOn = true;
                
                // Solo hacer transparente el plano negro si el botón ha sido clickeado
                if (contactButtonClicked && window.contactScreenMaterial) {
                    window.contactScreenMaterial.transparent = true;
                    window.contactScreenMaterial.opacity = 0.0;
                    window.contactScreenMaterial.needsUpdate = true;
                }
                
                // Solo mostrar el contenido HTML si el botón ha sido clickeado y estamos viendo desde el frente
                if (contactButtonClicked && window.contactCssObject && window.contactCssObject.element && isContactPlaneVisibleFromFront()) {
                    window.contactCssObject.element.style.visibility = 'visible';
                    window.contactCssObject.element.style.pointerEvents = 'auto';
                }
            }
            
            // Recibir confirmación de que la pantalla de contact se apagó
            if (event.data && event.data.action === 'contactScreenTurnedOff') {
                console.log("Recibida confirmación de que la pantalla de contact se apagó");
                contactScreenOn = false;
                
                // Forzar que el cover negro sea visible cuando se apaga la pantalla
                if (window.contactScreenMaterial && window.contactBackPlane) {
                    window.contactScreenMaterial.color.set(0x000000); // Asegurar color negro
                    window.contactScreenMaterial.transparent = false;
                    window.contactScreenMaterial.opacity = 1.0;
                    window.contactScreenMaterial.needsUpdate = true;
                    window.contactBackPlane.visible = true;
                    console.log("Cover negro forzado a visible al apagar pantalla de contact");
                }
                
                // Ocultar el contenido HTML
                if (window.contactCssObject && window.contactCssObject.element) {
                    window.contactCssObject.element.style.visibility = 'hidden';
                    window.contactCssObject.element.style.pointerEvents = 'none';
                }
            }
            
            // Recibir confirmación de que la pantalla se encendió por clic
            if (event.data && event.data.action === 'aboutMeScreenTurnedOnByClick') {
                console.log("Recibida confirmación de que la pantalla de about-me se encendió por clic");

        // Función para verificar si un punto está dentro del plano de about-me
        function isPointInAboutMePlane(point) {
            // Si no tenemos referencia al plano, no podemos verificar
            if (!window.brownPlane) {
                return false;
            }
            
            // Guardar referencia al plano de about-me
            aboutMePlane = window.brownPlane;
            
            // Crear un raycaster desde la cámara hasta el punto del clic
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(point, camera);
            
            // Verificar si el rayo intersecta con el plano de about-me
            const intersects = raycaster.intersectObject(aboutMePlane);
            
            // Si hay intersecciones, el clic fue en el plano
            return intersects.length > 0;
        }
        
        // Función para verificar si la cámara está viendo el plano de about-me desde el frente
        function isAboutMePlaneVisibleFromFront() {
            if (!window.brownPlane || !camera) {
                return false;
            }
            
            // Obtener la normal del plano (dirección hacia donde "mira" el plano)
            // Invertimos la normal para que apunte hacia el lado correcto
            const planeNormal = new THREE.Vector3(0, 0, -1); // Normal invertida
            planeNormal.applyQuaternion(window.brownPlane.quaternion); // Aplicar rotación del plano
            
            // Obtener la dirección desde el plano hacia la cámara
            const cameraDirection = new THREE.Vector3();
            cameraDirection.subVectors(camera.position, window.brownPlane.position).normalize();
            
            // Calcular el ángulo entre la normal del plano y la dirección de la cámara
            const dotProduct = planeNormal.dot(cameraDirection);
            
            // Si el producto punto es positivo, la cámara está viendo el frente del plano
            // Usamos un umbral para dar un poco de tolerancia en el ángulo
            const threshold = 0.1; // Permite hasta ~84 grados de ángulo
            return dotProduct > threshold;
        }

        // Función para verificar si un punto está dentro del plano de projects
        function isPointInProjectsPlane(point) {
            // Si no tenemos referencia al plano, no podemos verificar
            if (!window.projectsPlane) {
                return false;
            }
            
            // Crear un raycaster desde la cámara hasta el punto del clic
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(point, camera);
            
            // Verificar si el rayo intersecta con el plano de projects
            const intersects = raycaster.intersectObject(window.projectsPlane);
            
            // Si hay intersecciones, el clic fue en el plano
            return intersects.length > 0;
        }
        
        // Función para verificar si la cámara está viendo el plano de projects desde el frente
        function isProjectsPlaneVisibleFromFront() {
            if (!window.projectsPlane || !camera) {
                return false;
            }
            
            // Obtener la normal del plano (dirección hacia donde "mira" el plano)
            // Invertimos la normal para que apunte hacia el lado correcto
            const planeNormal = new THREE.Vector3(0, 0, -1); // Normal invertida
            planeNormal.applyQuaternion(window.projectsPlane.quaternion); // Aplicar rotación del plano
            
            // Obtener la dirección desde el plano hacia la cámara
            const cameraDirection = new THREE.Vector3();
            cameraDirection.subVectors(camera.position, window.projectsPlane.position).normalize();
            
            // Calcular el ángulo entre la normal del plano y la dirección de la cámara
            const dotProduct = planeNormal.dot(cameraDirection);
            
            // Si el producto punto es positivo, la cámara está viendo el frente del plano
            // Usamos un umbral para dar un poco de tolerancia en el ángulo
            const threshold = 0.1; // Permite hasta ~84 grados de ángulo
            return dotProduct > threshold;
        }
        
        // Función para verificar si la cámara está viendo el plano de contacto desde el frente
        function isContactPlaneVisibleFromFront() {
            if (!window.contactPlane || !camera) {
                console.log("❌ contactPlane o camera no disponibles:", {

            // Obtener la normal del plano (dirección hacia donde "mira" el plano)
            // Invertimos la normal para que apunte hacia el lado correcto
            const planeNormal = new THREE.Vector3(0, 0, -1); // Normal invertida
            planeNormal.applyQuaternion(window.contactPlane.quaternion); // Aplicar rotación del plano
            
            // Obtener la dirección desde el plano hacia la cámara
            const cameraDirection = new THREE.Vector3();
            cameraDirection.subVectors(camera.position, window.contactPlane.position).normalize();
            
            // Calcular el ángulo entre la normal del plano y la dirección de la cámara
            const dotProduct = planeNormal.dot(cameraDirection);
            
            // Si el producto punto es positivo, la cámara está viendo el frente del plano
            // Usamos un umbral para dar un poco de tolerancia en el ángulo
            const threshold = 0.1; // Permite hasta ~84 grados de ángulo
            const result = dotProduct > threshold;
            
            // Solo log cuando cambie el estado de visibilidad

                return;

            // Convertir las coordenadas del clic a coordenadas normalizadas (-1 a 1)
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;

        // Función para controlar el audio (definida globalmente para poder usarla más tarde)
        function controlAudio(mute) {
            musicMuted = mute;
            
            // Si hay un iframe de YouTube, silenciarlo o activarlo
            const iframe = document.querySelector('#youtube-container iframe');
            if (iframe && iframe.contentWindow) {
                if (mute) {
                    iframe.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
                    console.log('YouTube video silenciado');
                } else {
                    iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                    // Set volume to 0.01 (1%)
                    iframe.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[1]}', '*');
                    console.log('YouTube video activado con volumen al 1%');
                }
            }
        }

        function setupCoordinateSystem() {
            // Crear ejes X, Y, Z (rojo, verde, azul)
            axesHelper = new THREE.AxesHelper(5); // Tamaño de 5 unidades para cada eje
            
            // Posicionar los ejes en el punto de origen personalizado
            axesHelper.position.copy(originOffset);
            
            // Añadir los ejes a la escena
            scene.add(axesHelper);
            
            // Configurar elementos de la UI
            const coordDisplay = document.getElementById('coordinates-display');
            const coordToggle = document.getElementById('coordinates-toggle');
            
            // Establecer visibilidad inicial basada en coordinatesVisible
            coordDisplay.style.display = coordinatesVisible ? 'block' : 'none';
            axesHelper.visible = coordinatesVisible;
            
            // Establecer texto y color inicial del botón
            coordToggle.textContent = coordinatesVisible ? 'Ocultar Coordenadas' : 'Mostrar Coordenadas';
            coordToggle.style.backgroundColor = coordinatesVisible ? '#f44336' : '#4CAF50';
            
            // Actualizar coordenadas solo si están visibles
            if (coordinatesVisible) {
                updateCoordinatesDisplay();
            }
            
            // Manejar eventos de ratón para raycasting
            document.addEventListener('mousemove', onMouseMove);
            
            // Configurar botón para mostrar/ocultar coordenadas
            coordToggle.addEventListener('click', function() {
                coordinatesVisible = !coordinatesVisible;
                
                // Actualizar visibilidad del display y los ejes
                coordDisplay.style.display = coordinatesVisible ? 'block' : 'none';
                axesHelper.visible = coordinatesVisible;
                
                // Actualizar texto del botón
                this.textContent = coordinatesVisible ? 'Ocultar Coordenadas' : 'Mostrar Coordenadas';
                this.style.backgroundColor = coordinatesVisible ? '#f44336' : '#4CAF50';
            });
        }
        
        // Función para calcular posición 3D del ratón mediante raycasting
        function onMouseMove(event) {
            if (!coordinatesVisible) return;
            
            // Calcular posición normalizada del ratón (-1 a +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Actualizar raycaster
            raycaster.setFromCamera(mouse, camera);
            
            // Calcular intersecciones con toda la escena, no solo el modelo
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            // Si hay intersección, actualizar posición del ratón en 3D
            if (intersects.length > 0) {
                mousePosition.copy(intersects[0].point);
                // Actualizar inmediatamente las coordenadas
                updateCoordinatesDisplay();
            }
        }
        
        // Función para actualizar la visualización de coordenadas
        function updateCoordinatesDisplay() {
            if (!coordinatesVisible) return;
            
            const camPos = camera.position;
            const target = controls.target;

            function retryTextureLoad(url, onSuccess, onError) {

                const attempts = textureLoadAttempts.get(url) || 0;
                textureLoadAttempts.set(url, attempts + 1);
                
                console.log(`Reintentando carga de textura (${attempts + 1}/${MAX_TEXTURE_LOAD_ATTEMPTS}): ${url}`);
                
                if (attempts < MAX_TEXTURE_LOAD_ATTEMPTS) {

                                onError(new Error(`Failed to load image from Blob URL: ${url}`));
                            };
                            
                            // Set the source to trigger loading

                            onError(e);

                        // Intentar cargar la textura de nuevo

        // Función para iniciar la animación de la cámara
        function startCameraAnimation() {
            // Coordenadas iniciales y finales (relativas al origen personalizado)
            const startCameraPos = new THREE.Vector3(43.60, 34.42, -69.81);
            const endCameraPos = new THREE.Vector3(-33.53, 21.07, 71.36);
            const targetPos = new THREE.Vector3(10.00, 14.10, 2.20);
            
            // Convertir coordenadas relativas a absolutas (sumando el offset)
            const absoluteStartPos = new THREE.Vector3().copy(startCameraPos).add(originOffset);
            const absoluteEndPos = new THREE.Vector3().copy(endCameraPos).add(originOffset);
            const absoluteTargetPos = new THREE.Vector3().copy(targetPos).add(originOffset);
            
            // Crear puntos intermedios para una trayectoria circular alrededor del objetivo
            cameraAnimation.waypoints = [];
            
            // Añadir el punto inicial
            cameraAnimation.waypoints.push(new THREE.Vector3().copy(absoluteStartPos));
            
            // Calcular el centro de la trayectoria circular (el objetivo)
            const center = new THREE.Vector3().copy(absoluteTargetPos);
            
            // Calcular el radio aproximado (distancia desde el objetivo a la cámara)
            const startRadius = absoluteStartPos.distanceTo(center);
            const endRadius = absoluteEndPos.distanceTo(center);
            
            // Crear vector normalizado desde el objetivo hasta la posición inicial de la cámara
            const startDirection = new THREE.Vector3().subVectors(absoluteStartPos, center).normalize();
            
            // Crear vector normalizado desde el objetivo hasta la posición final de la cámara
            const endDirection = new THREE.Vector3().subVectors(absoluteEndPos, center).normalize();
            
            // Calcular el ángulo entre los vectores de dirección inicial y final
            const startAngle = Math.atan2(startDirection.z, startDirection.x);
            const endAngle = Math.atan2(endDirection.z, endDirection.x);
            
            // Asegurarse de que la rotación sea en sentido horario (hacia la derecha)
            let angleDistance = endAngle - startAngle;
            if (angleDistance > 0) {
                angleDistance = angleDistance - 2 * Math.PI; // Forzar rotación en sentido horario
            }
            
            // Número de puntos intermedios (más puntos = trayectoria más suave)
            const numWaypoints = 24; // Aumentado para una trayectoria más suave
            
            // Crear puntos intermedios para una trayectoria circular
            for (let i = 1; i < numWaypoints; i++) {
                const t = i / numWaypoints;
                
                // Interpolar el ángulo para crear una rotación uniforme
                const angle = startAngle + angleDistance * t;
                
                // Interpolar entre los radios inicial y final
                const radius = startRadius * (1 - t) + endRadius * t;
                
                // Calcular la altura (interpolar entre las alturas inicial y final)
                const height = absoluteStartPos.y * (1 - t) + absoluteEndPos.y * t;
                
                // Crear el punto intermedio usando coordenadas polares
                const waypoint = new THREE.Vector3(
                    center.x + radius * Math.cos(angle),
                    height, // Altura interpolada
                    center.z + radius * Math.sin(angle)
                );
                
                // Añadir el punto a la trayectoria
                cameraAnimation.waypoints.push(waypoint);

        function animate() {
                    requestAnimationFrame(animate);
                    
                    // Manejar la animación de la cámara si está activa
                    if (cameraAnimation.enabled) {
                        const elapsed = Date.now() - cameraAnimation.startTime;
                        const progress = Math.min(elapsed / cameraAnimation.duration, 1.0);
                        
                        if (progress < 1.0) {
                            // Usar progreso lineal para velocidad uniforme (sin easing)
                            const uniformProgress = progress;
                            
                            // Calcular la posición de la cámara usando la trayectoria de waypoints
                            if (cameraAnimation.waypoints.length > 0) {
                                // Calcular qué segmento de la trayectoria estamos recorriendo
                                const numSegments = cameraAnimation.waypoints.length - 1;
                                const segmentProgress = uniformProgress * numSegments;
                                const segmentIndex = Math.min(Math.floor(segmentProgress), numSegments - 1);
                                const segmentT = segmentProgress - segmentIndex; // Progreso dentro del segmento actual (0-1)
                                
                                // Obtener los puntos del segmento actual
                                const p0 = cameraAnimation.waypoints[segmentIndex];
                                const p1 = cameraAnimation.waypoints[segmentIndex + 1];
                                
                                // Interpolar entre los dos puntos del segmento
                                camera.position.lerpVectors(p0, p1, segmentT);
                            } else {
                                // Fallback a interpolación directa si no hay waypoints
                                camera.position.lerpVectors(
                                    cameraAnimation.initialPosition,
                                    cameraAnimation.targetPosition,
                                    uniformProgress
                                );
                            }
                            
                            // Interpolar también el punto al que mira la cámara
                            const currentTarget = new THREE.Vector3();
                            currentTarget.lerpVectors(
                                cameraAnimation.initialTarget,
                                cameraAnimation.finalTarget,
                                uniformProgress
                            );
                            
                            // Actualizar el objetivo de los controles
                            controls.target.copy(currentTarget);
                            
                            // Asegurarse de que la cámara siempre mire al objetivo
                            camera.lookAt(currentTarget);
                        } else {
                            // Animación completa
                            cameraAnimation.enabled = false;
                            animationFinishTime = Date.now(); // Marcar cuando terminó la animación
                            console.log("🎬 Animación de cámara terminada - cooldown activado");
                            
                            // Asegurarse de que la cámara esté exactamente en la posición objetivo
                            camera.position.copy(cameraAnimation.targetPosition);
                            
                            // Restaurar los controles y asegurarse de que estén habilitados
                            controls.enabled = true; // Siempre habilitar los controles al finalizar
                            
                            // Actualizar el objetivo final de los controles
                            controls.target.copy(cameraAnimation.finalTarget);
                            
                            // Mostrar las coordenadas si estaban visibles antes
                            if (coordinatesVisible) {
                                document.getElementById('coordinates-display').style.display = 'block';
                            }
                            
                            // Calcular las coordenadas relativas para verificar
                            const adjustedCamPos = new THREE.Vector3().copy(camera.position).sub(originOffset);
                            console.log("Animación de cámara completada");

        // ===============================================
        // FUNCIÓN PARA CREAR EL PLANO DE CONTACTO
        // ===============================================
        
        // Función para configurar el plano de contacto como una pantalla interactiva
        function setupContactScreen() {
                    // Crear una escena CSS3D para el plano de contacto si no existe
                    if (!window.contactScene) {
                        window.contactScene = new THREE.Scene();
                        console.log("CSS3D Scene para Contact creada");
                    } else {
                        // Limpiar escena CSS3D si existe
                        while(window.contactScene.children.length > 0) {
                            window.contactScene.remove(window.contactScene.children[0]);
                        }
                        console.log("CSS3D Scene para Contact limpiada");
                    }
                    
                    // COORDENADAS EXACTAS proporcionadas por el usuario para el plano de contacto
                    const topLeft = new THREE.Vector3(1.69, 6.89, 7.83);
                    const topRight = new THREE.Vector3(0.53, 6.89, 7.83);
                    const bottomLeft = new THREE.Vector3(1.69, 5.67, 7.31);
                    const bottomRight = new THREE.Vector3(-0.53, 5.67, 7.31); // Coordenadas exactas del usuario
                    
                    // Convertir coordenadas relativas a absolutas (sumando el offset)
                    const absoluteTopLeft = new THREE.Vector3().copy(topLeft).add(originOffset);
                    const absoluteTopRight = new THREE.Vector3().copy(topRight).add(originOffset);
                    const absoluteBottomLeft = new THREE.Vector3().copy(bottomLeft).add(originOffset);
                    const absoluteBottomRight = new THREE.Vector3().copy(bottomRight).add(originOffset);
                    
                    console.log("Coordenadas absolutas para Contact:");
                    console.log("Top Left:", absoluteTopLeft);
                    console.log("Top Right:", absoluteTopRight);
                    console.log("Bottom Left:", absoluteBottomLeft);
                    console.log("Bottom Right:", absoluteBottomRight);
                    
                    // Calcular el centro del plano (método simple como en projects)
                    const center = new THREE.Vector3()
                        .add(absoluteTopLeft)
                        .add(absoluteTopRight)
                        .add(absoluteBottomLeft)
                        .add(absoluteBottomRight)
                        .multiplyScalar(0.25);
                    
                    // Ajustar posición para el trapecio - mover hacia la derecha
                    center.x -= 0.3; // Mover 0.3 unidades hacia la derecha para cubrir hasta X: -0.53
                    
                    console.log("Centro ajustado para trapecio:", center);
                    
                    // Calcular vectores para la orientación
                    const vX = new THREE.Vector3().subVectors(absoluteTopRight, absoluteTopLeft).normalize();
                    const vY = new THREE.Vector3().subVectors(absoluteBottomLeft, absoluteTopLeft).normalize();
                    const vZ = new THREE.Vector3().crossVectors(vX, vY).normalize();
                    
                    // Crear matriz de rotación
                    const matrix = new THREE.Matrix4();
                    matrix.makeBasis(vX, vY, vZ);
                    
                    // Extraer rotación de la matriz
                    const rotation = new THREE.Euler().setFromRotationMatrix(matrix);
                    
                    // Calcular el ancho y alto del plano
                    // Para un trapecio, necesitamos el ancho máximo (la parte más ancha)
                    const topWidth = absoluteTopLeft.distanceTo(absoluteTopRight);
                    const bottomWidth = absoluteBottomLeft.distanceTo(absoluteBottomRight);
                    const width = Math.max(topWidth, bottomWidth); // Usar el ancho máximo
                    const height = absoluteTopLeft.distanceTo(absoluteBottomLeft);
                    
                    console.log("Dimensiones del plano de contacto:", {
                        topWidth: topWidth,
                        bottomWidth: bottomWidth, 
                        width: width,
                        height: height
                    });
                    
                    // Crear un objeto invisible para raycasting
                    const invisiblePlane = new THREE.Mesh(
                        new THREE.PlaneGeometry(width, height),
                        new THREE.MeshBasicMaterial({
                            color: 0xFFFFFF,
                            transparent: true,
                            opacity: 0.0,
                            side: THREE.FrontSide, // IMPORTANTE: Visible solo desde el frente
                            depthWrite: false
                        })
                    );
                    
                    // Posicionar y rotar el plano invisible
                    invisiblePlane.position.copy(center);
                    invisiblePlane.rotation.copy(rotation);
                    
                    // Guardar referencia global para el raycasting
                    window.contactPlane = invisiblePlane;
                    
                    // Añadir el plano invisible a la escena (solo para raycasting)
                    scene.add(invisiblePlane);
                    
                    // Crear un plano negro de fondo (cover negro inicial)
                    const contactBackPlaneMaterial = new THREE.MeshBasicMaterial({
                        color: 0x000000, // Negro inicialmente (pantalla apagada)
                        side: THREE.DoubleSide, // Cambiado a DoubleSide para asegurar visibilidad
                        transparent: false, // Inicialmente NO transparente
                        opacity: 1.0, // Opacidad completa
                        depthWrite: true, // Reactivar depthWrite
                        depthTest: true // Reactivar depthTest para que respete la profundidad
                    });
                    
                    const contactBackPlane = new THREE.Mesh(
                        new THREE.PlaneGeometry(width, height), // Mismo tamaño exacto que el plano invisible
                        contactBackPlaneMaterial
                    );
                    
                    // Guardar referencia al material para poder cambiarlo después
                    window.contactScreenMaterial = contactBackPlaneMaterial;
                    window.contactBackPlane = contactBackPlane; // Guardar referencia al plano también
                    
                    // Posicionar el plano negro exactamente en la misma posición que el plano invisible
                    contactBackPlane.position.copy(center);
                    contactBackPlane.rotation.copy(rotation);
                    
                    // Mover muy ligeramente hacia adelante para que esté justo por encima del contenido
                    contactBackPlane.position.z += 0.001; // Reducido el offset para estar más cerca
                    
                    // Configurar renderOrder para asegurar que se renderice por encima del contenido HTML
                    contactBackPlane.renderOrder = 10; // Valor moderado, no tan alto
                    
                    // Añadir el plano negro a la escena
                    scene.add(contactBackPlane);
                    console.log("Plano negro de fondo para contact añadido a la escena:", contactBackPlane);
                    
                    // Forzar que el cover negro sea visible inicialmente
                    console.log("Forzando cover negro inicial visible para contact");
                    
                    // Crear un iframe con el tamaño estándar (igual que projects)
                    const iframe = document.createElement('iframe');
                    iframe.style.width = '800px';
                    iframe.style.height = '606px';
                    iframe.style.border = 'none';
                    iframe.style.overflow = 'hidden';
                    iframe.style.display = 'block';
                    iframe.style.pointerEvents = 'auto'; // CRÍTICO: Habilitar eventos de puntero
                    iframe.src = 'contact.html';
                    
                    // Crear un elemento div para contener el iframe
                    const div = document.createElement('div');
                    div.style.width = '800px';
                    div.style.height = '606px';
                    div.style.backgroundColor = 'transparent';
                    div.style.overflow = 'hidden';
                    div.style.pointerEvents = 'auto'; // CRÍTICO: Habilitar eventos de puntero en el contenedor
                    div.appendChild(iframe);
                    
                    // Crear un objeto CSS3D para el div
                    const cssObject = new THREE.CSS3DObject(div);
                    
                    // Calcular la escala adecuada basada en el tamaño real del plano
                    const scaleX = width / 800;
                    const scaleY = height / 606;
                    
                    // Aumentar la escala vertical en un 1.1% adicional para cubrir los huecos
                    const verticalScaleAdjustment = 1.011;
                    // Ajuste horizontal mínimo para cubrir el pequeño espacio en la izquierda
                    const horizontalScaleAdjustment = 1.02; // 2% adicional para cubrir el espacio izquierdo
                    
                    console.log("Factores de escala para contact:", {
                        scaleX: scaleX,
                        scaleY: scaleY,
                        verticalScaleAdjustment: verticalScaleAdjustment,
                        horizontalScaleAdjustment: horizontalScaleAdjustment,
                        finalScaleX: scaleX * horizontalScaleAdjustment,
                        finalScaleY: scaleY * verticalScaleAdjustment
                    });
                    
                    // Aplicar la escala calculada con ambos ajustes
                    cssObject.scale.set(scaleX * horizontalScaleAdjustment, scaleY * verticalScaleAdjustment, 1);
                    
                    // Posicionar el objeto CSS3D para que coincida con el plano
                    cssObject.position.copy(center);
                    
                    // Ajustar la posición hacia la derecha - Movido 3mm hacia la derecha desde la posición original
                    cssObject.position.x += 0.025; // Cambiado de -0.055 a +0.025 (3mm hacia la derecha desde -0.015)
                    
                    // Aplicar la rotación del plano con corrección fija para evitar texto invertido
                    cssObject.rotation.copy(rotation);
                    // Rotar 180 grados en Y para corregir la inversión del texto (FIJO, como en about-me)
                    cssObject.rotation.y += Math.PI;
                    
                    // Ajustar la posición para que coincida con el plano
                    cssObject.position.z += 0.001; // Pequeño offset para evitar z-fighting
                    
                    // Ajustar la posición vertical para centrar el contenido extendido
                    cssObject.position.y -= 0.003; // Ajuste mínimo para compensar la menor extensión vertical
            
            console.log("Posición final del CSS3D para contact:", cssObject.position);
            console.log("Rotación final del CSS3D para contact:", cssObject.rotation);
            
            // Añadir el objeto CSS3D a la escena CSS3D del plano de contacto
            window.contactScene.add(cssObject);
            console.log("Objeto CSS3D para Contact añadido a la escena");
            
            // Guardar referencia al objeto CSS3D para control de visibilidad
            window.contactCssObject = cssObject;
            
            // Configurar evento de clic para el plano
            invisiblePlane.userData.clickable = true;
            
            console.log("Plano de contacto interactivo creado con las coordenadas especificadas");
            console.log("Posición del plano de contacto:", center);
            console.log("Rotación del plano de contacto:", rotation);
            
            return invisiblePlane;
        }
        
        // Function to create the contact HTML plane
        function createContactPlane() {
            // Inicializar CSS3DRenderer si no existe
            if (!css3dRenderer) {
                css3dRenderer = new THREE.CSS3DRenderer();
                css3dRenderer.setSize(window.innerWidth, window.innerHeight);
                css3dRenderer.domElement.style.position = 'absolute';
                css3dRenderer.domElement.style.top = '0';
                css3dRenderer.domElement.style.pointerEvents = 'none'; // Evitar que interfiera con los controles
                document.body.appendChild(css3dRenderer.domElement);
                console.log("CSS3D Renderer creado para el plano de contacto");
            }
            
            // Configurar el plano invisible para la pantalla interactiva
            const invisiblePlane = setupContactScreen();
            
            // Asegurar que el cover negro esté visible inicialmente - múltiples intentos
            setTimeout(function() {
                if (window.contactScreenMaterial && window.contactBackPlane) {
                    window.contactScreenMaterial.color.set(0x000000); // Asegurar color negro
                    window.contactScreenMaterial.transparent = false;
                    window.contactScreenMaterial.opacity = 1.0;
                    window.contactScreenMaterial.needsUpdate = true;
                    window.contactBackPlane.visible = true;
                    console.log("Cover negro inicializado como visible para contact");

            // Segundo intento por si acaso
            setTimeout(function() {
                if (window.contactScreenMaterial && window.contactBackPlane) {
                    window.contactScreenMaterial.color.set(0x000000);
                    window.contactScreenMaterial.transparent = false;
                    window.contactScreenMaterial.opacity = 1.0;
                    window.contactScreenMaterial.needsUpdate = true;
                    window.contactBackPlane.visible = true;

                }
            }, 500);
            
            // Forzar la actualización de la visibilidad inicial después de la configuración
            setTimeout(function() {

                updateContactVisibility();
                console.log("Forzando actualización inicial de visibilidad para cafe-menu");
                updateCafeMenuVisibility();

            return invisiblePlane;
        }

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed 3D Model Loader</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            max-width: 400px;
            z-index: 100;
        }
        #loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
            overflow: hidden;
        }
        /* Estilos para el GIF de la taza de café */
        .coffee-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }
        .coffee-gif {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 10;
            /* Filtros para eliminar el fondo #fff4cc y hacer el café de color café */
            filter: brightness(1.1) contrast(1.5) invert(1) hue-rotate(180deg);
            mix-blend-mode: exclusion;
            transform: scale(0.75); /* Tamaño reducido */
        }
        /* Indicador de progreso de texto */
        .progress-text {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 20;
        }
        #loading-text {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        #loading-stats {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
        }
        #coordinates-display {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            color: white;
            z-index: 100;
            font-family: monospace;
        }
        #coordinates-toggle {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            z-index: 100;
        }
        
        /* Contenedor para los botones flotantes */
        .floating-buttons-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none; /* Initially hidden */
            gap: 20px; /* Espacio entre botones */
            z-index: 2000;
        }
        
        /* Estilo para los botones flotantes con iconos */
        .floating-button {
            width: 49px;
            height: 49px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 15px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .floating-button:hover {
            background-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }
        
        .floating-button img {
            width: 25px;
            height: 25px;
            object-fit: contain;
            filter: brightness(2) invert(1); /* Hace que el icono sea blanco */
        }
    </style>
</head>
<body>
    <div id="loading-container">
        <div class="coffee-container">
            <img src="images/icons/coffeGif.gif" class="coffee-gif" alt="Cargando...">
        </div>
    </div>

    <div id="info">
        <h2>Modelo Colombiano</h2>
        <p>Este visualizador está optimizado para cargar modelos 3D extremadamente grandes.</p>
    </div>

    <div id="coordinates-display">
        <h3>Sistema de Coordenadas</h3>
        <div id="camera-position">Cámara: X: 0.00, Y: 0.00, Z: 0.00</div>
        <div id="camera-target">Objetivo: X: 0.00, Y: 0.00, Z: 0.00</div>
        <div id="mouse-position">Ratón: X: 0.00, Y: 0.00, Z: 0.00</div>
    </div>
    
    <button id="coordinates-toggle">Mostrar Coordenadas</button>
    
    <!-- Contenedor de botones flotantes -->
    <div class="floating-buttons-container">
        <!-- Botón flotante con el icono personalizado -->
        <div class="floating-button">
            <img src="images/icons/iconMe.png" alt="Icono personalizado">
        </div>
        <!-- Botón flotante con el icono de carpeta -->
        <div class="floating-button">
            <img src="images/icons/CarpetaPNG.png" alt="Icono de carpeta">
        </div>
    </div>

    <!-- Three.js core library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r132/three.min.js"></script>
    
    <!-- Three.js components - using same version and ensuring proper load order -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/geometries/TextGeometry.js"></script>

    <script>
        // Configuración inicial
        let camera, scene, renderer, controls;
        let model = null;
        
        // Variables para el sistema de coordenadas
        let coordinatesVisible = false; // Inicialmente oculto
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let mousePosition = new THREE.Vector3();
        let axesHelper; // Para visualizar los ejes X, Y, Z
        
        // Variables para la animación de la cámara
        let cameraAnimation = {
            enabled: false,
            duration: 10080, // Duración de la animación en milisegundos (10.08 segundos - 25% más rápido)
            startTime: 0,
            initialPosition: new THREE.Vector3(),
            targetPosition: new THREE.Vector3(),
            initialTarget: new THREE.Vector3(),
            finalTarget: new THREE.Vector3(),
            originalControlsEnabled: true,
            waypoints: [] // Puntos intermedios para crear una trayectoria circular
        };
        
        // Punto de origen personalizado (offset para el sistema de coordenadas)
        const originOffset = new THREE.Vector3(-10.00, -14.10, -2.20);
        
        // Elementos DOM
        const loadingContainer = document.getElementById('loading-container');

        // Inicializar la escena
        init();
        
        function init() {
            // Crear escena con fondo negro
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Crear cámara
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            
            // Crear renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Controles de órbita
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Configurar sistema de coordenadas
            setupCoordinateSystem();
            
            // Cargar el modelo
            loadModel();
            
            // Manejar redimensionamiento de ventana
            window.addEventListener('resize', onWindowResize);
            
            // Iniciar bucle de animación
            animate();
        }
        
        function setupCoordinateSystem() {
            // Crear ejes X, Y, Z (rojo, verde, azul)
            axesHelper = new THREE.AxesHelper(5); // Tamaño de 5 unidades para cada eje
            
            // Posicionar los ejes en el punto de origen personalizado
            axesHelper.position.copy(originOffset);
            
            // Añadir los ejes a la escena
            scene.add(axesHelper);
            
            // Configurar elementos de la UI
            const coordDisplay = document.getElementById('coordinates-display');
            const coordToggle = document.getElementById('coordinates-toggle');
            
            // Establecer visibilidad inicial basada en coordinatesVisible
            coordDisplay.style.display = coordinatesVisible ? 'block' : 'none';
            axesHelper.visible = coordinatesVisible;
            
            // Establecer texto y color inicial del botón
            coordToggle.textContent = coordinatesVisible ? 'Ocultar Coordenadas' : 'Mostrar Coordenadas';
            coordToggle.style.backgroundColor = coordinatesVisible ? '#f44336' : '#4CAF50';
            
            // Actualizar coordenadas solo si están visibles
            if (coordinatesVisible) {
                updateCoordinatesDisplay();
            }
            
            // Manejar eventos de ratón para raycasting
            document.addEventListener('mousemove', onMouseMove);
            
            // Configurar botón para mostrar/ocultar coordenadas
            coordToggle.addEventListener('click', function() {
                coordinatesVisible = !coordinatesVisible;
                
                // Actualizar visibilidad del display y los ejes
                coordDisplay.style.display = coordinatesVisible ? 'block' : 'none';
                axesHelper.visible = coordinatesVisible;
                
                // Actualizar texto del botón
                this.textContent = coordinatesVisible ? 'Ocultar Coordenadas' : 'Mostrar Coordenadas';
                this.style.backgroundColor = coordinatesVisible ? '#f44336' : '#4CAF50';
            });
        }
        
        // Función para calcular posición 3D del ratón mediante raycasting
        function onMouseMove(event) {
            if (!coordinatesVisible) return;
            
            // Calcular posición normalizada del ratón (-1 a +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Actualizar raycaster
            raycaster.setFromCamera(mouse, camera);
            
            // Calcular intersecciones con toda la escena, no solo el modelo
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            // Si hay intersección, actualizar posición del ratón en 3D
            if (intersects.length > 0) {
                mousePosition.copy(intersects[0].point);
                // Actualizar inmediatamente las coordenadas
                updateCoordinatesDisplay();
            }
        }
        
        // Función para actualizar la visualización de coordenadas
        function updateCoordinatesDisplay() {
            if (!coordinatesVisible) return;
            
            const camPos = camera.position;
            const target = controls.target;
            
            // Crear copias de los vectores para aplicar el offset
            const adjustedCamPos = new THREE.Vector3().copy(camPos).sub(originOffset);
            const adjustedTarget = new THREE.Vector3().copy(target).sub(originOffset);
            const adjustedMousePos = new THREE.Vector3().copy(mousePosition).sub(originOffset);
            
            // Formatear coordenadas con 2 decimales
            const formatCoord = (vec) => `X: ${vec.x.toFixed(2)}, Y: ${vec.y.toFixed(2)}, Z: ${vec.z.toFixed(2)}`;
            
            // Actualizar texto en la UI con coordenadas relativas al nuevo origen
            document.getElementById('camera-position').textContent = `Cámara: ${formatCoord(adjustedCamPos)}`;
            document.getElementById('camera-target').textContent = `Objetivo: ${formatCoord(adjustedTarget)}`;
            document.getElementById('mouse-position').textContent = `Ratón: ${formatCoord(adjustedMousePos)}`;
        }
        
        function loadModel() {
            // Crear loading manager para seguimiento de progreso
            const manager = new THREE.LoadingManager();
            
            // Setup progress tracking
            manager.onProgress = function(url, loaded, total) {
                // Solo seguimos el progreso sin mostrar texto
            };
            
            // Handle loading errors
            // Crear un mapa para rastrear intentos de carga de texturas
            const textureLoadAttempts = new Map();
            const MAX_TEXTURE_LOAD_ATTEMPTS = 3;
            
            // Función mejorada para intentar recargar una textura
            function retryTextureLoad(url, onSuccess, onError) {
                // Incrementar contador de intentos
                const attempts = textureLoadAttempts.get(url) || 0;
                textureLoadAttempts.set(url, attempts + 1);
                
                console.log(`Reintentando carga de textura (${attempts + 1}/${MAX_TEXTURE_LOAD_ATTEMPTS}): ${url}`);
                
                if (attempts < MAX_TEXTURE_LOAD_ATTEMPTS) {
                    // Special handling for blob URLs
                    if (url.startsWith('blob:')) {
                        console.log('Attempting to reload Blob URL texture with enhanced error handling');
                        
                        try {
                            // For Blob URLs, we'll try a different approach
                            const img = new Image();
                            img.crossOrigin = 'anonymous';
                            
                            img.onload = function() {
                                console.log('Blob URL image loaded successfully, creating texture');
                                const texture = new THREE.Texture(img);
                                texture.needsUpdate = true;
                                onSuccess(texture);
                            };
                            
                            img.onerror = function(err) {
                                console.error('Failed to load Blob URL image:', err);
                                onError(new Error(`Failed to load image from Blob URL: ${url}`));
                            };
                            
                            // Set the source to trigger loading
                            img.src = url;
                        } catch (e) {
                            console.error('Exception during Blob URL texture reload:', e);
                            onError(e);
                        }
                    } else {
                        // Standard approach for non-blob URLs
                        // Crear un nuevo cargador de texturas
                        const textureLoader = new THREE.TextureLoader();
                        textureLoader.crossOrigin = 'anonymous';
                        
                        // Intentar cargar la textura de nuevo
                        textureLoader.load(
                            url,
                            onSuccess,
                            undefined, // onProgress no se usa
                            onError
                        );
                    }
                } else {
                    console.error(`Máximo de intentos alcanzado para textura: ${url}`);
                    onError(new Error(`Máximo de intentos alcanzado (${MAX_TEXTURE_LOAD_ATTEMPTS})`));
                }
            }
            
            // Handle loading errors with retry mechanism and enhanced debugging
            manager.onError = function(url) {
                console.error('Error loading:', url);
                
                // Add detailed diagnostics for Blob URLs
                if (url.startsWith('blob:')) {
                    console.log('Debugging Blob URL:', url);
                    
                    // Check if the Blob URL is still valid
                    try {
                        const xhr = new XMLHttpRequest();
                        xhr.open('HEAD', url, false); // Synchronous request to check URL validity
                        xhr.onreadystatechange = function() {
                            if (xhr.readyState === 4) {
                                console.log(`Blob URL status: ${xhr.status}, valid: ${xhr.status !== 0 && xhr.status < 400}`);
                            }
                        };
                        xhr.send();
                    } catch (e) {
                        console.error('Error checking Blob URL validity:', e);
                    }
                }
                
                // Verificar si es una textura (por la extensión o tipo de URL)
                const isTexture = url.match(/\.(jpe?g|png|gif|bmp|tga|dds)$/i) || url.startsWith('blob:');
                
                if (isTexture) {
                    // Si es una textura, intentar recargarla
                    const attempts = textureLoadAttempts.get(url) || 0;
                    console.log(`Texture load attempt ${attempts + 1}/${MAX_TEXTURE_LOAD_ATTEMPTS} for: ${url}`);
                    
                    if (attempts < MAX_TEXTURE_LOAD_ATTEMPTS) {
                        console.log(`Error de carga de textura, reintentando: ${url}`);
                        // No mostrar error aún, intentaremos recargar
                        
                        // Add a small delay before retry to allow any pending operations to complete
                        setTimeout(() => {
                            retryTextureLoad(
                                url,
                                function() { console.log(`Recarga exitosa de textura: ${url}`); },
                                function(err) {
                                    console.error('Texture reload failed:', err);
                                }
                            );
                        }, 500);
                    } else {
                        console.warn(`Maximum retry attempts (${MAX_TEXTURE_LOAD_ATTEMPTS}) reached for: ${url}`);
                        
                        // For Blob URLs, try to create a fallback texture instead of showing error
                        if (url.startsWith('blob:')) {
                            console.log('Creating fallback texture for failed Blob URL');
                            const fallbackTexture = new THREE.Texture();
                            fallbackTexture.image = new Image();
                            fallbackTexture.needsUpdate = true;
                            
                            // Try to find the material that uses this texture and replace it
                            if (model) {
                                model.traverse(function(node) {
                                    if (node.isMesh && node.material) {
                                        const materials = Array.isArray(node.material) ? node.material : [node.material];
                                        materials.forEach(material => {
                                            // Check if this material might be using the failed texture
                                            if (material.map && material.map.source &&
                                                material.map.source.data &&
                                                material.map.source.data.src === url) {
                                                console.log('Replacing failed texture in material:', material.name || 'unnamed');
                                                material.map = fallbackTexture;
                                                material.needsUpdate = true;
                                            }
                                        });
                                    }
                                });
                            }
                        }
                    }
                }
            };
            
            // Función para mostrar errores - redefinida para no mostrar texto
            function showError(message) {
                console.error(message);
                // No mostramos mensajes de error visualmente
            }
            
            // Configurar evento de carga completa
            manager.onLoad = function() {
                // Ocultar pantalla de carga después de un breve retraso
                setTimeout(function() {
                    loadingContainer.style.opacity = '0';
                    setTimeout(function() {
                        loadingContainer.style.display = 'none';
                        // Mostrar los botones flotantes cuando se oculta la pantalla de carga
                        document.querySelector('.floating-buttons-container').style.display = 'flex';
                    }, 500);
                }, 1000);
            };
            
            // Create GLTF loader
            const loader = new THREE.GLTFLoader(manager);
            
            // Setup Draco decoder
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
            loader.setDRACOLoader(dracoLoader);
            
            // Log versions for debugging
            console.log("THREE.js version:", THREE.REVISION);
            // Use a more reliable way to check GLTFLoader version
            console.log("GLTFLoader version:", "r132 (matched with THREE.js)");
            
            // Try loading with the correct filename first
            const primaryModelUrl = "Modelo3DCafeColombiano.glb";
            const fallbackModelUrl = "Modelo3DCafeColombiana.glb";
            
            console.log("Intentando cargar:", primaryModelUrl);
            
            // Function to try loading with a given URL
            function tryLoadModel(url, isFallback = false) {
                loader.load(
                    url,
                    // Success callback
                    function(gltf) {
                        console.log(`Modelo cargado exitosamente desde: ${url}`);
                        
                        // Process the loaded model
                        model = gltf.scene;
                        
                        // Fix materials with UV mapping issues
                        model.traverse(function(node) {
                            if (node.isMesh) {
                                // Process materials to fix appearance issues
                                const materials = Array.isArray(node.material) ? node.material : [node.material];
                                
                                materials.forEach(material => {
                                    // Fix metalness and roughness for better appearance
                                    if (material.metalness !== undefined) {
                                        material.metalness = Math.min(material.metalness, 0.4);
                                    }
                                    
                                    if (material.roughness !== undefined) {
                                        material.roughness = Math.max(material.roughness, 0.5);
                                    }
                                    
                                    // Suppress UV mapping warnings by patching the console
                                    if (!window._originalWarn && !window._uvWarningsSuppressed) {
                                        // Save original console.warn
                                        window._originalWarn = console.warn;
                                        window._uvWarningsSuppressed = true;
                                        
                                        // Replace with filtered version
                                        console.warn = function() {
                                            // Convert arguments to array
                                            const args = Array.from(arguments);
                                            
                                            // Check if this is a UV mapping warning
                                            if (args[0] && typeof args[0] === 'string' &&
                                                args[0].includes('Custom UV set') &&
                                                args[0].includes('not yet supported')) {
                                                // Suppress this warning
                                                return;
                                            }
                                            
                                            // Pass through other warnings
                                            window._originalWarn.apply(console, args);
                                        };
                                    }
                                    
                                    // Enhanced texture error handling
                                    if (material.map) {
                                        // Store original texture URL if it's a blob
                                        if (material.map.image && material.map.image.src &&
                                            material.map.image.src.startsWith('blob:')) {
                                            console.log(`Material using Blob texture: ${material.map.image.src}`);
                                            // Store the URL for debugging
                                            material._blobTextureUrl = material.map.image.src;
                                        }
                                        
                                        // Add enhanced error handling for texture loading
                                        material.map.onError = function(err) {
                                            console.warn("Error loading texture:", err);
                                            console.log("Material with error:", material.name || "unnamed");
                                            
                                            // Log texture details if available
                                            if (material.map.image) {
                                                console.log("Texture image source:", material.map.image.src);
                                            }
                                            
                                            // Check if this is a floor element by position or name
                                            const isFloor = node.position.y < -10 ||
                                                (node.name && (
                                                    node.name.toLowerCase().includes('suelo') ||
                                                    node.name.toLowerCase().includes('floor') ||
                                                    node.name.toLowerCase().includes('piso') ||
                                                    node.name.toLowerCase().includes('plane')
                                                ));
                                            
                                            // Create a fallback texture
                                            console.log("Creating fallback texture");
                                            const fallbackTexture = new THREE.Texture();
                                            fallbackTexture.image = new Image(1, 1);
                                            fallbackTexture.image.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=';
                                            fallbackTexture.needsUpdate = true;
                                            
                                            // Apply fallback texture
                                            material.map = fallbackTexture;
                                            material.needsUpdate = true;
                                            
                                            // For floor elements, also apply a special material
                                            if (isFloor) {
                                                console.log("Aplicando material alternativo al piso:", node.name);
                                                
                                                // Create alternative floor material
                                                const floorMaterial = new THREE.MeshStandardMaterial({
                                                    color: 0xcccccc,        // Light gray
                                                    roughness: 0.8,         // High roughness for matte appearance
                                                    metalness: 0.1,         // Low metalness
                                                    side: THREE.DoubleSide  // Render both sides
                                                });
                                                
                                                // Apply the alternative material
                                                if (Array.isArray(node.material)) {
                                                    // Replace the problematic material in the array
                                                    const index = node.material.indexOf(material);
                                                    if (index !== -1) {
                                                        node.material[index] = floorMaterial;
                                                    }
                                                } else {
                                                    node.material = floorMaterial;
                                                }
                                            }
                                        };
                                    }
                                });
                                
                                // Make sure objects receive shadows
                                node.receiveShadow = true;
                            }
                        });
                        
                        // Center model
                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        model.position.x = -center.x;
                        model.position.y = -center.y;
                        model.position.z = -center.z;
                        
                        // Add to scene
                        scene.add(model);
                        
                        // Add 3D text
                        addFloatingText();
                        
                        // Hide loading screen
                        loadingContainer.style.opacity = 0;
                        setTimeout(() => {
                            loadingContainer.style.display = 'none';
                        }, 500);
                        
                        // Start camera animation instead of just setting a fixed position
                        startCameraAnimation();
                        
                        // Update info
                        document.getElementById('info').innerHTML += `
                            <p style="color: #4CAF50;">Modelo cargado correctamente</p>
                            <p>Nombre del archivo: ${url}</p>
                        `;
                    },
                    // Progress callback
                    function(xhr) {
                        if (xhr.lengthComputable) {
                            const percent = (xhr.loaded / xhr.total) * 100;
                            
                            // Actualizar el nivel de llenado de la taza de café
                            // Ajustar el porcentaje para que se vea mejor en la taza
                            const adjustedPercent = Math.min(percent, 100); // Asegurar que no exceda el 100%
                            
                            // Usar una curva no lineal para el llenado para que se vea más natural
                            // Esto hace que se llene más rápido al principio y más lento al final
                            const fillHeight = Math.pow(adjustedPercent / 100, 0.8) * 100;
                            
                            // Limitar la altura máxima para que no sobrepase la taza
                            coffeeFill.style.height = Math.min(fillHeight, 25) + '%';
                            
                            // Ajustar el ancho del café según el nivel de llenado para simular la forma de la taza
                            // La taza es más ancha en la parte superior
                            const widthAdjustment = 55 + (fillHeight / 10);
                            coffeeFill.style.width = Math.min(widthAdjustment, 65) + '%';
                            
                            // Ajustar la opacidad para un efecto más realista
                            const opacity = 0.7 + (fillHeight / 100) * 0.3;
                            coffeeFill.style.opacity = opacity;
                            
                            const loadedMB = (xhr.loaded / (1024 * 1024)).toFixed(2);
                            const totalMB = (xhr.total / (1024 * 1024)).toFixed(2);
                            loadingStats.textContent = `${loadedMB} MB de ${totalMB} MB (${Math.round(percent)}%)`;
                            
                            loadingText.textContent = `Cargando modelo... ${Math.round(percent)}%`;
                        }
                    },
                    // Error callback
                    function(error) {
                        console.error(`Error cargando desde ${url}:`, error);
                        
                        if (!isFallback) {
                            // If first attempt fails, try alternative filename
                            console.log("Intentando con nombre alternativo:", fallbackModelUrl);
                            tryLoadModel(fallbackModelUrl, true);
                        } else {
                            // If both attempts fail, show error
                            showError(`No se pudo cargar el modelo con ninguno de los nombres de archivo. Error: ${error.message}`);
                        }
                    }
                );
            }
            
            // Start with the primary URL
            tryLoadModel(primaryModelUrl);
        }
        
        function showError(message) {
            console.error("ERROR:", message);
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            
            // Cambiar el color del café a rojo para indicar error
            if (coffeeFill) {
                coffeeFill.style.backgroundColor = '#cc0000';
                coffeeFill.style.height = '40%'; // Mostrar un nivel de café fijo para el error
            }
            
            loadingText.style.color = '#ff3333';
            
            // Add retry button
            const retryButton = document.createElement('button');
            retryButton.textContent = "Reintentar";
            retryButton.style.marginTop = "20px";
            retryButton.style.padding = "10px 20px";
            retryButton.style.backgroundColor = "#4CAF50";
            retryButton.style.color = "white";
            retryButton.style.border = "none";
            retryButton.style.borderRadius = "5px";
            retryButton.style.cursor = "pointer";
            
            retryButton.addEventListener('click', function() {
                location.reload();
            });
            
            loadingContainer.appendChild(retryButton);
        }
        
        function addFloatingText() {
            // Cargar la fuente para el texto 3D
            const fontLoader = new THREE.FontLoader();
            
            // URL de la fuente Helvetica o similar
            const fontUrl = 'https://threejs.org/examples/fonts/helvetiker_regular.typeface.json';
            
            fontLoader.load(fontUrl, function(font) {
                // Configuración para el nombre principal
                const nameConfig = {
                    font: font,
                    size: 0.3,
                    height: 0.05,
                    curveSegments: 12,
                    bevelEnabled: false
                };
                
                // Configuración para los subtítulos (más pequeños)
                const titleConfig = {
                    font: font,
                    size: 0.2,  // Increased from 0.175 by another 0.025 points
                    height: 0.025, // Slightly increased height for better proportion
                    curveSegments: 8, // Original value
                    bevelEnabled: false
                };
                
                // Crear material para el texto (blanco brillante)
                const textMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: 0x444444,
                    metalness: 0.3,
                    roughness: 0.2
                });
                
                // Crear geometría para el nombre principal (primera línea)
                const nameGeometry1 = new THREE.TextGeometry('Andres Felipe', nameConfig);
                nameGeometry1.computeBoundingBox();
                
                // Centrar el texto horizontalmente
                const nameWidth1 = nameGeometry1.boundingBox.max.x - nameGeometry1.boundingBox.min.x;
                
                // Crear mesh para el nombre (primera línea)
                const nameMesh1 = new THREE.Mesh(nameGeometry1, textMaterial);
                nameMesh1.position.set(-nameWidth1/2, 0, 0); // Posición inicial
                
                // Crear geometría para el nombre principal (segunda línea)
                const nameGeometry2 = new THREE.TextGeometry('Gonzalez Aristizabal', nameConfig);
                nameGeometry2.computeBoundingBox();
                
                // Centrar el texto horizontalmente
                const nameWidth2 = nameGeometry2.boundingBox.max.x - nameGeometry2.boundingBox.min.x;
                
                // Crear mesh para el nombre (segunda línea)
                const nameMesh2 = new THREE.Mesh(nameGeometry2, textMaterial);
                nameMesh2.position.set(-nameWidth2/2, -0.4, 0); // Posición debajo de la primera línea
                
                // Grupo para contener todos los textos
                const textGroup = new THREE.Group();
                textGroup.add(nameMesh1);
                textGroup.add(nameMesh2);
                
                // Títulos/roles a mostrar
                const titles = [
                    'Software Consulting',
                    'FullStack Engineer',
                    'Data Engineer',
                    'AI Full-Stack Engineer',
                    'Prompt Engineer'
                ];
                
                // Crear y posicionar cada título
                let verticalOffset = 0.8; // Espacio original debajo del nombre
                
                titles.forEach(title => {
                    const titleGeometry = new THREE.TextGeometry(title, titleConfig);
                    titleGeometry.computeBoundingBox();
                    
                    const titleWidth = titleGeometry.boundingBox.max.x - titleGeometry.boundingBox.min.x;
                    
                    const titleMesh = new THREE.Mesh(titleGeometry, textMaterial);
                    titleMesh.position.set(-titleWidth/2, -verticalOffset, 0);
                    
                    textGroup.add(titleMesh);
                    verticalOffset += 0.25; // Aumentado el espaciado entre títulos para mayor separación
                });
                
                // Posicionar el grupo de texto en las coordenadas exactas especificadas por el usuario
                // Pero con Y ajustada para que esté en el suelo (valor negativo)
                
                // Aplicar la posición directamente sin ajustes relativos al origen
                // Ajustes finales: Levantar 1 punto más en Y y quitar 0.5 en Z
                textGroup.position.set(-4.65, -11.8, 9.11);
                
                // Asegurarse de que la posición sea exactamente la especificada
                console.log("Posición del texto:", textGroup.position.x, textGroup.position.y, textGroup.position.z);
                
                // Rotar para que esté acostado (horizontal en el suelo) con una inclinación mayor
                // Ajustar la rotación en X para crear una inclinación desde el nombre hacia los roles
                const baseRotation = -Math.PI / 2; // -90 grados (acostado)
                const inclinationAngle = 25 * (Math.PI / 180); // 25 grados en radianes (10 + 15 adicionales)
                
                // Aplicar rotación con inclinación (nombre más bajo, roles más altos)
                textGroup.rotation.x = baseRotation + inclinationAngle;
                
                // Escalar el texto para que sea visible
                textGroup.scale.set(2.0, 2.0, 2.0);
                
                // Añadir el grupo de texto a la escena
                scene.add(textGroup);
                
                console.log("Texto 3D añadido a la escena");
            });
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Función para iniciar la animación de la cámara
        function startCameraAnimation() {
            // Coordenadas iniciales y finales (relativas al origen personalizado)
            const startCameraPos = new THREE.Vector3(43.60, 34.42, -69.81);
            const endCameraPos = new THREE.Vector3(-33.53, 21.07, 71.36);
            const targetPos = new THREE.Vector3(10.00, 14.10, 2.20);
            
            // Convertir coordenadas relativas a absolutas (sumando el offset)
            const absoluteStartPos = new THREE.Vector3().copy(startCameraPos).add(originOffset);
            const absoluteEndPos = new THREE.Vector3().copy(endCameraPos).add(originOffset);
            const absoluteTargetPos = new THREE.Vector3().copy(targetPos).add(originOffset);
            
            // Crear puntos intermedios para una trayectoria circular alrededor del objetivo
            cameraAnimation.waypoints = [];
            
            // Añadir el punto inicial
            cameraAnimation.waypoints.push(new THREE.Vector3().copy(absoluteStartPos));
            
            // Calcular el centro de la trayectoria circular (el objetivo)
            const center = new THREE.Vector3().copy(absoluteTargetPos);
            
            // Calcular el radio aproximado (distancia desde el objetivo a la cámara)
            const startRadius = absoluteStartPos.distanceTo(center);
            const endRadius = absoluteEndPos.distanceTo(center);
            
            // Crear vector normalizado desde el objetivo hasta la posición inicial de la cámara
            const startDirection = new THREE.Vector3().subVectors(absoluteStartPos, center).normalize();
            
            // Crear vector normalizado desde el objetivo hasta la posición final de la cámara
            const endDirection = new THREE.Vector3().subVectors(absoluteEndPos, center).normalize();
            
            // Calcular el ángulo entre los vectores de dirección inicial y final
            const startAngle = Math.atan2(startDirection.z, startDirection.x);
            const endAngle = Math.atan2(endDirection.z, endDirection.x);
            
            // Asegurarse de que la rotación sea en sentido horario (hacia la derecha)
            let angleDistance = endAngle - startAngle;
            if (angleDistance > 0) {
                angleDistance = angleDistance - 2 * Math.PI; // Forzar rotación en sentido horario
            }
            
            // Número de puntos intermedios (más puntos = trayectoria más suave)
            const numWaypoints = 24; // Aumentado para una trayectoria más suave
            
            // Crear puntos intermedios para una trayectoria circular
            for (let i = 1; i < numWaypoints; i++) {
                const t = i / numWaypoints;
                
                // Interpolar el ángulo para crear una rotación uniforme
                const angle = startAngle + angleDistance * t;
                
                // Interpolar entre los radios inicial y final
                const radius = startRadius * (1 - t) + endRadius * t;
                
                // Calcular la altura (interpolar entre las alturas inicial y final)
                const height = absoluteStartPos.y * (1 - t) + absoluteEndPos.y * t;
                
                // Crear el punto intermedio usando coordenadas polares
                const waypoint = new THREE.Vector3(
                    center.x + radius * Math.cos(angle),
                    height, // Altura interpolada
                    center.z + radius * Math.sin(angle)
                );
                
                // Añadir el punto a la trayectoria
                cameraAnimation.waypoints.push(waypoint);
            }
            
            // Añadir el punto final
            cameraAnimation.waypoints.push(new THREE.Vector3().copy(absoluteEndPos));
            
            // Configurar la animación
            cameraAnimation.enabled = true;
            cameraAnimation.startTime = Date.now();
            cameraAnimation.initialPosition.copy(absoluteStartPos);
            cameraAnimation.targetPosition.copy(absoluteEndPos);
            cameraAnimation.initialTarget.copy(absoluteTargetPos);
            cameraAnimation.finalTarget.copy(absoluteTargetPos);
            
            // Guardar el estado original de los controles
            cameraAnimation.originalControlsEnabled = controls.enabled;
            
            // Desactivar los controles durante la animación
            controls.enabled = false;
            
            // Ocultar las coordenadas durante la animación
            const coordDisplay = document.getElementById('coordinates-display');
            coordDisplay.style.display = 'none';
            
            // Establecer la posición inicial de la cámara
            camera.position.copy(absoluteStartPos);
            controls.target.copy(absoluteTargetPos);
            
            console.log("Iniciando animación de cámara con trayectoria circular");
            console.log("Posición inicial:", absoluteStartPos);
            console.log("Posición final:", absoluteEndPos);
            console.log("Objetivo:", absoluteTargetPos);
            console.log("Puntos de trayectoria:", cameraAnimation.waypoints.length);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Manejar la animación de la cámara si está activa
            if (cameraAnimation.enabled) {
                const elapsed = Date.now() - cameraAnimation.startTime;
                const progress = Math.min(elapsed / cameraAnimation.duration, 1.0);
                
                if (progress < 1.0) {
                    // Usar progreso lineal para velocidad uniforme (sin easing)
                    const uniformProgress = progress;
                    
                    // Calcular la posición de la cámara usando la trayectoria de waypoints
                    if (cameraAnimation.waypoints.length > 0) {
                        // Calcular qué segmento de la trayectoria estamos recorriendo
                        const numSegments = cameraAnimation.waypoints.length - 1;
                        const segmentProgress = uniformProgress * numSegments;
                        const segmentIndex = Math.min(Math.floor(segmentProgress), numSegments - 1);
                        const segmentT = segmentProgress - segmentIndex; // Progreso dentro del segmento actual (0-1)
                        
                        // Obtener los puntos del segmento actual
                        const p0 = cameraAnimation.waypoints[segmentIndex];
                        const p1 = cameraAnimation.waypoints[segmentIndex + 1];
                        
                        // Interpolar entre los dos puntos del segmento
                        camera.position.lerpVectors(p0, p1, segmentT);
                    } else {
                        // Fallback a interpolación directa si no hay waypoints
                        camera.position.lerpVectors(
                            cameraAnimation.initialPosition,
                            cameraAnimation.targetPosition,
                            uniformProgress
                        );
                    }
                    
                    // Asegurarse de que la cámara siempre mire al objetivo
                    camera.lookAt(controls.target);
                } else {
                    // Animación completa
                    cameraAnimation.enabled = false;
                    
                    // Restaurar los controles
                    controls.enabled = cameraAnimation.originalControlsEnabled;
                    
                    // Mostrar las coordenadas si estaban visibles antes
                    if (coordinatesVisible) {
                        document.getElementById('coordinates-display').style.display = 'block';
                    }
                    
                    console.log("Animación de cámara completada");
                }
            } else {
                // Actualizar controles solo cuando no hay animación
                controls.update();
            }
            
            // Update coordinates display
            if (coordinatesVisible && !cameraAnimation.enabled) {
                updateCoordinatesDisplay();
            }
            
            renderer.render(scene, camera);
        }
        
        // Función de easing para suavizar la animación
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

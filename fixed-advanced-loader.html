<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed 3D Model Loader</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            max-width: 400px;
            z-index: 100;
        }
        #loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
            overflow: hidden;
        }
        
        /* Estilos para el botón de activar música */
        .music-button {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 10px 25px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Estilos para el botón de control de música en la esquina superior derecha */
        .music-control-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            opacity: 0.7;
            z-index: 1100;
        }
        
        /* Contenedor para el botón y el control de volumen */
        .music-control-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1100;
        }
        
        /* Estilos para el control deslizante de volumen */
        .volume-slider-container {
            position: absolute;
            top: 49px; /* Ajustado 1mm hacia abajo */
            right: 15px; /* Ajustado un poco más hacia la izquierda */
            width: 20px;
            height: 100px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Mostrar el control de volumen al pasar el mouse sobre el contenedor */
        .music-control-container:hover .volume-slider-container {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        
        /* Estilo para el slider vertical */
        .volume-slider {
            -webkit-appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            transform: rotate(270deg);
            transform-origin: center;
            position: relative;
            top: 40px;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }
        
        .volume-slider::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
        }
        
        /* Valor del volumen */
        .volume-value {
            color: white;
            font-size: 10px;
            margin-top: 5px;
            position: absolute;
            bottom: 10px;
            font-family: Arial, sans-serif;
        }
        
        .music-control-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            opacity: 1;
        }
        
        .music-control-button:active {
            transform: scale(0.95);
        }
        
        /* Icono de música para el botón de control */
        .music-control-icon {
            width: 20px;
            height: 20px;
            position: relative;
        }
        
        /* Icono de música activada */
        .music-on .music-control-icon::before,
        .music-on .music-control-icon::after {
            content: '';
            position: absolute;
            background-color: white;
        }
        
        .music-on .music-control-icon::before {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            top: 0;
            left: 0;
            box-shadow: 10px 0 0 0 white;
        }
        
        .music-on .music-control-icon::after {
            width: 2px;
            height: 10px;
            top: 6px;
            left: 2px;
            box-shadow: 10px 0 0 0 white;
        }
        
        /* Icono de música desactivada (con una línea diagonal) */
        .music-off .music-control-icon::before,
        .music-off .music-control-icon::after {
            content: '';
            position: absolute;
            background-color: white;
        }
        
        .music-off .music-control-icon::before {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            top: 0;
            left: 0;
            box-shadow: 10px 0 0 0 white;
            opacity: 0.5;
        }
        
        .music-off .music-control-icon::after {
            width: 2px;
            height: 10px;
            top: 6px;
            left: 2px;
            box-shadow: 10px 0 0 0 white;
            opacity: 0.5;
        }
        
        .music-off::before {
            content: '';
            position: absolute;
            width: 24px;
            height: 2px;
            background-color: white;
            transform: rotate(45deg);
            z-index: 1;
        }
        
        /* Se eliminaron los estilos del control de volumen */
        
        .music-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            opacity: 1;
        }
        
        .music-button:active {
            transform: translateX(-50%) scale(0.98);
        }
        
        .music-icon {
            width: 16px;
            height: 16px;
            display: inline-block;
            position: relative;
        }
        
        .music-icon::before,
        .music-icon::after {
            content: '';
            position: absolute;
            background-color: white;
        }
        
        .music-icon::before {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            top: 0;
            left: 0;
            box-shadow: 10px 0 0 0 white;
        }
        
        .music-icon::after {
            width: 2px;
            height: 10px;
            top: 6px;
            left: 2px;
            box-shadow: 10px 0 0 0 white;
        }
        /* Estilos para el GIF de la taza de café */
        .coffee-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }
        .coffee-gif {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 10;
            /* Filtros para eliminar el fondo #fff4cc y hacer el café de color café */
            filter: brightness(1.1) contrast(1.5) invert(1) hue-rotate(180deg);
            mix-blend-mode: exclusion;
            transform: scale(0.75); /* Tamaño reducido */
        }
        /* Indicador de progreso de texto */
        .progress-text {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 20;
        }
        #loading-text {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        #loading-stats {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
        }
        #coordinates-display {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            color: white;
            z-index: 100;
            font-family: monospace;
        }
        #coordinates-toggle {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            z-index: 100;
        }
        
        /* Contenedor para los botones flotantes */
        .floating-buttons-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none; /* Initially hidden */
            gap: 20px; /* Espacio entre botones */
            z-index: 2000;
            /* Will be set to flex when visible */
        }
        
        /* Estilo para los botones flotantes con iconos */
        .floating-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 15px rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .floating-button:hover {
            background-color: rgba(0, 0, 0, 0.8);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }
        
        .floating-button img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            filter: brightness(10) contrast(1.5) invert(1); /* Hace que el icono sea más blanco y visible */
        }
        
        /* Estilo específico para iconos que ya son blancos */
        .floating-button img[src*="iconContact"],
        .floating-button img[src*="iconClientes"],
        .floating-button img[src*="iconServices"],
        .floating-button img[src*="iconProducts"] {
            filter: brightness(1.5) contrast(1.2); /* Sin invertir ya que la imagen ya es blanca */
        }
        
    </style>
</head>
<body>
    <!-- No incluimos los controles aquí, los crearemos dinámicamente después de la carga -->
    
    <div id="loading-container">
        <div class="coffee-container">
            <img src="media/icons/coffeGif.gif" class="coffee-gif" alt="Cargando...">
        </div>
        
        <!-- Botón para activar música -->
        <button id="music-activate-btn" class="music-button">
            <span class="music-icon"></span>
            Activar Música
        </button>
        </div>
    </div>
    
    <!-- YouTube iframe for background music (hidden) -->
    <div id="youtube-container" style="position: fixed; bottom: 0; right: 0; width: 1px; height: 1px; opacity: 0.01; z-index: -1; pointer-events: none;">
        <!-- The iframe will be added when loading reaches 93% -->
    </div>

    <div id="info">
    </div>

    <div id="coordinates-display">
        <h3>Sistema de Coordenadas</h3>
        <div id="camera-position">Cámara: X: 0.00, Y: 0.00, Z: 0.00</div>
        <div id="camera-target">Objetivo: X: 0.00, Y: 0.00, Z: 0.00</div>
        <div id="mouse-position">Ratón: X: 0.00, Y: 0.00, Z: 0.00</div>
    </div>
    
    <button id="coordinates-toggle">Mostrar Coordenadas</button>
    
    <!-- Contenedor de botones flotantes -->
    <div class="floating-buttons-container">
        <!-- Botón flotante con el icono personalizado -->
        <div class="floating-button">
            <img src="media/icons/iconMe.png" alt="Icono personalizado">
        </div>
        <!-- Botón flotante con el icono de carpeta -->
        <div class="floating-button">
            <img src="media/icons/CarpetaPNG.png" alt="Icono de carpeta">
        </div>
        <!-- Botón flotante con el icono de contacto -->
        <div class="floating-button">
            <img src="media/icons/iconContact.png" alt="Icono de contacto">
        </div>
        <!-- Botón flotante con el icono de clientes -->
        <div class="floating-button">
            <img src="media/icons/iconClientes.png?v=3" alt="Icono de clientes">
        </div>
        <!-- Botón flotante con el icono de servicios -->
        <div class="floating-button">
            <img src="media/icons/iconServices.png?v=2" alt="Icono de servicios">
        </div>
        <!-- Botón flotante con el icono de productos -->
        <div class="floating-button">
            <img src="media/icons/iconProducts.png" alt="Icono de productos">
        </div>
    </div>

    <!-- Three.js core library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r132/three.min.js"></script>
    
    <!-- Three.js components - using same version and ensuring proper load order -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/renderers/CSS3DRenderer.js"></script>
    
    <!-- Custom music autoplay script -->
    <script src="music-autoplay.js"></script>

    <script>
        // Configuración inicial
        let camera, scene, renderer, controls;
        let model = null;
        
        // Configuración de música de fondo
        const musicTriggerPercentage = 90; // Reproducir cuando la carga llegue al 90%
        let musicPlayed = false;
        let musicButtonClicked = false;
        let musicMuted = false;
        let musicControlCreated = false;
        
        // YouTube video ID from the provided URL
        const youtubeVideoId = 'uALnlDC4yug';
        
        // Variables para rastrear el estado de la pantalla about-me
        let aboutMeIframeReady = false;
        let aboutMeScreenOn = false;
        let aboutMeIframe = null;
        let aboutMePlane = null;
        
        // Escuchar mensajes de los iframes
        window.addEventListener('message', function(event) {
            console.log("Mensaje recibido en fixed-advanced-loader:", event.data);
            
            // Verificar si es el mensaje de que about-me.html está listo
            if (event.data && event.data.action === 'aboutMeReady') {
                console.log("Iframe de about-me.html está listo");
                aboutMeIframeReady = true;
                
                // Buscar el iframe de about-me.html
                const iframes = document.querySelectorAll('iframe');
                iframes.forEach(iframe => {
                    if (iframe.src && iframe.src.includes('about-me.html')) {
                        console.log("Encontrado iframe de about-me.html en el evento aboutMeReady");
                        aboutMeIframe = iframe;
                    }
                });
            }
            
            // Recibir confirmación de que la pantalla se encendió
            if (event.data && event.data.action === 'aboutMeScreenTurnedOn') {
                console.log("Recibida confirmación de que la pantalla de about-me se encendió");
                aboutMeScreenOn = true;
            }
            
            // Recibir confirmación de que la pantalla se apagó
            if (event.data && event.data.action === 'aboutMeScreenTurnedOff') {
                console.log("Recibida confirmación de que la pantalla de about-me se apagó");
                aboutMeScreenOn = false;
            }
            
            // Recibir confirmación de que la pantalla se encendió por clic
            if (event.data && event.data.action === 'aboutMeScreenTurnedOnByClick') {
                console.log("Recibida confirmación de que la pantalla de about-me se encendió por clic");
                aboutMeScreenOn = true;
            }
        });
        
        // Función para enviar mensaje al iframe de about-me.html
        function sendMessageToAboutMe(action) {
            console.log(`Intentando enviar mensaje a about-me.html: ${action}`);
            console.log("Estado del iframe:", aboutMeIframe ? "Encontrado" : "No encontrado");
            
            // Si no tenemos el iframe guardado, intentar buscarlo de nuevo
            if (!aboutMeIframe) {
                console.log("Buscando iframe de about-me.html...");
                const iframes = document.querySelectorAll('iframe');
                console.log("Total de iframes encontrados:", iframes.length);
                
                iframes.forEach((iframe, index) => {
                    console.log(`Iframe ${index}:`, iframe.src || "sin src");
                    if (iframe.src && iframe.src.includes('about-me.html')) {
                        console.log("Encontrado iframe de about-me.html:", iframe);
                        aboutMeIframe = iframe;
                    }
                });
            }
            
            if (aboutMeIframe && aboutMeIframe.contentWindow) {
                try {
                    // Asegurarse de que el iframe esté completamente cargado
                    if (aboutMeIframe.contentDocument && aboutMeIframe.contentDocument.readyState === 'complete') {
                        aboutMeIframe.contentWindow.postMessage({ action: action }, '*');
                        console.log(`Mensaje enviado a about-me.html: ${action}`);
                        
                        if (action === 'turnOnScreen') {
                            aboutMeScreenOn = true;
                            console.log("Pantalla de about-me marcada como ENCENDIDA");
                        } else if (action === 'turnOffScreen') {
                            aboutMeScreenOn = false;
                            console.log("Pantalla de about-me marcada como APAGADA");
                        }
                    } else {
                        console.warn("El iframe no está completamente cargado, esperando...");
                        // Intentar de nuevo después de un breve retraso
                        setTimeout(() => sendMessageToAboutMe(action), 500);
                    }
                } catch (e) {
                    console.error("Error al enviar mensaje al iframe:", e);
                }
            } else {
                console.warn("No se encontró el iframe de about-me.html o su contentWindow");
                if (aboutMeIframe) {
                    console.log("iframe encontrado pero sin contentWindow");
                }
            }
        }
        
        // Función para verificar si un punto está dentro del plano de about-me
        function isPointInAboutMePlane(point) {
            // Si no tenemos referencia al plano, no podemos verificar
            if (!window.brownPlane) {
                return false;
            }
            
            // Guardar referencia al plano de about-me
            aboutMePlane = window.brownPlane;
            
            // Crear un raycaster desde la cámara hasta el punto del clic
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(point, camera);
            
            // Verificar si el rayo intersecta con el plano de about-me
            const intersects = raycaster.intersectObject(aboutMePlane);
            
            // Si hay intersecciones, el clic fue en el plano
            return intersects.length > 0;
        }
        
        // Event listener para detectar clics en cualquier parte de la página
        document.addEventListener('click', function(event) {
            // Solo procesar si la pantalla de about-me está encendida
            if (!aboutMeScreenOn) {
                return;
            }
            
            // Convertir las coordenadas del clic a coordenadas normalizadas (-1 a 1)
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Verificar si el clic fue en el plano de about-me
            if (!isPointInAboutMePlane(mouse)) {
                console.log("Clic fuera del plano de about-me, apagando pantalla");
                sendMessageToAboutMe('turnOffScreen');
            }
        });
        
        // Configurar el botón de activar música
        const musicButton = document.getElementById('music-activate-btn');
        musicButton.addEventListener('click', function() {
            musicButtonClicked = true;
            playYouTubeVideo();
            
            // Cambiar el texto del botón
            this.innerHTML = '<span class="music-icon"></span>Música Activada';
            this.style.backgroundColor = 'rgba(76, 175, 80, 0.2)';
            this.style.borderColor = 'rgba(76, 175, 80, 0.5)';
            
            // Ocultar el botón después de un tiempo
            setTimeout(() => {
                this.style.opacity = '0';
                setTimeout(() => {
                    this.style.display = 'none';
                }, 500);
            }, 2000);
        });
        
        // Función para controlar el audio (definida globalmente para poder usarla más tarde)
        function controlAudio(mute) {
            musicMuted = mute;
            
            // Si hay un iframe de YouTube, silenciarlo o activarlo
            const iframe = document.querySelector('#youtube-container iframe');
            if (iframe && iframe.contentWindow) {
                if (mute) {
                    iframe.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
                    console.log('YouTube video silenciado');
                } else {
                    iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                    // Set volume to 0.01 (1%)
                    iframe.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[1]}', '*');
                    console.log('YouTube video activado con volumen al 1%');
                }
            }
        }
        
        // Función para crear el botón de control de música
        function createMusicControlButton() {
            if (musicControlCreated) return; // Evitar crear múltiples botones
            
            // Crear y añadir los controles de música dinámicamente
            const postLoadingControls = document.createElement('div');
            postLoadingControls.id = 'post-loading-controls';
            postLoadingControls.className = 'music-control-container';
            
            // Crear el botón de control de música
            const musicControlBtn = document.createElement('button');
            musicControlBtn.id = 'music-control-btn';
            
            // Si el usuario no activó la música en la pantalla de carga, mostrar el botón como muteado
            if (!musicButtonClicked) {
                musicControlBtn.className = 'music-control-button music-off';
                musicMuted = true;
            } else {
                musicControlBtn.className = 'music-control-button music-on';
                musicMuted = false;
            }
            
            // Crear el icono de música usando la imagen
            const musicIcon = document.createElement('img');
            musicIcon.src = 'media/icons/speakerIcon.png';
            musicIcon.alt = 'Control de música';
            musicIcon.style.width = '20px';
            musicIcon.style.height = '20px';
            musicIcon.style.filter = 'brightness(0) invert(1)'; // Hacer el icono blanco
            musicControlBtn.appendChild(musicIcon);
            
            // Crear el contenedor del control deslizante de volumen
            const volumeSliderContainer = document.createElement('div');
            volumeSliderContainer.className = 'volume-slider-container';
            
            // Crear el control deslizante de volumen
            const volumeSlider = document.createElement('input');
            volumeSlider.type = 'range';
            volumeSlider.min = '0';
            volumeSlider.max = '100';
            volumeSlider.value = musicMuted ? '0' : '1'; // 1% por defecto si no está muteado
            volumeSlider.className = 'volume-slider';
            volumeSlider.id = 'volume-slider';
            
            // Crear el elemento para mostrar el valor del volumen
            const volumeValue = document.createElement('div');
            volumeValue.className = 'volume-value';
            volumeValue.textContent = musicMuted ? '0%' : '1%';
            
            // Añadir el slider y el valor al contenedor
            volumeSliderContainer.appendChild(volumeSlider);
            volumeSliderContainer.appendChild(volumeValue);
            
            // Añadir el botón y el control deslizante al contenedor principal
            postLoadingControls.appendChild(musicControlBtn);
            postLoadingControls.appendChild(volumeSliderContainer);
            
            // Añadir el contenedor principal al DOM
            document.body.appendChild(postLoadingControls);
            
            // Configurar el evento de clic para el botón
            musicControlBtn.addEventListener('click', function() {

        // Función para iniciar la animación de la cámara
        function startCameraAnimation() {
            // Coordenadas iniciales y finales (relativas al origen personalizado)
            const startCameraPos = new THREE.Vector3(43.60, 34.42, -69.81);
            const endCameraPos = new THREE.Vector3(-33.53, 21.07, 71.36);
            const targetPos = new THREE.Vector3(10.00, 14.10, 2.20);
            
            // Convertir coordenadas relativas a absolutas (sumando el offset)
            const absoluteStartPos = new THREE.Vector3().copy(startCameraPos).add(originOffset);
            const absoluteEndPos = new THREE.Vector3().copy(endCameraPos).add(originOffset);
            const absoluteTargetPos = new THREE.Vector3().copy(targetPos).add(originOffset);
            
            // Crear puntos intermedios para una trayectoria circular alrededor del objetivo
            cameraAnimation.waypoints = [];
            
            // Añadir el punto inicial
            cameraAnimation.waypoints.push(new THREE.Vector3().copy(absoluteStartPos));
            
            // Calcular el centro de la trayectoria circular (el objetivo)
            const center = new THREE.Vector3().copy(absoluteTargetPos);
            
            // Calcular el radio aproximado (distancia desde el objetivo a la cámara)
            const startRadius = absoluteStartPos.distanceTo(center);
            const endRadius = absoluteEndPos.distanceTo(center);
            
            // Crear vector normalizado desde el objetivo hasta la posición inicial de la cámara
            const startDirection = new THREE.Vector3().subVectors(absoluteStartPos, center).normalize();
            
            // Crear vector normalizado desde el objetivo hasta la posición final de la cámara
            const endDirection = new THREE.Vector3().subVectors(absoluteEndPos, center).normalize();
            
            // Calcular el ángulo entre los vectores de dirección inicial y final
            const startAngle = Math.atan2(startDirection.z, startDirection.x);
            const endAngle = Math.atan2(endDirection.z, endDirection.x);
            
            // Asegurarse de que la rotación sea en sentido horario (hacia la derecha)
            let angleDistance = endAngle - startAngle;
            if (angleDistance > 0) {
                angleDistance = angleDistance - 2 * Math.PI; // Forzar rotación en sentido horario
            }
            
            // Número de puntos intermedios (más puntos = trayectoria más suave)
            const numWaypoints = 24; // Aumentado para una trayectoria más suave
            
            // Crear puntos intermedios para una trayectoria circular
            for (let i = 1; i < numWaypoints; i++) {
                const t = i / numWaypoints;
                
                // Interpolar el ángulo para crear una rotación uniforme
                const angle = startAngle + angleDistance * t;
                
                // Interpolar entre los radios inicial y final
                const radius = startRadius * (1 - t) + endRadius * t;
                
                // Calcular la altura (interpolar entre las alturas inicial y final)
                const height = absoluteStartPos.y * (1 - t) + absoluteEndPos.y * t;
                
                // Crear el punto intermedio usando coordenadas polares
                const waypoint = new THREE.Vector3(
                    center.x + radius * Math.cos(angle),
                    height, // Altura interpolada
                    center.z + radius * Math.sin(angle)
                );
                
                // Añadir el punto a la trayectoria
                cameraAnimation.waypoints.push(waypoint);
            }
            
            // Añadir el punto final
            cameraAnimation.waypoints.push(new THREE.Vector3().copy(absoluteEndPos));
            
            // Configurar la animación
            cameraAnimation.enabled = true;
            cameraAnimation.startTime = Date.now();
            cameraAnimation.initialPosition.copy(absoluteStartPos);
            cameraAnimation.targetPosition.copy(absoluteEndPos);
            cameraAnimation.initialTarget.copy(absoluteTargetPos);
            cameraAnimation.finalTarget.copy(absoluteTargetPos);
            
            // Guardar el estado original de los controles
            cameraAnimation.originalControlsEnabled = controls.enabled;
            
            // Desactivar los controles durante la animación
            controls.enabled = false;
            
            // Ocultar las coordenadas durante la animación
            const coordDisplay = document.getElementById('coordinates-display');
            coordDisplay.style.display = 'none';
            
            // Establecer la posición inicial de la cámara
            camera.position.copy(absoluteStartPos);
            controls.target.copy(absoluteTargetPos);
            
            console.log("Iniciando animación de cámara con trayectoria circular");
            console.log("Posición inicial:", absoluteStartPos);
            console.log("Posición final:", absoluteEndPos);
            console.log("Objetivo:", absoluteTargetPos);
            console.log("Puntos de trayectoria:", cameraAnimation.waypoints.length);
        }

        function animate() {
                    requestAnimationFrame(animate);
                    
                    // Manejar la animación de la cámara si está activa
                    if (cameraAnimation.enabled) {
                        const elapsed = Date.now() - cameraAnimation.startTime;
                        const progress = Math.min(elapsed / cameraAnimation.duration, 1.0);
                        
                        if (progress < 1.0) {
                            // Usar progreso lineal para velocidad uniforme (sin easing)
                            const uniformProgress = progress;
                            
                            // Calcular la posición de la cámara usando la trayectoria de waypoints
                            if (cameraAnimation.waypoints.length > 0) {
                                // Calcular qué segmento de la trayectoria estamos recorriendo
                                const numSegments = cameraAnimation.waypoints.length - 1;
                                const segmentProgress = uniformProgress * numSegments;
                                const segmentIndex = Math.min(Math.floor(segmentProgress), numSegments - 1);
                                const segmentT = segmentProgress - segmentIndex; // Progreso dentro del segmento actual (0-1)
                                
                                // Obtener los puntos del segmento actual
                                const p0 = cameraAnimation.waypoints[segmentIndex];
                                const p1 = cameraAnimation.waypoints[segmentIndex + 1];
                                
                                // Interpolar entre los dos puntos del segmento
                                camera.position.lerpVectors(p0, p1, segmentT);
                            } else {
                                // Fallback a interpolación directa si no hay waypoints
                                camera.position.lerpVectors(
                                    cameraAnimation.initialPosition,
                                    cameraAnimation.targetPosition,
                                    uniformProgress
                                );
                            }
                            
                            // Interpolar también el punto al que mira la cámara
                            const currentTarget = new THREE.Vector3();
                            currentTarget.lerpVectors(
                                cameraAnimation.initialTarget,
                                cameraAnimation.finalTarget,
                                uniformProgress
                            );
                            
                            // Actualizar el objetivo de los controles
                            controls.target.copy(currentTarget);
                            
                            // Asegurarse de que la cámara siempre mire al objetivo
                            camera.lookAt(currentTarget);
                        } else {
                            // Animación completa
                            cameraAnimation.enabled = false;
                            
                            // Asegurarse de que la cámara esté exactamente en la posición objetivo
                            camera.position.copy(cameraAnimation.targetPosition);
                            
                            // Restaurar los controles y asegurarse de que estén habilitados
                            controls.enabled = true; // Siempre habilitar los controles al finalizar
                            
                            // Actualizar el objetivo final de los controles
                            controls.target.copy(cameraAnimation.finalTarget);
                            
                            // Mostrar las coordenadas si estaban visibles antes
                            if (coordinatesVisible) {
                                document.getElementById('coordinates-display').style.display = 'block';
                            }
                            
                            // Calcular las coordenadas relativas para verificar
                            const adjustedCamPos = new THREE.Vector3().copy(camera.position).sub(originOffset);
                            console.log("Animación de cámara completada");
                            console.log("Posición final de la cámara (absoluta):", camera.position);
                            console.log("Posición final de la cámara (relativa):", adjustedCamPos);
                            console.log("Controles restaurados:", controls.enabled);
                        }
                    } else {
                        // Actualizar controles solo cuando no hay animación
                        controls.update();
                    }
                    
                    // Update coordinates display
                    if (coordinatesVisible && !cameraAnimation.enabled) {
                        updateCoordinatesDisplay();
                    }
                    
                    // Renderizar escena WebGL
                    renderer.render(scene, camera);
                    
                    // Renderizar escena CSS3D para el menú de cafés

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

        // Función para configurar el plano café como una pantalla interactiva
        function setupAboutMeScreen() {
                    // Crear una escena CSS3D para el plano café si no existe
                    if (!window.aboutMeScene) {
                        window.aboutMeScene = new THREE.Scene();
                        console.log("CSS3D Scene para About Me creada");
                    } else {
                        // Limpiar escena CSS3D si existe
                        while(window.aboutMeScene.children.length > 0) {
                            window.aboutMeScene.remove(window.aboutMeScene.children[0]);
                        }
                        console.log("CSS3D Scene para About Me limpiada");
                    }
                    
                    // COORDENADAS EXACTAS proporcionadas por el usuario
                    const topLeft = new THREE.Vector3(-5.42, 5.51, 7.59);
                    const topRight = new THREE.Vector3(-6.07, 5.51, 7.02);
                    const bottomLeft = new THREE.Vector3(-5.28, 4.68, 7.42);
                    const bottomRight = new THREE.Vector3(-5.93, 4.68, 6.86);
                    
                    // Convertir coordenadas relativas a absolutas (sumando el offset)
                    const absoluteTopLeft = new THREE.Vector3().copy(topLeft).add(originOffset);
                    const absoluteTopRight = new THREE.Vector3().copy(topRight).add(originOffset);
                    const absoluteBottomLeft = new THREE.Vector3().copy(bottomLeft).add(originOffset);
                    const absoluteBottomRight = new THREE.Vector3().copy(bottomRight).add(originOffset);
                    
                    console.log("Coordenadas absolutas:");
                    console.log("Top Left:", absoluteTopLeft);
                    console.log("Top Right:", absoluteTopRight);
                    console.log("Bottom Left:", absoluteBottomLeft);
                    console.log("Bottom Right:", absoluteBottomRight);
                    
                    // Calcular el centro del plano
                    const center = new THREE.Vector3()
                        .add(absoluteTopLeft)
                        .add(absoluteTopRight)
                        .add(absoluteBottomLeft)
                        .add(absoluteBottomRight)
                        .multiplyScalar(0.25);
                    
                    // Calcular vectores para la orientación
                    const vX = new THREE.Vector3().subVectors(absoluteTopRight, absoluteTopLeft).normalize();
                    const vY = new THREE.Vector3().subVectors(absoluteBottomLeft, absoluteTopLeft).normalize();
                    const vZ = new THREE.Vector3().crossVectors(vX, vY).normalize();
                    
                    // Crear matriz de rotación
                    const matrix = new THREE.Matrix4();
                    matrix.makeBasis(vX, vY, vZ);
                    
                    // Extraer rotación de la matriz
                    const rotation = new THREE.Euler().setFromRotationMatrix(matrix);
                    
                    // Calcular el ancho y alto del plano
                    const width = absoluteTopLeft.distanceTo(absoluteTopRight);
                    const height = absoluteTopLeft.distanceTo(absoluteBottomLeft);
                    
                    console.log("Dimensiones del plano:", width, height);
                    
                    // Crear un objeto invisible para raycasting
                    const invisiblePlane = new THREE.Mesh(
                        new THREE.PlaneGeometry(width, height),
                        new THREE.MeshBasicMaterial({
                            color: 0xFFFFFF,
                            transparent: true,
                            opacity: 0.0,
                            side: THREE.DoubleSide,
                            depthWrite: false
                        })
                    );
                    
                    // Posicionar y rotar el plano invisible
                    invisiblePlane.position.copy(center);
                    invisiblePlane.rotation.copy(rotation);
                    
                    // Guardar referencia global para el raycasting
                    window.brownPlane = invisiblePlane;
                    
                    // Añadir el plano invisible a la escena (solo para raycasting)
                    scene.add(invisiblePlane);
                    
                    // Crear un iframe con el tamaño original
                    const iframe = document.createElement('iframe');
                    iframe.style.width = '800px';
                    iframe.style.height = '606px'; // Aumentado un 1.1% verticalmente (600 * 1.011 = 606) - reducido un 18.9% del 20% original
                    iframe.style.border = 'none';
                    iframe.style.overflow = 'hidden';
                    iframe.style.display = 'block';
                    iframe.src = 'about-me.html';
                    
                    // Crear un elemento div para contener el iframe
                    const div = document.createElement('div');
                    div.style.width = '800px';
                    div.style.height = '606px'; // Aumentado un 1.1% verticalmente
                    div.style.backgroundColor = 'transparent';
                    div.style.overflow = 'hidden';
                    div.appendChild(iframe);
                    
                    // Crear un objeto CSS3D para el div
                    const cssObject = new THREE.CSS3DObject(div);
                    
                    // Calcular la escala adecuada basada en el tamaño real del plano
                    const scaleX = width / 800;
                    const scaleY = height / 606; // Ajustado para la nueva altura
                    
                    // Aumentar la escala vertical en un 1.1% adicional para cubrir los huecos
                    const verticalScaleAdjustment = 1.011; // Reducido de 1.015 a 1.011 (quitando un 0.4% adicional)
                    
                    console.log("Factores de escala:", scaleX, scaleY);
                    
                    // Aplicar la escala calculada con el ajuste vertical
                    cssObject.scale.set(scaleX, scaleY * verticalScaleAdjustment, 1);
                    
                    // Posicionar el objeto CSS3D para que coincida con el plano
                    cssObject.position.copy(center);
                    
                    // Aplicar la rotación del plano
                    cssObject.rotation.copy(rotation);
                    
                    // Ajustar la posición para que coincida con el plano
                    cssObject.position.z += 0.001; // Pequeño offset para evitar z-fighting
                    
                    // Ajustar la posición vertical para centrar el contenido extendido
                    cssObject.position.y -= 0.003; // Ajuste mínimo para compensar la menor extensión vertical
            
            console.log("Posición final del CSS3D:", cssObject.position);
            console.log("Rotación final del CSS3D:", cssObject.rotation);
            
            console.log("Posición del objeto CSS3D:", cssObject.position);
            console.log("Rotación del objeto CSS3D:", cssObject.rotation);
            
            // Añadir el objeto CSS3D a la escena CSS3D
            window.aboutMeScene.add(cssObject);
            console.log("Objeto CSS3D para About Me añadido a la escena");
            
            // Configurar evento de clic para el plano

            console.log("Plano café interactivo creado con las coordenadas especificadas");
            console.log("Posición del plano:", center);
            console.log("Rotación del plano:", rotation);
            
            return invisiblePlane;
        }

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Menu</title>
    <link rel="icon" type="image/png" href="assets/media/icons/typeOfCoffes/cafeNumeroUno.png">
    <link rel="stylesheet" href="assets/css/screens.css">
    <style>
        /* Iframe de 1000 x 600 px (ver index.html) - carta de cafe de especialidad */
        .screen-header { padding-bottom: 12px; }
        .screen-header h1 { font-size: 38px; }
        
        .screen-body { padding-top: 6px; padding-bottom: 14px; overflow: hidden; }

        .coffee-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: 1fr;
            gap: 12px 16px;
            height: 100%;
        }

        .coffee-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 88px;
            padding: 12px 16px 12px 14px;
            background: var(--paper-raised);
            border: 1.5px solid var(--line);
            border-radius: var(--radius);
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }
        .coffee-item:hover, .coffee-item:focus-visible {
            border-color: var(--coffee);
            box-shadow: 0 6px 18px rgba(78, 53, 36, 0.10);
            outline: none;
        }
        .coffee-item.selected {
            border-color: var(--coffee);
            background: #FBF3E6;
            box-shadow: 0 0 0 3px rgba(111, 78, 55, 0.18);
        }

        .coffee-thumb {
            flex: 0 0 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #EFE5D6;
        }
        .coffee-image { max-width: 46px; max-height: 50px; object-fit: contain; }

        .coffee-text { flex: 1 1 auto; min-width: 0; display: block; }
        .coffee-no {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: var(--clay);
        }
        .coffee-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 1px 9px;
            border-radius: 999px;
            background: var(--co-yellow);
            color: var(--ink);
            font-size: 13px;
            font-weight: 700;
            vertical-align: 1px;
        }
        .coffee-title {
            margin: 1px 0 2px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 21px;
            line-height: 1.2;
            color: var(--ink);
        }
        .coffee-description {
            margin: 0;
            font-size: 15px;
            line-height: 1.4;
            color: var(--ink-soft);
        }

        /* Indicador de seleccion (visible sin hover) */
        .coffee-check {
            flex: 0 0 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--line);
            background: var(--paper-raised);
            transition: border-color .2s ease, background .2s ease;
        }
        .coffee-item.selected .coffee-check {
            border-color: var(--coffee);
            background: var(--coffee);
            box-shadow: inset 0 0 0 5px var(--paper-raised);
        }

        .screen-footer { justify-content: space-between; padding-top: 12px; padding-bottom: 18px; }
        .footer-hint { margin: 0; font-size: 15px; color: var(--ink-soft); }
        .select-button { min-width: 260px; min-height: 52px; font-size: 17px; }
        .select-button:not(.ready) { background: transparent; color: var(--coffee); }

        /* Cover negro: la pantalla arranca "apagada" hasta recibir turnOnScreen */
        .screen-cover {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 9999;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
            pointer-events: auto;
        }
        .screen-cover.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body class="screen">
    <!-- Cover negro que se muestra por defecto - SIN TEXTO NI BOTONES -->
    <div class="screen-cover" id="screen-cover"></div>

    <div class="tricolor"></div>
    <header class="screen-header">
        <p class="overline">Services &middot; Coffee menu</p>
        <h1>Select your Colombian coffee</h1>
    </header>

    <main class="screen-body">
        <div class="coffee-grid">
            <!-- Coffee 1 -->
            <button type="button" class="coffee-item" data-service="software" aria-pressed="false">
                <span class="coffee-thumb"><img src="assets/media/icons/typeOfCoffes/cafeNumeroUno.png" alt="Custom Software Coffee" class="coffee-image"></span>
                <span class="coffee-text">
                    <span class="coffee-no">N&ordm; 01</span>
                    <h3 class="coffee-title">Custom Software</h3>
                    <p class="coffee-description">Personalized web, mobile and desktop systems with full-stack programming.</p>
                </span>
                <span class="coffee-check" aria-hidden="true"></span>
            </button>

            <!-- Coffee 2 -->
            <button type="button" class="coffee-item" data-service="automation" aria-pressed="false">
                <span class="coffee-thumb"><img src="assets/media/icons/typeOfCoffes/cafeNumeroDos.png" alt="Automation Coffee" class="coffee-image"></span>
                <span class="coffee-text">
                    <span class="coffee-no">N&ordm; 02</span>
                    <h3 class="coffee-title">Automation</h3>
                    <p class="coffee-description">Repetitive tasks optimized through scripts and bots for your business.</p>
                </span>
                <span class="coffee-check" aria-hidden="true"></span>
            </button>

            <!-- Coffee 3 -->
            <button type="button" class="coffee-item" data-service="consulting" aria-pressed="false">
                <span class="coffee-thumb"><img src="assets/media/icons/typeOfCoffes/cafeNumeroTres.png" alt="Tech Consulting Coffee" class="coffee-image"></span>
                <span class="coffee-text">
                    <span class="coffee-no">N&ordm; 03</span>
                    <h3 class="coffee-title">Tech Consulting</h3>
                    <p class="coffee-description">Strategic advice on architecture, development and performance.</p>
                </span>
                <span class="coffee-check" aria-hidden="true"></span>
            </button>

            <!-- Coffee 4 -->
            <button type="button" class="coffee-item" data-service="freelance" aria-pressed="false">
                <span class="coffee-thumb"><img src="assets/media/icons/typeOfCoffes/cafeNumeroCuatro.png" alt="Freelance Services Coffee" class="coffee-image"></span>
                <span class="coffee-text">
                    <span class="coffee-no">N&ordm; 04</span>
                    <span class="coffee-badge">Popular</span>
                    <h3 class="coffee-title">Freelance Services</h3>
                    <p class="coffee-description">Programming solutions and technical services with flexible remote work.</p>
                </span>
                <span class="coffee-check" aria-hidden="true"></span>
            </button>

            <!-- Coffee 5 -->
            <button type="button" class="coffee-item" data-service="web" aria-pressed="false">
                <span class="coffee-thumb"><img src="assets/media/icons/typeOfCoffes/cafeNumeroCinco.png" alt="Web &amp; E-commerce Coffee" class="coffee-image"></span>
                <span class="coffee-text">
                    <span class="coffee-no">N&ordm; 05</span>
                    <h3 class="coffee-title">Web &amp; E-commerce</h3>
                    <p class="coffee-description">All types of websites and custom e&#8209;commerce platforms.</p>
                </span>
                <span class="coffee-check" aria-hidden="true"></span>
            </button>

            <!-- Coffee 6 -->
            <button type="button" class="coffee-item" data-service="mobile" aria-pressed="false">
                <span class="coffee-thumb"><img src="assets/media/icons/typeOfCoffes/cafeNumeroSeis.png" alt="Mobile App Development Coffee" class="coffee-image"></span>
                <span class="coffee-text">
                    <span class="coffee-no">N&ordm; 06</span>
                    <h3 class="coffee-title">Mobile App Development</h3>
                    <p class="coffee-description">Native and cross-platform iOS and Android apps with modern frameworks.</p>
                </span>
                <span class="coffee-check" aria-hidden="true"></span>
            </button>
        </div>
    </main>

    <footer class="screen-footer">
        <p class="footer-hint">Each coffee is a service. Pick one, then confirm.</p>
        <button type="button" class="btn select-button">Select Coffee</button>
    </footer>
    <div class="wayuu-band"></div>

    <script>
        // Function to detect background color and adjust size
        function adjustSizeBasedOnBackground() {
            // Get computed background color
            const bodyBackgroundColor = window.getComputedStyle(document.body).backgroundColor;
            
            // Convert color to RGB values
            const rgbValues = bodyBackgroundColor.match(/\d+/g);
            
            if (rgbValues) {
                const [r, g, b] = rgbValues.map(Number);
                // Calculate brightness (simplified formula)
                const brightness = (r + g + b) / 3;
                
                // If background is dark (low brightness)
                if (brightness < 128) {
                    document.body.classList.add('dark-background');
                } else {
                    document.body.classList.remove('dark-background');
                }
            }
        }
        
        // Execute on page load
        document.addEventListener('DOMContentLoaded', function() {
            adjustSizeBasedOnBackground();
        });
        
        // Also execute if background color changes
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.attributeName === 'style' &&
                    (mutation.target === document.body || mutation.target === document.documentElement)) {
                    adjustSizeBasedOnBackground();
                }
            });
        });
        
        observer.observe(document.body, { attributes: true, attributeFilter: ['style'] });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
        
        // Variable to store selected service
        let selectedService = null;
        
        // Assign events to coffee items
        document.querySelectorAll('.coffee-item').forEach(item => {
            item.addEventListener('click', function() {
                // Remove previous selection
                document.querySelectorAll('.coffee-item').forEach(el => {
                    el.classList.remove('selected');
                    el.setAttribute('aria-pressed', 'false');
                });
                
                // Mark as selected
                this.classList.add('selected');
                this.setAttribute('aria-pressed', 'true');
                document.querySelector('.select-button').classList.add('ready');
                
                // Save selected service
                selectedService = this.getAttribute('data-service');
                
                // Update button text
                document.querySelector('.select-button').textContent = 'Select ' + this.querySelector('.coffee-title').textContent;
            });
        });
        
        // Assign event to selection button
        document.querySelector('.select-button').addEventListener('click', function() {
            if (selectedService) {
                // Redirect to corresponding form based on selected service
                switch (selectedService) {
                    case 'software':
                        window.location.href = 'contact-form-software.html';
                        break;
                    case 'automation':
                        window.location.href = 'contact-form-automation.html';
                        break;
                    case 'consulting':
                        window.location.href = 'contact-form-consulting.html';
                        break;
                    case 'freelance':
                        window.location.href = 'contact-form-freelance.html';
                        break;
                    case 'web':
                        window.location.href = 'contact-form-web.html';
                        break;
                    case 'mobile':
                        window.location.href = 'contact-form-mobile.html';
                        break;
                    default:
                        alert('Please select a service first.');
                }
            } else {
                alert('Please select a service first.');
            }
        });
        
        // ===============================================
        // SISTEMA DE COVER NEGRO REACTIVO PARA CAFE MENU
        // ===============================================
        
        // Variables para el control del cover negro
        const screenCover = document.getElementById('screen-cover');
        // Function to check if we're returning from a contact form
        function isReturningFromContactForm() {
            // Check if the referring page was a contact form
            return document.referrer && document.referrer.includes('contact-form-');
        }
        
        // Function to check if form was sent successfully
        function checkFormSent() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('sent') === 'true';
        }
        
        // Success popup function
        function showSuccessPopup() {
            // Create popup HTML
            const popup = document.createElement('div');
            popup.id = 'success-popup';
            popup.innerHTML = `
                <div class="popup-overlay">
                    <div class="popup-content">
                        <div class="popup-icon">✓</div>
                        <h3>Message Sent Successfully!</h3>
                        <p>Thank you for your interest. I'll get back to you soon.</p>
                    </div>
                </div>
            `;
            
            // Add popup styles
            const style = document.createElement('style');
            style.textContent = `
                #success-popup {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    z-index: 10000;
                    animation: fadeIn 0.3s ease-out;
                }
                
                .popup-overlay {
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(43, 29, 20, 0.45);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    cursor: pointer;
                }
                
                .popup-content {
                    position: relative;
                    overflow: hidden;
                    background: var(--paper-raised, #FFFCF7);
                    border: 1px solid var(--line, #E6DAC8);
                    padding: 44px 48px 36px;
                    border-radius: 20px;
                    text-align: center;
                    box-shadow: 0 18px 48px rgba(43, 29, 20, 0.28);
                    max-width: 520px;
                    margin: 20px;
                    animation: slideUp 0.3s ease-out;
                }
                
                .popup-content::before {
                    content: '';
                    position: absolute;
                    top: 0;
                    left: 0;
                    right: 0;
                    height: 8px;
                    background: linear-gradient(90deg, #F2B705 0 50%, #1F3C88 50% 75%, #C8102E 75% 100%);
                }
                
                .popup-icon {
                    width: 64px;
                    height: 64px;
                    background: var(--leaf, #2F6B3B);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 32px;
                    color: #FFFCF7;
                    margin: 0 auto 18px;
                    animation: checkmark 0.6s ease-out 0.3s both;
                }
                
                .popup-content h3 {
                    color: var(--ink, #2B1D14);
                    margin: 0 0 10px;
                    font-family: var(--font-display, Georgia, serif);
                    font-size: 28px;
                    line-height: 1.15;
                }
                
                .popup-content p {
                    color: var(--ink-soft, #6B5646);
                    margin: 0;
                    font-size: 17px;
                    line-height: 1.5;
                }
                
                @keyframes fadeIn {
                    from { opacity: 0; }
                    to { opacity: 1; }
                }
                
                @keyframes slideUp {
                    from {
                        opacity: 0;
                        transform: translateY(30px);
                    }
                    to {
                        opacity: 1;
                        transform: translateY(0);
                    }
                }
                
                @keyframes checkmark {
                    from {
                        transform: scale(0);
                    }
                    to {
                        transform: scale(1);
                    }
                }
            `;
            
            // Add to page
            document.head.appendChild(style);
            document.body.appendChild(popup);
            
            // Auto-hide after 3 seconds
            setTimeout(() => {
                popup.style.animation = 'fadeIn 0.3s ease-out reverse';
                setTimeout(() => {
                    if (popup.parentNode) {
                        popup.parentNode.removeChild(popup);
                    }
                    if (style.parentNode) {
                        style.parentNode.removeChild(style);
                    }
                }, 300);
            }, 3000);
            
            // Hide on click
            popup.addEventListener('click', () => {
                popup.style.animation = 'fadeIn 0.3s ease-out reverse';
                setTimeout(() => {
                    if (popup.parentNode) {
                        popup.parentNode.removeChild(popup);
                    }
                    if (style.parentNode) {
                        style.parentNode.removeChild(style);
                    }
                }, 300);
            });
        }
        
        // Check for form success popup when page loads
        document.addEventListener('DOMContentLoaded', function() {
            if (checkFormSent()) {
                // Wait a bit for the page to fully load, then show popup
                setTimeout(() => {
                    showSuccessPopup();
                    // Clean URL without refreshing page
                    const url = new URL(window.location);
                    url.searchParams.delete('sent');
                    window.history.replaceState({}, document.title, url);
                }, 500);
            }
        });
        
        // Initial screen state - should start active if returning from contact form
        let screenActive = isReturningFromContactForm(); // INICIA ACTIVADA si viene de formulario de contacto
        
        // Set initial cover state based on screenActive
        if (screenActive) {
            screenCover.classList.add('hidden');
            console.log("🚀 Inicializando cafe-menu.html con cover OCULTO (pantalla activa) - regreso de formulario");
        } else {
            screenCover.classList.remove('hidden');
        }
        
        // Check if page is in an iframe
        function isInIframe() {
            try {
                return window.self !== window.top;
            } catch (e) {
                return true;
            }
        }
        
        // Function to activate screen (remove black cover)
        function turnOnScreen() {
            screenActive = true;
            screenCover.classList.add('hidden');
            
            // Notificar al padre si está en iframe
            if (isInIframe()) {
                try {
                    window.parent.postMessage({ action: 'cafeMenuScreenTurnedOn' }, '*');
                } catch (e) {
                }
            }
        }
        
        // Function to deactivate screen (show black cover)
        function turnOffScreen() {
            screenActive = false;
            screenCover.classList.remove('hidden');
            
            // Notificar al padre si está en iframe
            if (isInIframe()) {
                try {
                    window.parent.postMessage({ action: 'cafeMenuScreenTurnedOff' }, '*');
                } catch (e) {
                }
            }
        }
        
        // Listen for messages from the parent window - SISTEMA REACTIVO
        window.addEventListener('message', function(event) {
            
            if (event.data && event.data.action === 'turnOnScreen') {
                turnOnScreen();
            }
            
            if (event.data && event.data.action === 'turnOffScreen') {
                turnOffScreen();
            }
            
            // NUEVOS LISTENERS PARA REACTIVIDAD CON OTROS BOTONES
            if (event.data && event.data.action === 'buttonPressed') {
                if (event.data.button === 'services' || event.data.button === 'servicio' || event.data.button === 'cafe') {
                    turnOnScreen();
                } else {
                    turnOffScreen();
                }
            }
            
            // Escuchar movimiento del usuario
            if (event.data && event.data.action === 'userMoving') {
                turnOffScreen();
            }
            
            // Escuchar cualquier actividad del modelo 3D que indique cambio de foco
            if (event.data && (
                event.data.action === 'modelRotated' ||
                event.data.action === 'cameraChanged' ||
                event.data.action === 'sceneInteraction' ||
                event.data.action === 'navigationStarted' ||
                event.data.action === 'realMovementDetected'
            )) {
                turnOffScreen();
            }
            
            // Escuchar específicamente movimiento real (no micro-movimientos)
            if (event.data && event.data.action === 'realMovementDetected') {
                turnOffScreen();
            }
            
            // Ignorar movimientos menores (hover, micro-movimientos)
            if (event.data && event.data.action === 'minorMovement') {
                console.log("📨 Micro-movimiento detectado - IGNORANDO (no apagar pantalla)");
                // No hacer nada - mantener el estado actual
            }
        });
        
        // Send ready message to parent
        if (isInIframe()) {
            try {
                window.parent.postMessage({ 
                    action: 'cafeMenuReady',
                    screenActive: screenActive
                }, '*');
            } catch (e) {
            }
        }
        
    </script>
</body>
</html>

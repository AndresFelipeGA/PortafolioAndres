<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colombian Portfolio</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="loader"></div>
        <div class="loading-text">Loading Colombian Experience...</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- 3D Canvas -->
        <canvas id="scene-canvas"></canvas>

        <!-- UI Overlay -->
        <div class="ui-overlay">
            <!-- Navigation Hints -->
            <div class="navigation-hints">
                <div class="hint">
                    <i class="fa fa-mouse"></i>
                    <span>Click on elements to interact</span>
                </div>
                <div class="hint">
                    <i class="fa fa-arrows-alt"></i>
                    <span>Scroll to navigate</span>
                </div>
            </div>

            <!-- Interactive Element Indicators will be added dynamically -->
            <div id="interactive-indicators"></div>

            <!-- Popup Container for content -->
            <div id="popup-container" class="hidden">
                <div class="popup-content">
                    <div class="popup-header">
                        <h2 id="popup-title">Title</h2>
                        <button id="popup-close"><i class="fa fa-times"></i></button>
                    </div>
                    <div id="popup-body">
                        <!-- Content will be loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/ScrollTrigger.min.js"></script>

    <!-- Custom Scripts -->
    <script src="js/three-setup.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

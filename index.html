    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            max-width: 400px;
            z-index: 100;
        }
        #loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
            overflow: hidden;
        }
        
        /* Estilos para el botón de activar música */
        .music-button {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 10px 25px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Estilos para el botón de control de música en la esquina superior derecha */
        .music-control-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            opacity: 0.7;
            z-index: 1100;
        }
        
        /* Contenedor para el botón y el control de volumen */
        .music-control-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1100;
        }
        
        /* Estilos para el control deslizante de volumen */
        .volume-slider-container {
            position: absolute;
            top: 49px; /* Ajustado 1mm hacia abajo */
            right: 15px; /* Ajustado un poco más hacia la izquierda */
            width: 20px;
            height: 100px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Mostrar el control de volumen al pasar el mouse sobre el contenedor */
        .music-control-container:hover .volume-slider-container {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        
        /* Estilo para el slider vertical */
        .volume-slider {
            -webkit-appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            transform: rotate(270deg);
            transform-origin: center;
            position: relative;
            top: 40px;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }
        
        .volume-slider::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
        }
        
        /* Valor del volumen */
        .volume-value {
            color: white;
            font-size: 10px;
            margin-top: 5px;
            position: absolute;
            bottom: 10px;
            font-family: Arial, sans-serif;
        }
        
        .music-control-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            opacity: 1;
        }
        
        .music-control-button:active {
            transform: scale(0.95);
        }
        
        /* Icono de música para el botón de control */
        .music-control-icon {
            width: 20px;
            height: 20px;
            position: relative;
        }
        
        /* Icono de música activada */
        .music-on .music-control-icon::before,
        .music-on .music-control-icon::after {
            content: '';
            position: absolute;
            background-color: white;
        }
        
        .music-on .music-control-icon::before {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            top: 0;
            left: 0;
            box-shadow: 10px 0 0 0 white;
        }
        
        .music-on .music-control-icon::after {
            width: 2px;
            height: 10px;
            top: 6px;
            left: 2px;
            box-shadow: 10px 0 0 0 white;
        }
        
        /* Icono de música desactivada (con una línea diagonal) */
        .music-off .music-control-icon::before,
        .music-off .music-control-icon::after {
            content: '';
            position: absolute;
            background-color: white;
        }
        
        .music-off .music-control-icon::before {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            top: 0;
            left: 0;
            box-shadow: 10px 0 0 0 white;
            opacity: 0.5;
        }
        
        .music-off .music-control-icon::after {
            width: 2px;
            height: 10px;
            top: 6px;
            left: 2px;
            box-shadow: 10px 0 0 0 white;
            opacity: 0.5;
        }
        
        .music-off::before {
            content: '';
            position: absolute;
            width: 24px;
            height: 2px;
            background-color: white;
            transform: rotate(45deg);
            z-index: 1;
        }
        
        /* Se eliminaron los estilos del control de volumen */
        
        .music-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            opacity: 1;
        }
        
        .music-button:active {
            transform: translateX(-50%) scale(0.98);
        }
        
        .bandola-icon, .acordeon-icon {
            width: 25px;
            height: 25px;

        }
        
        .bandola-icon {
            margin-right: 5px;
        }
        
        .acordeon-icon {
            margin-left: 5px;
        }
        /* Estilos para el GIF de la taza de café */
        .coffee-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }
        .coffee-gif {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 10;

            filter: brightness(1.1) contrast(1.5) invert(1) hue-rotate(180deg);
            mix-blend-mode: exclusion;
            transform: scale(0.75); /* Tamaño reducido */

        /* Indicador de progreso de texto */
        .progress-text {
            position: absolute;

            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 20;
        }
        
        /* Contenedor para las frases aleatorias */
        .random-phrases-container {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 500px;
            text-align: center;
            z-index: 25;

        /* Estilo para las frases aleatorias */
        .random-phrase {
            color: #D4B08A;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            line-height: 1.4;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            padding: 10px 20px;
            background: transparent;
            border-radius: 15px;
        }
        
        .random-phrase.visible {
            opacity: 1;
        }
        #loading-text {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        #loading-stats {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
        }
        #coordinates-display {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            color: white;
            z-index: 100;
            font-family: monospace;
        }
        #coordinates-toggle {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            display: none; /* Ocultar visualmente el botón */
            z-index: 100;
        }
        
        /* Contenedor para los botones flotantes */
        .floating-buttons-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none; /* Initially hidden */
            gap: 20px; /* Espacio entre botones */
            z-index: 2000;
            /* Will be set to flex when visible */
        }
        
        /* Estilo para los botones flotantes con iconos */
        .floating-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 15px rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .floating-button:hover {
            background-color: rgba(0, 0, 0, 0.8);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }
        
        .floating-button img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            filter: brightness(10) contrast(1.5) invert(1); /* Hace que el icono sea más blanco y visible */
        }
        
        /* Estilo específico para iconos que ya son blancos */
        .floating-button img[src*="iconContact"],
        .floating-button img[src*="iconClientes"],
        .floating-button img[src*="iconServices"],
        .floating-button img[src*="iconProducts"] {
            filter: brightness(1.5) contrast(1.2); /* Sin invertir ya que la imagen ya es blanca */
        }
        
    </style>
</head>

    <script>
        // Mobile device detection
        function isMobileDevice() {
            // Check for a URL parameter to force mobile mode for testing
            const urlParams = new URLSearchParams(window.location.search);
            const forceMobile = urlParams.get('forceMobile') === 'true';
            
            if (forceMobile) {
                console.log("Mobile mode forced by URL parameter");
                return true;
            }
            
            // Check if the user agent string contains mobile keywords
            const mobileKeywords = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i;
            const isMobileUserAgent = mobileKeywords.test(navigator.userAgent);
            
            // Also check screen size as a fallback
            const isMobileScreenSize = window.innerWidth < 768;
            
            // Log detection for debugging
            console.log("Mobile detection:", {
                userAgent: navigator.userAgent,
                isMobileUserAgent: isMobileUserAgent,
                screenWidth: window.innerWidth,
                isMobileScreenSize: isMobileScreenSize,
                isMobile: isMobileUserAgent || isMobileScreenSize
            });
            
            return isMobileUserAgent || isMobileScreenSize;
        }
        
        // Configuración inicial
        let camera, scene, renderer, controls;
        let model = null;
        
        // Configuración de música de fondo
        const musicTriggerPercentage = 90; // Reproducir cuando la carga llegue al 90%
        let musicPlayed = false;
        let musicButtonClicked = false;
        let musicMuted = false;
        let musicControlCreated = false;
        
        // Function to handle mobile-specific content
        function handleMobileDevice() {
            console.log("Mobile device detected! Showing mobile-specific content");
            
            // Get the loading container
            const loadingContainer = document.getElementById('loading-container');
            
            // Get the coffee container and image
            const coffeeContainer = document.querySelector('.coffee-container');
            const coffeeGif = document.querySelector('.coffee-gif');
            
            // Get the random phrases container
            const randomPhrasesContainer = document.querySelector('.random-phrases-container');
            const randomPhrase = document.getElementById('random-phrase');
            
            // Hide the music button for mobile
            const musicButton = document.getElementById('music-activate-btn');
            if (musicButton) {
                musicButton.style.display = 'none';
            }
            
            // Immediately hide any random phrases that might be showing
            if (randomPhrase) {
                randomPhrase.style.opacity = '0';
            }
            
            // Completely disable the random phrases functionality for mobile
            // Override the showRandomPhrase function before it's even defined
            window.showRandomPhrase = function() {
                console.log("Random phrases disabled for mobile");
                return false; // Prevent execution of the original function
            };
            
            // Show the loading screen for exactly 3 seconds
            console.log("Setting timeout for 3 seconds to change content");
            setTimeout(() => {
                console.log("Timeout executed - changing content for mobile");
                
                // Replace the coffee GIF with DeadCoffe.png
                if (coffeeGif) {
                    console.log("Replacing coffee GIF with DeadCoffe.png");
                    coffeeGif.src = 'assets/media/icons/DeadCoffe.png';
                    coffeeGif.style.filter = 'none'; // Remove filters applied to the GIF
                    coffeeGif.style.mixBlendMode = 'normal'; // Remove blend mode
                    coffeeGif.style.transform = 'scale(0.5)'; // Make the image 50% smaller
                }
                
                // Display the friendly message
                if (randomPhrase) {
                    console.log("Setting mobile message");
                    randomPhrase.textContent = "Sorry! This page isn't available on mobile. Please open it on a desktop.";
                    randomPhrase.classList.add('visible');
                    
                    // Make sure the message is visible with a lighter, friendlier red text
                    randomPhrase.style.opacity = '1';
                    randomPhrase.style.color = '#ff6b6b'; // Lighter, friendlier red color
                    randomPhrase.style.fontSize = '18px';
                    randomPhrase.style.textAlign = 'center';
                    randomPhrase.style.padding = '20px';
                    randomPhrase.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
                    randomPhrase.style.borderRadius = '10px';
                    randomPhrase.style.maxWidth = '80%';
                    randomPhrase.style.margin = '0 auto';
                    randomPhrase.style.fontWeight = 'bold'; // Make text bold for better visibility
                    randomPhrase.style.lineHeight = '1.5'; // Better readability
                    randomPhrase.style.letterSpacing = '0.5px'; // Slightly more spaced out text
                }
                
                // Make sure the loading container stays visible
                loadingContainer.style.opacity = '1';
                loadingContainer.style.display = 'flex';
                
                // Make sure no random phrases can appear
                const randomPhrasesContainer = document.querySelector('.random-phrases-container');
                if (randomPhrasesContainer) {
                    // Clear any existing content except our error message
                    Array.from(randomPhrasesContainer.children).forEach(child => {
                        if (child !== randomPhrase) {
                            randomPhrasesContainer.removeChild(child);
                        }
                    });
                }
                
                // Stop the random phrases from changing and ensure no other phrases appear
                if (window.phraseInterval) {
                    console.log("Clearing phrase interval");
                    clearInterval(window.phraseInterval);
                    window.phraseInterval = null;
                }
                
                // Make sure the loading text stays visible
                const loadingText = document.querySelector('#loading-text');
                if (loadingText) {
                    loadingText.style.display = 'none'; // Hide the loading text
                }
                
                // Override any functions that might show random phrases
                window.showRandomPhrases = function() {
                    console.log("Blocked attempt to show random phrases");
                    return false;
                };
            }, 3000);
            
            // Create dummy functions for desktop-only code
            console.log("Creating dummy functions for desktop-only code");
            window.init = function() {
                console.log("Dummy init function called");
            };
            window.animate = function() {
                // Empty function to prevent errors
            };
            
            // Prevent the rest of the script from executing
            console.log("Mobile handling complete - preventing desktop code execution");
            return true; // Indicate that mobile handling is active
        }
        
        // Check for mobile device on page load
        let isMobile = false;
        if (isMobileDevice()) {
            isMobile = handleMobileDevice();
        } else {
            console.log("Desktop device detected - proceeding with normal initialization");
        }
        
        // Also check when the window is resized
        window.addEventListener('resize', function() {
            // Only handle if not already in mobile mode
            if (!isMobile && isMobileDevice()) {
                console.log("Mobile device detected after resize!");
                isMobile = handleMobileDevice();
                // Reload the page to ensure proper handling
                window.location.reload();
            }
        });
        
        // YouTube video ID from the provided URL
        const youtubeVideoId = 'uALnlDC4yug';
        
        // Variables para rastrear el estado de la pantalla about-me
        let aboutMeIframeReady = false;
        let aboutMeScreenOn = false;
        let aboutMeIframe = null;
        let aboutMePlane = null;
        let aboutMeButtonClicked = false; // Nueva variable para rastrear si se ha hecho clic en el botón
        
        // Variables para el plano duplicado de About Me
        let aboutMeDuplicateIframeReady = false;
        let aboutMeDuplicateScreenOn = false;
        let aboutMeDuplicateIframe = null;
        let aboutMeDuplicatePlane = null;
        let aboutMeDuplicateButtonClicked = false;
        let aboutMeDuplicateActivatedByLastButton = false; // Nueva variable para tracking
        
        // Variables para el segundo plano About Me duplicado
        let aboutMe2IframeReady = false;
        let projectsScreenOn = false; // Cambié de aboutMe2 a projects
        let projectsIframe = null; // Cambié de aboutMe2 a projects
        let projectsPlane = null; // Cambié de aboutMe2 a projects
        let projectsButtonClicked = false; // Cambié de aboutMe2 a projects
        let projectsIframeReady = false; // Variable para rastrear si el iframe de projects está listo
        
        // Variables para la pantalla de contacto
        let contactScreenOn = false;
        let contactIframe = null;
        let contactPlane = null;
        let contactButtonClicked = false;
        let contactIframeReady = false;
        
        // Variables para cafe-menu
        let cafeMenuScreenOn = false;
        let cafeMenuIframe = null;
        let cafeMenuPlane = null;
        let cafeMenuButtonClicked = false;
        let cafeMenuIframeReady = false;
        
        // Variables para el control de la pantalla Community (cuarto botón)
        let communityScreenOn = false;
        let communityIframe = null;
        let communityPlane = null;
        let communityButtonClicked = false;
        let communityIframeReady = false;
        
        // Escuchar mensajes de los iframes
        window.addEventListener('message', function(event) {
            
            // Verificar si es el mensaje de que about-me.html está listo
            if (event.data && event.data.action === 'aboutMeReady') {
                aboutMeIframeReady = true;
                
                // Buscar el iframe de about-me.html
                const iframes = document.querySelectorAll('iframe');
                iframes.forEach(iframe => {
                    if (iframe.src && iframe.src.includes('about-me.html')) {
                        aboutMeIframe = iframe;
                    }
                });

        function isCafeMenuPlaneVisibleFromFront() {
            if (!window.cafeMenuPlane || !camera) {
                console.log("❌ cafeMenuPlane o camera no disponibles:", {
                    cafeMenuPlane: !!window.cafeMenuPlane,
                    camera: !!camera
                });
                return false;
            }
            
            // Obtener la normal del plano (dirección hacia donde "mira" el plano)
            // Invertimos la normal para que apunte hacia el lado correcto
            const planeNormal = new THREE.Vector3(0, 0, -1); // Normal invertida
            planeNormal.applyQuaternion(window.cafeMenuPlane.quaternion); // Aplicar rotación del plano
            
            // Obtener la dirección desde el plano hacia la cámara
            const cameraDirection = new THREE.Vector3();
            cameraDirection.subVectors(camera.position, window.cafeMenuPlane.position).normalize();
            
            // Calcular el ángulo entre la normal del plano y la dirección de la cámara
            const dotProduct = planeNormal.dot(cameraDirection);
            
            // Si el producto punto es positivo, la cámara está viendo el frente del plano
            // Usamos un umbral para dar un poco de tolerancia en el ángulo
            const threshold = 0.1; // Permite hasta ~84 grados de ángulo
            const result = dotProduct > threshold;
            
            // Solo log cuando cambie el estado de visibilidad
            if (window.lastCafeMenuVisibilityResult !== result) {
                console.log("📐 CafeMenu visibility changed:", {
                    visible: result,
                    dotProduct: dotProduct.toFixed(3)
                });
                window.lastCafeMenuVisibilityResult = result;
            }
            
            return result;
        }

                                                    metalness: 0.1,         // Low metalness
                                                    side: THREE.DoubleSide  // Render both sides
                                                });
                                                
                                                // Apply the alternative material
                                                if (Array.isArray(node.material)) {
                                                    // Replace the problematic material in the array
                                                    const index = node.material.indexOf(material);
                                                    if (index !== -1) {
                                                        node.material[index] = floorMaterial;
                                                    }
                                                } else {
                                                    node.material = floorMaterial;
                                                }
                                            }
                                        };
                                    }
                                });
                                
                                // Make sure objects receive shadows
                                node.receiveShadow = true;
                            }
                        });
                        
                        // Center model
                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        model.position.x = -center.x;
                        model.position.y = -center.y;
                        model.position.z = -center.z;
                        
                        // Add to scene
                        scene.add(model);
                        
                        // Add 3D text
                        addFloatingText();
                        
                        // Detener el sistema de frases aleatorias
                        stopLoadingPhrases();
                        
                        // Hide loading screen
                        loadingContainer.style.opacity = 0;
                        setTimeout(() => {
                            loadingContainer.style.display = 'none';
                        }, 500);
                        
                        // Start camera animation instead of just setting a fixed position
                        startCameraAnimation();
                        
                        // Info div is intentionally left empty
                    },
                    // Progress callback
                    function(xhr) {
                        if (xhr.lengthComputable) {
                            const percent = (xhr.loaded / xhr.total) * 100;
                            console.log(`Cargando modelo: ${Math.round(percent)}%`);
                            
                            // Reproducir música SOLO si el usuario ha hecho clic en el botón de activar música
                            if (percent >= musicTriggerPercentage && !musicPlayed && musicButtonClicked) {
                                console.log(`Carga al ${Math.round(percent)}%, iniciando música de fondo porque el usuario la activó`);
                                playYouTubeVideo();
                            }
                            
                            // No intentamos actualizar elementos que no existen
                            // Solo mostramos el progreso en la consola
                        }
                    },
                    // Error callback
                    function(error) {
                        
                        if (!isFallback) {
                            // If first attempt fails, try alternative filename
                            tryLoadModel(fallbackModelUrl, true);
                        } else {
                            // If both attempts fail, show error
                            showError(`No se pudo cargar el modelo con ninguno de los nombres de archivo. Error: ${error.message}`);
                        }
                    }
                );
            }
            
            // Start with the primary URL
            tryLoadModel(primaryModelUrl);
        }

        function addFloatingText() {
            // Cargar la fuente para el texto 3D
            const fontLoader = new THREE.FontLoader();
            
            // URL de la fuente Helvetica o similar
            const fontUrl = 'https://threejs.org/examples/fonts/helvetiker_regular.typeface.json';
            
            fontLoader.load(fontUrl, function(font) {
                // Configuración para el nombre principal
                const nameConfig = {
                    font: font,
                    size: 0.3,
                    height: 0.05,
                    curveSegments: 12,
                    bevelEnabled: false
                };
                
                // Configuración para los subtítulos (más pequeños)
                const titleConfig = {
                    font: font,
                    size: 0.2,  // Increased from 0.175 by another 0.025 points
                    height: 0.025, // Slightly increased height for better proportion
                    curveSegments: 8, // Original value
                    bevelEnabled: false
                };
                
                // Crear material para el texto (blanco brillante)
                const textMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: 0x444444,
                    metalness: 0.3,
                    roughness: 0.2
                });
                
                // Crear geometría para el nombre principal (primera línea)
                const nameGeometry1 = new THREE.TextGeometry('Andres Felipe', nameConfig);
                nameGeometry1.computeBoundingBox();
                
                // Centrar el texto horizontalmente
                const nameWidth1 = nameGeometry1.boundingBox.max.x - nameGeometry1.boundingBox.min.x;
                
                // Crear mesh para el nombre (primera línea)
                const nameMesh1 = new THREE.Mesh(nameGeometry1, textMaterial);
                nameMesh1.position.set(-nameWidth1/2, 0, 0); // Posición inicial
                
                // Crear geometría para el nombre principal (segunda línea)
                const nameGeometry2 = new THREE.TextGeometry('Gonzalez Aristizabal', nameConfig);
                nameGeometry2.computeBoundingBox();
                
                // Centrar el texto horizontalmente
                const nameWidth2 = nameGeometry2.boundingBox.max.x - nameGeometry2.boundingBox.min.x;
                
                // Crear mesh para el nombre (segunda línea)
                const nameMesh2 = new THREE.Mesh(nameGeometry2, textMaterial);
                nameMesh2.position.set(-nameWidth2/2, -0.4, 0); // Posición debajo de la primera línea
                
                // Grupo para contener todos los textos
                const textGroup = new THREE.Group();
                textGroup.add(nameMesh1);
                textGroup.add(nameMesh2);
                
                // Títulos/roles a mostrar
                const titles = [
                    'Software Engineer',
                    'FullStack Engineer',
                    'Data Engineer',
                    'AI Full-Stack Engineer',
                    'Freelancer'
                ];
                
                // Crear y posicionar cada título
                let verticalOffset = 0.8; // Espacio original debajo del nombre
                
                titles.forEach(title => {
                    const titleGeometry = new THREE.TextGeometry(title, titleConfig);
                    titleGeometry.computeBoundingBox();
                    
                    const titleWidth = titleGeometry.boundingBox.max.x - titleGeometry.boundingBox.min.x;
                    
                    const titleMesh = new THREE.Mesh(titleGeometry, textMaterial);
                    titleMesh.position.set(-titleWidth/2, -verticalOffset, 0);
                    
                    textGroup.add(titleMesh);
                    verticalOffset += 0.25; // Aumentado el espaciado entre títulos para mayor separación
                });
                
                // Posicionar el grupo de texto en las coordenadas exactas especificadas por el usuario
                // Pero con Y ajustada para que esté en el suelo (valor negativo)
                
                // Aplicar la posición directamente sin ajustes relativos al origen
                // Ajustes finales: Levantar 1 punto más en Y y quitar 0.5 en Z
                textGroup.position.set(-4.65, -11.8, 9.11);
                
                // Asegurarse de que la posición sea exactamente la especificada
                
                // Rotar para que esté acostado (horizontal en el suelo) con una inclinación mayor
                // Ajustar la rotación en X para crear una inclinación desde el nombre hacia los roles
                const baseRotation = -Math.PI / 2; // -90 grados (acostado)
                const inclinationAngle = 25 * (Math.PI / 180); // 25 grados en radianes (10 + 15 adicionales)
                
                // Aplicar rotación con inclinación (nombre más bajo, roles más altos)
                textGroup.rotation.x = baseRotation + inclinationAngle;
                
                // Escalar el texto para que sea visible
                textGroup.scale.set(2.0, 2.0, 2.0);
                
                // Añadir el grupo de texto a la escena
                scene.add(textGroup);
                
            });
        }

        // Función para iniciar la animación de la cámara
        function startCameraAnimation() {
            // Coordenadas iniciales y finales (relativas al origen personalizado)
            const startCameraPos = new THREE.Vector3(43.60, 34.42, -69.81);
            const endCameraPos = new THREE.Vector3(-20.43, 19.95, 57.95);
            const targetPos = new THREE.Vector3(-2.36, 3.64, 9.29);
            
            // Convertir coordenadas relativas a absolutas (sumando el offset)
            const absoluteStartPos = new THREE.Vector3().copy(startCameraPos).add(originOffset);
            const absoluteEndPos = new THREE.Vector3().copy(endCameraPos).add(originOffset);
            const absoluteTargetPos = new THREE.Vector3().copy(targetPos).add(originOffset);
            
            // Crear puntos intermedios para una trayectoria circular alrededor del objetivo
            cameraAnimation.waypoints = [];
            
            // Añadir el punto inicial
            cameraAnimation.waypoints.push(new THREE.Vector3().copy(absoluteStartPos));
            
            // Calcular el centro de la trayectoria circular (el objetivo)
            const center = new THREE.Vector3().copy(absoluteTargetPos);
            
            // Calcular el radio aproximado (distancia desde el objetivo a la cámara)
            const startRadius = absoluteStartPos.distanceTo(center);
            const endRadius = absoluteEndPos.distanceTo(center);
            
            // Crear vector normalizado desde el objetivo hasta la posición inicial de la cámara
            const startDirection = new THREE.Vector3().subVectors(absoluteStartPos, center).normalize();
            
            // Crear vector normalizado desde el objetivo hasta la posición final de la cámara
            const endDirection = new THREE.Vector3().subVectors(absoluteEndPos, center).normalize();
            
            // Calcular el ángulo entre los vectores de dirección inicial y final
            const startAngle = Math.atan2(startDirection.z, startDirection.x);
            const endAngle = Math.atan2(endDirection.z, endDirection.x);
            
            // Asegurarse de que la rotación sea en sentido horario (hacia la derecha)
            let angleDistance = endAngle - startAngle;
            if (angleDistance > 0) {
                angleDistance = angleDistance - 2 * Math.PI; // Forzar rotación en sentido horario
            }
            
            // Número de puntos intermedios (más puntos = trayectoria más suave)
            const numWaypoints = 24; // Aumentado para una trayectoria más suave
            
            // Crear puntos intermedios para una trayectoria circular
            for (let i = 1; i < numWaypoints; i++) {
                const t = i / numWaypoints;
                
                // Interpolar el ángulo para crear una rotación uniforme
                const angle = startAngle + angleDistance * t;
                
                // Interpolar entre los radios inicial y final
                const radius = startRadius * (1 - t) + endRadius * t;
                
                // Calcular la altura (interpolar entre las alturas inicial y final)
                const height = absoluteStartPos.y * (1 - t) + absoluteEndPos.y * t;
                
                // Crear el punto intermedio usando coordenadas polares
                const waypoint = new THREE.Vector3(
                    center.x + radius * Math.cos(angle),
                    height, // Altura interpolada
                    center.z + radius * Math.sin(angle)
                );
                
                // Añadir el punto a la trayectoria
                cameraAnimation.waypoints.push(waypoint);
            }
            
            // Añadir el punto final
            cameraAnimation.waypoints.push(new THREE.Vector3().copy(absoluteEndPos));
            
            // Configurar la animación
            cameraAnimation.enabled = true;
            cameraAnimation.startTime = Date.now();
            cameraAnimation.initialPosition.copy(absoluteStartPos);
            cameraAnimation.targetPosition.copy(absoluteEndPos);
            cameraAnimation.initialTarget.copy(absoluteTargetPos);
            cameraAnimation.finalTarget.copy(absoluteTargetPos);
            
            // Guardar el estado original de los controles
            cameraAnimation.originalControlsEnabled = controls.enabled;
            
            // Desactivar los controles durante la animación
            controls.enabled = false;
            
            // Ocultar las coordenadas durante la animación
            const coordDisplay = document.getElementById('coordinates-display');
            coordDisplay.style.display = 'none';
            
            // Establecer la posición inicial de la cámara
            camera.position.copy(absoluteStartPos);
            controls.target.copy(absoluteTargetPos);
            
        }

        function animate() {
                    requestAnimationFrame(animate);
                    
                    // Manejar la animación de la cámara si está activa
                    if (cameraAnimation.enabled) {
                        const elapsed = Date.now() - cameraAnimation.startTime;
                        const progress = Math.min(elapsed / cameraAnimation.duration, 1.0);
                        
                        if (progress < 1.0) {
                            // Usar progreso lineal para velocidad uniforme (sin easing)
                            const uniformProgress = progress;
                            
                            // Calcular la posición de la cámara usando la trayectoria de waypoints
                            if (cameraAnimation.waypoints.length > 0) {
                                // Calcular qué segmento de la trayectoria estamos recorriendo
                                const numSegments = cameraAnimation.waypoints.length - 1;
                                const segmentProgress = uniformProgress * numSegments;
                                const segmentIndex = Math.min(Math.floor(segmentProgress), numSegments - 1);
                                const segmentT = segmentProgress - segmentIndex; // Progreso dentro del segmento actual (0-1)
                                
                                // Obtener los puntos del segmento actual
                                const p0 = cameraAnimation.waypoints[segmentIndex];
                                const p1 = cameraAnimation.waypoints[segmentIndex + 1];
                                
                                // Interpolar entre los dos puntos del segmento
                                camera.position.lerpVectors(p0, p1, segmentT);
                            } else {
                                // Fallback a interpolación directa si no hay waypoints
                                camera.position.lerpVectors(
                                    cameraAnimation.initialPosition,
                                    cameraAnimation.targetPosition,
                                    uniformProgress
                                );
                            }
                            
                            // Interpolar también el punto al que mira la cámara
                            const currentTarget = new THREE.Vector3();
                            currentTarget.lerpVectors(
                                cameraAnimation.initialTarget,
                                cameraAnimation.finalTarget,
                                uniformProgress
                            );
                            
                            // Actualizar el objetivo de los controles
                            controls.target.copy(currentTarget);
                            
                            // Asegurarse de que la cámara siempre mire al objetivo
                            camera.lookAt(currentTarget);
                        } else {
                            // Animación completa
                            cameraAnimation.enabled = false;
                            
                            // NUEVO: Marcar que acaba de terminar una animación
                            animationJustFinished = true;
                            animationFinishTime = Date.now();
                            
                            // Reset del flag después del período de gracia
                            setTimeout(() => {
                                animationJustFinished = false;
                            }, postAnimationGracePeriod);
                            
                            // Asegurarse de que la cámara esté exactamente en la posición objetivo
                            camera.position.copy(cameraAnimation.targetPosition);
                            
                            // Restaurar los controles y asegurarse de que estén habilitados
                            controls.enabled = true; // Siempre habilitar los controles al finalizar
                            
                            // Actualizar el objetivo final de los controles
                            controls.target.copy(cameraAnimation.finalTarget);
                            
                            // Mostrar las coordenadas si estaban visibles antes
                            if (coordinatesVisible) {
                                document.getElementById('coordinates-display').style.display = 'block';
                            }
                            
                            // Calcular las coordenadas relativas para verificar
                            const adjustedCamPos = new THREE.Vector3().copy(camera.position).sub(originOffset);
                            console.log("Posición final de la cámara (absoluta):", camera.position);
                            console.log("Posición final de la cámara (relativa):", adjustedCamPos);
                        }
                    } else {
                        // Actualizar controles solo cuando no hay animación
                        controls.update();
                    }
                    
                    // Update coordinates display
                    if (coordinatesVisible && !cameraAnimation.enabled) {
                        updateCoordinatesDisplay();
                    }
                    
                    // Actualizar visibilidad del about-me basada en la orientación de la cámara

        // Función para configurar el plano café como una pantalla interactiva
        function setupAboutMeScreen() {
                    // Crear una escena CSS3D para el plano café si no existe

                        window.aboutMeScene = new THREE.Scene();

                        // Limpiar escena CSS3D si existe
                        while(window.aboutMeScene.children.length > 0) {
                            window.aboutMeScene.remove(window.aboutMeScene.children[0]);
                        }
                    }
                    
                    // COORDENADAS EXACTAS proporcionadas por el usuario
                    const topLeft = new THREE.Vector3(-5.42, 5.51, 7.59);
                    const topRight = new THREE.Vector3(-6.07, 5.51, 7.02);
                    const bottomLeft = new THREE.Vector3(-5.28, 4.68, 7.42);
                    const bottomRight = new THREE.Vector3(-5.93, 4.68, 6.86);
                    
                    // Convertir coordenadas relativas a absolutas (sumando el offset)
                    const absoluteTopLeft = new THREE.Vector3().copy(topLeft).add(originOffset);
                    const absoluteTopRight = new THREE.Vector3().copy(topRight).add(originOffset);
                    const absoluteBottomLeft = new THREE.Vector3().copy(bottomLeft).add(originOffset);
                    const absoluteBottomRight = new THREE.Vector3().copy(bottomRight).add(originOffset);
                    
                    
                    // Calcular el centro del plano
                    const center = new THREE.Vector3()
                        .add(absoluteTopLeft)
                        .add(absoluteTopRight)
                        .add(absoluteBottomLeft)
                        .add(absoluteBottomRight)
                        .multiplyScalar(0.25);
                    
                    // Calcular vectores para la orientación
                    const vX = new THREE.Vector3().subVectors(absoluteTopRight, absoluteTopLeft).normalize();
                    const vY = new THREE.Vector3().subVectors(absoluteBottomLeft, absoluteTopLeft).normalize();
                    const vZ = new THREE.Vector3().crossVectors(vX, vY).normalize();
                    
                    // Crear matriz de rotación
                    const matrix = new THREE.Matrix4();
                    matrix.makeBasis(vX, vY, vZ);
                    
                    // Extraer rotación de la matriz
                    const rotation = new THREE.Euler().setFromRotationMatrix(matrix);
                    
                    // Calcular el ancho y alto del plano
                    const width = absoluteTopLeft.distanceTo(absoluteTopRight);
                    const height = absoluteTopLeft.distanceTo(absoluteBottomLeft);
                    
                    
                    // Crear un objeto invisible para raycasting
                    const invisiblePlane = new THREE.Mesh(
                        new THREE.PlaneGeometry(width, height),
                        new THREE.MeshBasicMaterial({
                            color: 0xFFFFFF,
                            transparent: true,
                            opacity: 0.0,
                            side: THREE.FrontSide, // IMPORTANTE: Visible solo desde el frente

                    invisiblePlane.rotation.copy(rotation);

                    window.brownPlane = invisiblePlane;
                    
                    // Añadir el plano invisible a la escena (solo para raycasting)

                    // Crear un plano negro de fondo similar al del menú de cafés

                        transparent: false, // Inicialmente NO transparente
                        opacity: 1.0, // Opacidad completa
                        depthWrite: true, // Reactivar depthWrite
                        depthTest: true // Reactivar depthTest para que respete la profundidad
                    });
                    
                    const aboutMeBackPlane = new THREE.Mesh(
                        new THREE.PlaneGeometry(width * 0.98, height * 0.98), // Ligeramente más pequeño para mejor ajuste
                        aboutMeBackPlaneMaterial

                    // Crear un objeto CSS3D para el div
                    const cssObject = new THREE.CSS3DObject(div);
                    
                    // Calcular la escala adecuada basada en el tamaño real del plano
                    const scaleX = width / 800;
                    const scaleY = height / 606; // Ajustado para la nueva altura
                    
                    // Aumentar la escala vertical en un 1.1% adicional para cubrir los huecos
                    const verticalScaleAdjustment = 1.011; // Reducido de 1.015 a 1.011 (quitando un 0.4% adicional)
                    
                    
                    // Aplicar la escala calculada con el ajuste vertical
                    cssObject.scale.set(scaleX, scaleY * verticalScaleAdjustment, 1);
                    
                    // Posicionar el objeto CSS3D para que coincida con el plano
                    cssObject.position.copy(center);
                    
                    // Aplicar la rotación del plano

                    // Ajustar la posición para que coincida con el plano

            const iframes = document.querySelectorAll('iframe');
            
            for (let iframe of iframes) {
                if (iframe.src && iframe.src.includes('box.html')) {
                    
                    // Verificar si el iframe está completamente cargado
                    if (iframe.contentWindow && iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
                        try {
                            iframe.contentWindow.postMessage({ action: action }, '*');
                            
                            // Actualizar estado local
                            if (action === 'turnOnScreen') {
                                aboutMeDuplicateScreenOn = true;
                            } else if (action === 'turnOffScreen') {
                                aboutMeDuplicateScreenOn = false;
                            }
                            
                            return; // Salir una vez encontrado y enviado
                        } catch (error) {
                        }
                    } else {
                        
                        // Intentar de nuevo después de un breve retraso
                        setTimeout(function() {
                            sendMessageToAboutMeDuplicate(action);
                        }, 500);
                        return;
                    }
                }
            }
            
        }

        // Función para configurar el plano de contacto como una pantalla interactiva
        function setupContactScreen() {
                    // Crear una escena CSS3D para el plano de contacto si no existe
                    if (!window.contactScene) {
                        window.contactScene = new THREE.Scene();
                    } else {
                        // Limpiar escena CSS3D si existe
                        while(window.contactScene.children.length > 0) {
                            window.contactScene.remove(window.contactScene.children[0]);
                        }
                    }
                    
                    // COORDENADAS EXACTAS proporcionadas por el usuario para el plano de contacto
                    const topLeft = new THREE.Vector3(1.69, 6.89, 7.83);
                    const topRight = new THREE.Vector3(0.53, 6.89, 7.83);
                    const bottomLeft = new THREE.Vector3(1.69, 5.67, 7.31);
                    const bottomRight = new THREE.Vector3(-0.53, 5.67, 7.31); // Coordenadas exactas del usuario
                    
                    // Convertir coordenadas relativas a absolutas (sumando el offset)
                    const absoluteTopLeft = new THREE.Vector3().copy(topLeft).add(originOffset);
                    const absoluteTopRight = new THREE.Vector3().copy(topRight).add(originOffset);
                    const absoluteBottomLeft = new THREE.Vector3().copy(bottomLeft).add(originOffset);
                    const absoluteBottomRight = new THREE.Vector3().copy(bottomRight).add(originOffset);
                    
                    
                    // Calcular el centro del plano (método simple como en projects)
                    const center = new THREE.Vector3()
                        .add(absoluteTopLeft)
                        .add(absoluteTopRight)
                        .add(absoluteBottomLeft)
                        .add(absoluteBottomRight)
                        .multiplyScalar(0.25);
                    
                    // Ajustar posición para el trapecio - mover hacia la derecha
                    center.x -= 0.3; // Mover 0.3 unidades hacia la derecha para cubrir hasta X: -0.53
                    
                    
                    // Calcular vectores para la orientación
                    const vX = new THREE.Vector3().subVectors(absoluteTopRight, absoluteTopLeft).normalize();
                    const vY = new THREE.Vector3().subVectors(absoluteBottomLeft, absoluteTopLeft).normalize();
                    const vZ = new THREE.Vector3().crossVectors(vX, vY).normalize();
                    
                    // Crear matriz de rotación
                    const matrix = new THREE.Matrix4();
                    matrix.makeBasis(vX, vY, vZ);
                    
                    // Extraer rotación de la matriz
                    const rotation = new THREE.Euler().setFromRotationMatrix(matrix);
                    
                    // Calcular el ancho y alto del plano
                    // Para un trapecio, necesitamos el ancho máximo (la parte más ancha)
                    const topWidth = absoluteTopLeft.distanceTo(absoluteTopRight);
                    const bottomWidth = absoluteBottomLeft.distanceTo(absoluteBottomRight);
                    const width = Math.max(topWidth, bottomWidth); // Usar el ancho máximo
                    const height = absoluteTopLeft.distanceTo(absoluteBottomLeft);
                    
                    console.log("Dimensiones del plano de contacto:", {
                        topWidth: topWidth,
                        bottomWidth: bottomWidth, 
                        width: width,
                        height: height
                    });
                    
                    // Crear un objeto invisible para raycasting
                    const invisiblePlane = new THREE.Mesh(
                        new THREE.PlaneGeometry(width, height),
                        new THREE.MeshBasicMaterial({
                            color: 0xFFFFFF,
                            transparent: true,
                            opacity: 0.0,
                            side: THREE.FrontSide, // IMPORTANTE: Visible solo desde el frente
                            depthWrite: false
                        })
                    );
                    
                    // Posicionar y rotar el plano invisible
                    invisiblePlane.position.copy(center);
                    invisiblePlane.rotation.copy(rotation);
                    
                    // Guardar referencia global para el raycasting
                    window.contactPlane = invisiblePlane;
                    
                    // Añadir el plano invisible a la escena (solo para raycasting)
                    scene.add(invisiblePlane);
                    
                    // Crear un plano negro de fondo (cover negro inicial) - NUEVO ENFOQUE SIMPLE
                    const contactBackPlaneMaterial = new THREE.MeshBasicMaterial({
                        color: 0x000000, // Negro inicialmente (pantalla apagada)
                        side: THREE.DoubleSide, // Volver a DoubleSide como community
                        transparent: false, // Inicialmente NO transparente
                        opacity: 1.0, // Opacidad completa
                        depthWrite: true, // Cambiar a true como community
                        depthTest: true, // Cambiar a true como community
                        polygonOffset: true, // Agregar como community
                        polygonOffsetFactor: -1, // Agregar como community
                        polygonOffsetUnits: -1, // Agregar como community
                        fog: false // Evitar que la niebla afecte el cover
                    });
                    
                    // CREAR PLANO NEGRO CON TAMAÑO EXACTO DEL HTML (NO MÁS GRANDE)
                    // Usar exactamente las mismas dimensiones que el contenido HTML
                    const coverGeometry = new THREE.PlaneGeometry(width, height);
                    
                    const contactBackPlane = new THREE.Mesh(
                        coverGeometry, // Usar geometría con tamaño EXACTO
                        contactBackPlaneMaterial
                    );
                    
                    // Guardar referencia al material para poder cambiarlo después
                    window.contactScreenMaterial = contactBackPlaneMaterial;
                    window.contactBackPlane = contactBackPlane; // Guardar referencia al plano también
                    
                    // IMPORTANTE: Posicionar el plano negro EXACTAMENTE igual que el contenido HTML
                    // Usar la misma posición calculada para el centro del plano
                    contactBackPlane.position.copy(center);
                    
                    // Aplicar EXACTAMENTE los mismos ajustes de posición que el contenido HTML
                    contactBackPlane.position.x += 0.025; // Mismo ajuste que cssObject
                    contactBackPlane.position.y -= 0.003; // Mismo ajuste que cssObject
                    contactBackPlane.position.z += 0.0001; // Cambiar a offset ultra mínimo como community
                    
                    // Aplicar la misma rotación que el plano invisible para alinearlo correctamente
                    contactBackPlane.rotation.copy(rotation);
                    // NO rotar 180 grados en Y como el HTML porque el cover negro no necesita corrección de texto
                    
                    // Configurar renderOrder para asegurar que se renderice por encima del contenido HTML
                    contactBackPlane.renderOrder = 15; // Valor igual que community
                    
                    // Añadir el plano negro a la escena
                    scene.add(contactBackPlane);
                    console.log("  - Ancho (width):", width);
                    console.log("  - Alto (height):", height);
                    
                    // Forzar que el cover negro sea visible inicialmente
                    
                    // Crear un iframe con el tamaño estándar (igual que projects)
                    const iframe = document.createElement('iframe');
                    iframe.style.width = '800px';
                    iframe.style.height = '606px';
                    iframe.style.border = 'none';
                    iframe.style.overflow = 'hidden';
                    iframe.style.display = 'block';
                    iframe.style.pointerEvents = 'auto'; // CRÍTICO: Habilitar eventos de puntero
                    iframe.src = 'contact-main.html';
                    
                    // Crear un elemento div para contener el iframe
                    const div = document.createElement('div');
                    div.style.width = '800px';
                    div.style.height = '606px';
                    div.style.backgroundColor = 'transparent';
                    div.style.overflow = 'hidden';
                    div.style.pointerEvents = 'auto'; // CRÍTICO: Habilitar eventos de puntero en el contenedor
                    div.appendChild(iframe);
                    
                    // Crear un objeto CSS3D para el div
                    const cssObject = new THREE.CSS3DObject(div);
                    
                    // Calcular la escala adecuada basada en el tamaño real del plano
                    const scaleX = width / 800;
                    const scaleY = height / 606;
                    
                    // Aumentar la escala vertical en un 1.1% adicional para cubrir los huecos
                    const verticalScaleAdjustment = 1.011;
                    // Ajuste horizontal mínimo para cubrir el pequeño espacio en la izquierda
                    const horizontalScaleAdjustment = 1.02; // 2% adicional para cubrir el espacio izquierdo
                    
                    console.log("Factores de escala para contact:", {
                        scaleX: scaleX,
                        scaleY: scaleY,
                        verticalScaleAdjustment: verticalScaleAdjustment,
                        horizontalScaleAdjustment: horizontalScaleAdjustment,
                        finalScaleX: scaleX * horizontalScaleAdjustment,
                        finalScaleY: scaleY * verticalScaleAdjustment
                    });
                    
                    // Aplicar la escala calculada con ambos ajustes
                    cssObject.scale.set(scaleX * horizontalScaleAdjustment, scaleY * verticalScaleAdjustment, 1);
                    
                    // Posicionar el objeto CSS3D para que coincida con el plano
                    cssObject.position.copy(center);
                    
                    // Ajustar la posición hacia la derecha - Movido 3mm hacia la derecha desde la posición original
                    cssObject.position.x += 0.025; // Cambiado de -0.055 a +0.025 (3mm hacia la derecha desde -0.015)
                    
                    // Aplicar la rotación del plano con corrección fija para evitar texto invertido
                    cssObject.rotation.copy(rotation);
                    // Rotar 180 grados en Y para corregir la inversión del texto (FIJO, como en about-me)
                    cssObject.rotation.y += Math.PI;
                    
                    // Ajustar la posición para que coincida con el plano
                    cssObject.position.z += 0.001; // Pequeño offset para evitar z-fighting
                    
                    // Ajustar la posición vertical para centrar el contenido extendido
                    cssObject.position.y -= 0.003; // Ajuste mínimo para compensar la menor extensión vertical
            
            
            // Añadir el objeto CSS3D a la escena CSS3D del plano de contacto
            window.contactScene.add(cssObject);
            
            // Guardar referencia al objeto CSS3D para control de visibilidad
            window.contactCssObject = cssObject;
            
            // Configurar evento de clic para el plano
            invisiblePlane.userData.clickable = true;
            
            
            return invisiblePlane;
        }

                polygonOffsetUnits: -1
            });
            
            // Crear plano negro con tamaño mucho mayor para cobertura total garantizada
            const communityBackPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(width * 1.15, height * 1.15),  // Incremento del 15% para cobertura absoluta
                communityBackPlaneMaterial
            );
            
            // Guardar referencias globales para el cover negro
            window.communityScreenMaterial = communityBackPlaneMaterial;
            window.communityBackPlane = communityBackPlane;
            
            // Posicionar el cover negro EXACTAMENTE en la misma posición que el HTML
            // Usar las mismas coordenadas del plano invisible donde está el HTML
            communityBackPlane.position.set(center.x, center.y, center.z);  // Posición exacta
            communityBackPlane.rotation.set(rotation.x, rotation.y, rotation.z);  // Rotación exacta
            
            // Ajuste ultra mínimo hacia adelante en Z para que esté visible pero perfectamente alineado
            communityBackPlane.position.z += 0.0001;  // Offset aún más pequeño que antes
            
            // Configurar renderOrder para que esté por encima
            communityBackPlane.renderOrder = 15;
            
            // Añadir el cover negro a la escena
            scene.add(communityBackPlane);
            
            
            // Crear un iframe con community.html
            const iframe = document.createElement('iframe');
            iframe.style.width = '800px';
            iframe.style.height = '606px';
            iframe.style.border = 'none';
            iframe.style.overflow = 'hidden';
            iframe.style.display = 'block';
            iframe.src = 'community.html';
            
            // Crear un elemento div para contener el iframe
            const div = document.createElement('div');
            div.style.width = '800px';
            div.style.height = '606px';
            div.style.backgroundColor = 'transparent';
            div.style.overflow = 'hidden';
            div.appendChild(iframe);
            
            // Crear un objeto CSS3D para el div
            const cssObject = new THREE.CSS3DObject(div);
            
            // Calcular la escala adecuada
            const scaleX = width / 800;
            const scaleY = height / 606;
            const verticalScaleAdjustment = 1.011;
            
            
            // Aplicar la escala calculada
            cssObject.scale.set(scaleX, scaleY * verticalScaleAdjustment, 1);
            
            // Posicionar el objeto CSS3D
            cssObject.position.copy(center);
            cssObject.rotation.copy(rotation);
            cssObject.position.z += 0.001;
            cssObject.position.y -= 0.003;
            
            
            // Añadir el objeto CSS3D a la escena CSS3D
            window.communityScene.add(cssObject);
            
            // Guardar referencia al objeto CSS3D
            window.communityCssObject = cssObject;
            
            // Configurar evento de clic para el plano
            invisiblePlane.userData.clickable = true;
            
            
            // Inicializar el estado del cover negro
            setTimeout(function() {
                if (window.communityScreenMaterial && window.communityBackPlane) {
                    // Asegurar que el cover negro esté visible inicialmente
                    window.communityScreenMaterial.color.set(0x000000);
                    window.communityScreenMaterial.transparent = false;
                    window.communityScreenMaterial.opacity = 1.0;
                    window.communityScreenMaterial.needsUpdate = true;
                    window.communityBackPlane.visible = true;
                }
                
                // Asegurar que el contenido HTML esté oculto inicialmente
                if (window.communityCssObject && window.communityCssObject.element) {
                    window.communityCssObject.element.style.visibility = 'hidden';
                    window.communityCssObject.element.style.pointerEvents = 'none';
                }
            }, 100);
            
            return invisiblePlane;
        }
        
        // Function to create the community HTML plane
        function createCommunityPlane() {
            // Inicializar CSS3DRenderer si no existe
            if (!css3dRenderer) {
                css3dRenderer = new THREE.CSS3DRenderer();
                css3dRenderer.setSize(window.innerWidth, window.innerHeight);
                css3dRenderer.domElement.style.position = 'absolute';
                css3dRenderer.domElement.style.top = '0';
                css3dRenderer.domElement.style.pointerEvents = 'none';
                document.body.appendChild(css3dRenderer.domElement);
            }
            
            // Configurar el plano invisible para la pantalla interactiva
            const invisiblePlane = setupCommunityScreen();
            
            
            return invisiblePlane;
        }
        
        // Función para verificar si el plano de community es visible desde el frente
        function isCommunityPlaneVisibleFromFront() {
            if (!window.communityPlane) {
                return false;
            }
            
            // Obtener la dirección normal del plano
            const normal = new THREE.Vector3(0, 0, 1);
            normal.applyQuaternion(window.communityPlane.quaternion);
            
            // Obtener la dirección desde la cámara al plano
            const cameraToPlane = new THREE.Vector3();
            cameraToPlane.subVectors(window.communityPlane.position, camera.position).normalize();
            
            // Calcular el producto punto
            const dotProduct = normal.dot(cameraToPlane);
            
            // Si el producto punto es positivo, estamos viendo desde el frente
            const isVisible = dotProduct > 0;
            
            return isVisible;
        }
        
        // Ejecutar inmediatamente para mostrar frases lo más rápido posible
        setTimeout(function() {
            startLoadingPhrases();
        }, 50);
        
    </script>
</body>
</html>

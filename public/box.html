<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('../assets/media/pictures/picturesOfSometingElse/ContactBack.jpg') center center / cover no-repeat,
                        linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Transparency layer over the background */
        html::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
            pointer-events: none;
        }
        
        .main-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-weight: bold;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
            margin: 0;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 650px;
            width: 100%;
            padding: 20px;
        }
        
        /* Adjustments for 3 cards layout */
        .cards-grid .card:nth-child(3) {
            grid-column: 1 / -1;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Ensure that the entire card is clickable */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        .card * {
            /* Make all internal elements part of the click */
            pointer-events: none;
            user-select: none;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .card:hover::before {
            left: 100%;
        }
        
        .card:hover {
            transform: translateY(-8px) scale(1.03);
            background: rgba(255, 255, 255, 0.55);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        
        .card:active {
            transform: translateY(-4px) scale(1.01);
            background: rgba(255, 255, 255, 0.3);
        }
        
        .card-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            /* Ensure that content does not interfere with clicks */
            pointer-events: none;
        }
        
        .card-icon {
            font-size: 3.2em;
            margin-bottom: 8px;
            display: block;
            line-height: 1;
        }
        
        .card-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
            line-height: 1.2;
        }
        
        .card-description {
            font-size: 0.95em;
            opacity: 0.9;
            line-height: 1.4;
            max-width: 90%;
        }
        
        .experience-card {
            background: linear-gradient(135deg, rgba(252, 209, 22, 0.25), rgba(252, 209, 22, 0.15));
            border: 2px solid rgba(252, 209, 22, 0.4);
        }
        
        .skills-card {
            background: linear-gradient(135deg, rgba(12, 71, 162, 0.25), rgba(12, 71, 162, 0.15));
            border: 2px solid rgba(12, 71, 162, 0.4);
        }
        
        .certifications-card {
            background: linear-gradient(135deg, rgba(206, 17, 38, 0.25), rgba(206, 17, 38, 0.15));
            border: 2px solid rgba(206, 17, 38, 0.4);
        }
        
        .credits-card {
            background: linear-gradient(135deg, rgba(156, 39, 176, 0.2), rgba(156, 39, 176, 0.1));
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        .animate-float:nth-child(2) { animation-delay: -1s; }
        .animate-float:nth-child(3) { animation-delay: -2s; }
        .animate-float:nth-child(4) { animation-delay: -3s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: none; /* Initially hidden */
            z-index: 3;
        }
        
        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        /* Iframe container for navigation */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            z-index: 1000;
        }
        
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="goBack()">← Back</button>
    
    <div class="main-container" id="mainContainer">
        <div class="header">
            <h1>My Profile</h1>
            <p>Discover my skills and professional experience</p>
        </div>
        
        <div class="cards-grid">
            <div class="card experience-card animate-float" onclick="navigateTo('skills.html')" data-page="skills.html">
                <div class="card-content">
                    <div class="card-icon">💼</div>
                    <div class="card-title">Experience</div>
                    <div class="card-description">My professional journey and featured projects</div>
                </div>
            </div>
            
            <div class="card skills-card animate-float" onclick="navigateTo('experience.html')" data-page="experience.html">
                <div class="card-content">
                    <div class="card-icon">⚡</div>
                    <div class="card-title">Skills</div>
                    <div class="card-description">Technologies and tools I master</div>
                </div>
            </div>
            
            <div class="card certifications-card animate-float" onclick="navigateTo('certifications.html')" data-page="certifications.html">
                <div class="card-content">
                    <div class="card-icon">🏆</div>
                    <div class="card-title">Certifications</div>
                    <div class="card-description">Courses and certificates obtained</div>
                </div>
            </div>
            
            <!-- 
            <div class="card credits-card animate-float" onclick="navigateTo('credits.html')" data-page="credits.html">
                <div class="card-content">
                    <div class="card-icon">✨</div>
                    <div class="card-title">Créditos</div>
                    <div class="card-description">Agradecimientos y reconocimientos</div>
                </div>
            </div>
            -->
        </div>
    </div>
    
    <!-- Iframe container for navigation -->
    <div class="iframe-container" id="iframeContainer">
        <iframe id="contentIframe" src=""></iframe>
    </div>

    <script>
        // Navigation functions
        function navigateTo(page) {
            
            const mainContainer = document.getElementById('mainContainer');
            const iframeContainer = document.getElementById('iframeContainer');
            const contentIframe = document.getElementById('contentIframe');
            const backButton = document.querySelector('.back-button');
            
            // Verify that all elements exist
            if (!mainContainer || !iframeContainer || !contentIframe || !backButton) {
                return;
            }
            
            
            // Hide main content
            mainContainer.style.display = 'none';
            
            // Show iframe container
            iframeContainer.style.display = 'block';
            
            // Load the page in iframe
            contentIframe.src = page;
            
            // Show back button
            backButton.style.display = 'block';
            
            // Add error handling for iframe loading
            contentIframe.onload = function() {
            };
            
            contentIframe.onerror = function() {
                // Fallback: show error message
                contentIframe.srcdoc = `
                    <html>
                        <body style="margin:0; padding:40px; font-family:Arial; background:#f44336; color:white; text-align:center;">
                            <h1>Error loading page</h1>
                            <p>Could not load: ${page}</p>
                            <button onclick="parent.goBack()" style="padding:10px 20px; background:white; color:#f44336; border:none; border-radius:5px; cursor:pointer;">Go Back</button>
                        </body>
                    </html>
                `;
            };
            
        }
        
        function goBack() {
            
            const mainContainer = document.getElementById('mainContainer');
            const iframeContainer = document.getElementById('iframeContainer');
            const contentIframe = document.getElementById('contentIframe');
            const backButton = document.querySelector('.back-button');
            
            // Show main content
            mainContainer.style.display = 'flex';
            
            // Hide iframe container
            iframeContainer.style.display = 'none';
            
            // Clear iframe source
            contentIframe.src = '';
            
            // Hide back button
            backButton.style.display = 'none';
            
        }
        
        // Improve card event handling
        function setupCardEvents() {
            const cards = document.querySelectorAll('.card');
            
            cards.forEach((card, index) => {
                const page = card.getAttribute('data-page');
                
                // Remove existing events
                card.onclick = null;
                
                // Add more robust event listeners
                card.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log(`🎯 Event details:`, {
                        clientX: e.clientX,
                        clientY: e.clientY,
                        target: e.target,
                        currentTarget: e.currentTarget
                    });
                    
                    if (page) {
                        navigateTo(page);
                    } else {
                    }
                });
                
                // Add additional events to improve interactivity
                card.addEventListener('mouseenter', function() {
                });
                
                card.addEventListener('mouseleave', function() {
                });
                
                // NEW: Add listener for synthetic events (from forwarding)
                card.addEventListener('mousedown', function(e) {
                });
                
                card.addEventListener('mouseup', function(e) {
                });
                
                console.log(`✅ Card ${index + 1} (${page}) configured correctly`);
            });
        }
        
        // Test function to verify navigation
        function testNavigation() {
            console.log('- mainContainer:', document.getElementById('mainContainer') ? '✅' : '❌');
            console.log('- iframeContainer:', document.getElementById('iframeContainer') ? '✅' : '❌');
            console.log('- contentIframe:', document.getElementById('contentIframe') ? '✅' : '❌');
            console.log('- backButton:', document.querySelector('.back-button') ? '✅' : '❌');
            
            // Test cards click events
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                const hasDataPage = card.getAttribute('data-page');
                const hasClickListener = card.onclick || card.addEventListener;
                const rect = card.getBoundingClientRect();
            });
        }
        
        // NEW: Function for debugging positions
        function debugCardPositions() {
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                const rect = card.getBoundingClientRect();
                const page = card.getAttribute('data-page');
                console.log(`Card ${index + 1} (${page}):`);
            });
        }
        
        // Configuration similar to about-me.html for compatibility
        document.addEventListener('DOMContentLoaded', function() {
            
            // Set up card events first
            setupCardEvents();
            
            // Test navigation system
            setTimeout(testNavigation, 500);
            
            // NEW: Debug positions after everything loads
            setTimeout(debugCardPositions, 1000);
            
            // Rotate and flip horizontally to fix the mirror effect (same as about-me.html)
            document.body.style.transform = 'rotate(180deg) scaleX(-1)';
            
            let isActive = false;
            
            // Check if page is in an iframe
            function isInIframe() {
                try {
                    return window.self !== window.top;
                } catch (e) {
                    return true;
                }
            }
            
            // Listen for messages from the parent window
            window.addEventListener('message', function(event) {
                
                // Check if the message is to turn on the screen
                if (event.data && event.data.action === 'turnOnScreen') {
                    isActive = true;
                    
                    // Send confirmation back to parent
                    try {
                        window.parent.postMessage({ action: 'aboutMeDuplicateScreenTurnedOn' }, '*');
                        console.log("✅ Confirmation sent: box screen turned on (aboutMeDuplicateScreenTurnedOn)");
                    } catch (e) {
                    }
                }
                
                // Check if the message is to turn off the screen
                if (event.data && event.data.action === 'turnOffScreen') {
                    isActive = false;
                    
                    // Send confirmation back to parent
                    try {
                        window.parent.postMessage({ action: 'aboutMeDuplicateScreenTurnedOff' }, '*');
                        console.log("✅ Confirmation sent: box screen turned off (aboutMeDuplicateScreenTurnedOff)");
                    } catch (e) {
                    }
                }
                
                // Check if the message is to navigate back to box from child iframe
                if (event.data && event.data.action === 'navigateToBox') {
                    goBack(); // Call the goBack() function to return to the main menu
                }
            });
            
            // Send a message to the parent window to let it know we're ready
            if (isInIframe()) {
                try {
                    window.parent.postMessage({ action: 'boxReady' }, '*');
                } catch (e) {
                }
            }
        });
    </script>
</body>
</html>

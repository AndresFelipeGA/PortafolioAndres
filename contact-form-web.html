<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto - Web & E-commerce</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            color: #333;
            overflow: auto;
            height: 100vh;
            scroll-behavior: smooth;
        }
        
        .contact-container {
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 100vh;
            position: relative;
            scroll-behavior: smooth;
        }
        
        /* Estilos para el scrollbar - más visible */
        ::-webkit-scrollbar {
            width: 12px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: #A67C52;
            border-radius: 10px;
            border: 2px solid #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #6F4E37;
        }
        
        /* Indicador de desplazamiento */
        .scroll-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background-color: rgba(166, 124, 82, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            animation: bounce 2s infinite;
            z-index: 100;
            pointer-events: none;
        }
        
        /* Botón de regreso en la esquina superior izquierda */
        .back-corner-button {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background-color: rgba(166, 124, 82, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s ease;
        }
        
        .back-corner-button:hover {
            background-color: rgba(111, 78, 55, 0.9);
            transform: scale(1.1);
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .form-header h1 {
            margin: 0;
            color: #5D4037;
            font-size: 24px;
        }
        
        .form-header .service-icon {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin: 10px auto;
            display: block;
        }
        
        .form-header .service-description {
            font-size: 14px;
            color: #7D5A50;
            text-align: center;
            margin: 10px 0;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .contact-form {
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
            background: #f9f9f9;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #5D4037;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
        }
        
        .form-group textarea {
            height: 120px;
            resize: vertical;
        }
        
        .form-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .back-button {
            background: #E0E0E0;
            color: #5D4037;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .submit-button {
            background: linear-gradient(135deg, #6F4E37, #A67C52);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .back-button:hover, .submit-button:hover {
            transform: scale(1.05);
        }
        
        .back-button:active, .submit-button:active {
            transform: scale(0.98);
        }
        
        .back-icon {
            margin-right: 5px;
            font-size: 16px;
        }
        
        /* Campos específicos para cada servicio */
        .service-specific-fields {
            border-top: 1px solid #ddd;
            margin-top: 15px;
            padding-top: 15px;
        }
        
        .checkbox-group {
            margin-top: 10px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="contact-container">
        <div class="back-corner-button" onclick="window.location.href='cafe-menu.html'">←</div>
        <div class="scroll-indicator" id="scrollIndicator">↓</div>
        <div class="form-header">
            <h1>Formulario de Contacto</h1>
            <img src="images/icons/typeOfCoffes/cafeNumeroCinco.png" alt="Web & E-commerce" class="service-icon" id="serviceIcon">
            <h2 id="serviceTitle">Web & E-commerce</h2>
            <p class="service-description" id="serviceDescription">Desarrollo de todo tipo de sitios web y plataformas de comercio electrónico personalizadas.</p>
        </div>
        
        <form class="contact-form" id="contactForm">
            <!-- Campos esenciales -->
            <div class="form-group">
                <label for="nombre">Nombre Completo*</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div class="form-group">
                <label for="email">Correo Electrónico*</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <!-- Campos específicos para Web & E-commerce -->
            <div class="service-specific-fields">
                <div class="form-group">
                    <label for="tipoProyecto">Tipo de Proyecto*</label>
                    <select id="tipoProyecto" name="tipoProyecto" required>
                        <option value="">Seleccione una opción</option>
                        <option value="sitio">Sitio Web Informativo</option>
                        <option value="landing">Landing Page</option>
                        <option value="blog">Blog</option>
                        <option value="ecommerce">Tienda Online (E-commerce)</option>
                        <option value="marketplace">Marketplace</option>
                        <option value="webapp">Aplicación Web</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="descripcionProyecto">Descripción del Proyecto*</label>
                    <textarea id="descripcionProyecto" name="descripcionProyecto" required placeholder="Describa su proyecto web o e-commerce, objetivos, público objetivo y cualquier referencia o ejemplo que le guste"></textarea>
                </div>
            </div>
            
            <div class="form-buttons">
                <button type="button" class="back-button" onclick="window.location.href='cafe-menu.html'">
                    <span class="back-icon">←</span> Volver al Menú
                </button>
                <button type="submit" class="submit-button">Enviar Solicitud</button>
            </div>
        </form>
    </div>

    <script>
        // Función para manejar el desplazamiento
        function handleScroll() {
            const container = document.querySelector('.contact-container');
            const scrollIndicator = document.getElementById('scrollIndicator');
            
            // Mostrar/ocultar el indicador de desplazamiento según sea necesario
            if (container.scrollHeight > container.clientHeight) {
                // Hay contenido que se puede desplazar
                if (container.scrollTop + container.clientHeight >= container.scrollHeight - 20) {
                    // Estamos cerca del final, ocultar el indicador
                    scrollIndicator.style.display = 'none';
                } else {
                    // Todavía hay contenido para desplazar, mostrar el indicador
                    scrollIndicator.style.display = 'flex';
                }
            } else {
                // No hay suficiente contenido para desplazar
                scrollIndicator.style.display = 'none';
            }
        }
        
        // Función para manejar eventos de rueda del mouse
        function handleMouseWheel(event) {
            const container = document.querySelector('.contact-container');
            
            // Prevenir el comportamiento predeterminado
            event.preventDefault();
            
            // Desplazar el contenedor
            container.scrollTop += event.deltaY;
            
            // Actualizar el indicador de desplazamiento
            handleScroll();
        }
        
        // Configurar el manejo de desplazamiento al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar si necesitamos mostrar el indicador de desplazamiento
            handleScroll();
            
            // Agregar evento de desplazamiento
            const container = document.querySelector('.contact-container');
            container.addEventListener('scroll', handleScroll);
            
            // Agregar evento de rueda del mouse para el desplazamiento
            container.addEventListener('wheel', handleMouseWheel, { passive: false });
            
            // Agregar evento de clic al indicador de desplazamiento
            document.getElementById('scrollIndicator').addEventListener('click', function() {
                container.scrollTop += 100; // Desplazar hacia abajo al hacer clic en el indicador
            });
        });
        
        // Manejar el envío del formulario
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Aquí iría la lógica para procesar el formulario
            // Por ahora, solo mostraremos un mensaje de éxito
            alert('¡Gracias por su interés en nuestro servicio de Web & E-commerce! Su solicitud ha sido enviada correctamente.');
            
            // Redirigir al menú principal
            window.location.href = 'cafe-menu.html';
        });
    </script>
</body>
</html>

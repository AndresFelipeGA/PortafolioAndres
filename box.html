<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Hub</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .main-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
            margin: 0;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 650px;
            width: 100%;
            padding: 20px;
        }
        
        /* Adjustments for 3 cards layout */
        .cards-grid .card:nth-child(3) {
            grid-column: 1 / -1;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Asegurar que toda la card sea clickeable */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        .card * {
            /* Hacer que todos los elementos internos sean parte del click */
            pointer-events: none;
            user-select: none;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .card:hover::before {
            left: 100%;
        }
        
        .card:hover {
            transform: translateY(-8px) scale(1.03);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
        
        .card:active {
            transform: translateY(-4px) scale(1.01);
            background: rgba(255, 255, 255, 0.3);
        }
        
        .card-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            /* Asegurar que el contenido no interfiera con los clicks */
            pointer-events: none;
        }
        
        .card-icon {
            font-size: 3.2em;
            margin-bottom: 8px;
            display: block;
            line-height: 1;
        }
        
        .card-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
            line-height: 1.2;
        }
        
        .card-description {
            font-size: 0.95em;
            opacity: 0.9;
            line-height: 1.4;
            max-width: 90%;
        }
        
        .experience-card {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.2), rgba(255, 107, 107, 0.1));
        }
        
        .skills-card {
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.2), rgba(78, 205, 196, 0.1));
        }
        
        .certifications-card {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.2), rgba(255, 193, 7, 0.1));
        }
        
        .credits-card {
            background: linear-gradient(135deg, rgba(156, 39, 176, 0.2), rgba(156, 39, 176, 0.1));
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        .animate-float:nth-child(2) { animation-delay: -1s; }
        .animate-float:nth-child(3) { animation-delay: -2s; }
        .animate-float:nth-child(4) { animation-delay: -3s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: none; /* Initially hidden */
        }
        
        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        /* Iframe container for navigation */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            z-index: 1000;
        }
        
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="goBack()">← Volver</button>
    
    <div class="main-container" id="mainContainer">
        <div class="header">
            <h1>🚀 Portfolio Hub</h1>
            <p>Explora mis habilidades y experiencia</p>
        </div>
        
        <div class="cards-grid">
            <div class="card experience-card animate-float" onclick="navigateTo('skills.html')" data-page="skills.html">
                <div class="card-content">
                    <div class="card-icon">💼</div>
                    <div class="card-title">Experiencia</div>
                    <div class="card-description">Mi trayectoria profesional y proyectos destacados</div>
                </div>
            </div>
            
            <div class="card skills-card animate-float" onclick="navigateTo('experience.html')" data-page="experience.html">
                <div class="card-content">
                    <div class="card-icon">⚡</div>
                    <div class="card-title">Habilidades</div>
                    <div class="card-description">Tecnologías y herramientas que domino</div>
                </div>
            </div>
            
            <div class="card certifications-card animate-float" onclick="navigateTo('certifications.html')" data-page="certifications.html">
                <div class="card-content">
                    <div class="card-icon">🏆</div>
                    <div class="card-title">Certificaciones</div>
                    <div class="card-description">Cursos y certificados obtenidos</div>
                </div>
            </div>
            
            <!-- 
            <div class="card credits-card animate-float" onclick="navigateTo('credits.html')" data-page="credits.html">
                <div class="card-content">
                    <div class="card-icon">✨</div>
                    <div class="card-title">Créditos</div>
                    <div class="card-description">Agradecimientos y reconocimientos</div>
                </div>
            </div>
            -->
        </div>
    </div>
    
    <!-- Iframe container for navigation -->
    <div class="iframe-container" id="iframeContainer">
        <iframe id="contentIframe" src=""></iframe>
    </div>

    <script>
        // Navigation functions
        function navigateTo(page) {
            console.log(`🚀 Intentando navegar a: ${page}`);
            
            const mainContainer = document.getElementById('mainContainer');
            const iframeContainer = document.getElementById('iframeContainer');
            const contentIframe = document.getElementById('contentIframe');
            const backButton = document.querySelector('.back-button');
            
            // Verificar que todos los elementos existen
            if (!mainContainer || !iframeContainer || !contentIframe || !backButton) {
                console.error('❌ Error: No se encontraron todos los elementos necesarios');
                console.log('mainContainer:', mainContainer);
                console.log('iframeContainer:', iframeContainer);
                console.log('contentIframe:', contentIframe);
                console.log('backButton:', backButton);
                return;
            }
            
            console.log('✅ Todos los elementos encontrados, procediendo con la navegación...');
            
            // Hide main content
            mainContainer.style.display = 'none';
            console.log('📦 Contenedor principal ocultado');
            
            // Show iframe container
            iframeContainer.style.display = 'block';
            console.log('🖼️ Contenedor de iframe mostrado');
            
            // Load the page in iframe
            contentIframe.src = page;
            console.log(`📄 Cargando página: ${page} en el iframe`);
            
            // Show back button
            backButton.style.display = 'block';
            console.log('🔙 Botón de volver mostrado');
            
            // Add error handling for iframe loading
            contentIframe.onload = function() {
                console.log(`✅ Página ${page} cargada exitosamente en el iframe`);
            };
            
            contentIframe.onerror = function() {
                console.error(`❌ Error al cargar la página: ${page}`);
                // Fallback: mostrar mensaje de error
                contentIframe.srcdoc = `
                    <html>
                        <body style="margin:0; padding:40px; font-family:Arial; background:#f44336; color:white; text-align:center;">
                            <h1>Error al cargar la página</h1>
                            <p>No se pudo cargar: ${page}</p>
                            <button onclick="parent.goBack()" style="padding:10px 20px; background:white; color:#f44336; border:none; border-radius:5px; cursor:pointer;">Volver</button>
                        </body>
                    </html>
                `;
            };
            
            console.log(`🎯 Navegación a ${page} completada`);
        }
        
        function goBack() {
            console.log('🔙 Volviendo al hub principal...');
            
            const mainContainer = document.getElementById('mainContainer');
            const iframeContainer = document.getElementById('iframeContainer');
            const contentIframe = document.getElementById('contentIframe');
            const backButton = document.querySelector('.back-button');
            
            // Show main content
            mainContainer.style.display = 'flex';
            console.log('📦 Contenedor principal mostrado');
            
            // Hide iframe container
            iframeContainer.style.display = 'none';
            console.log('🖼️ Contenedor de iframe ocultado');
            
            // Clear iframe source
            contentIframe.src = '';
            console.log('🗑️ Fuente del iframe limpiada');
            
            // Hide back button
            backButton.style.display = 'none';
            console.log('🔙 Botón de volver ocultado');
            
            console.log('✅ Regreso al hub principal completado');
        }
        
        // Mejorar el manejo de eventos de las cards
        function setupCardEvents() {
            const cards = document.querySelectorAll('.card');
            console.log(`🎯 Configurando eventos para ${cards.length} cards`);
            
            cards.forEach((card, index) => {
                const page = card.getAttribute('data-page');
                
                // Remover eventos existentes
                card.onclick = null;
                
                // Agregar event listeners más robustos
                card.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log(`🎯 Card ${index + 1} clickeada: ${page}`);
                    console.log(`🎯 Event details:`, {
                        clientX: e.clientX,
                        clientY: e.clientY,
                        target: e.target,
                        currentTarget: e.currentTarget
                    });
                    
                    if (page) {
                        navigateTo(page);
                    } else {
                        console.error(`❌ No se encontró página para la card ${index + 1}`);
                    }
                });
                
                // Agregar eventos adicionales para mejorar la interactividad
                card.addEventListener('mouseenter', function() {
                    console.log(`🎯 Hover en card: ${page}`);
                });
                
                card.addEventListener('mouseleave', function() {
                    console.log(`🎯 Hover out card: ${page}`);
                });
                
                // NUEVO: Agregar listener para eventos sintéticos (desde el forwarding)
                card.addEventListener('mousedown', function(e) {
                    console.log(`🎯 MouseDown en card ${index + 1}: ${page}`, e);
                });
                
                card.addEventListener('mouseup', function(e) {
                    console.log(`🎯 MouseUp en card ${index + 1}: ${page}`, e);
                });
                
                console.log(`✅ Card ${index + 1} (${page}) configurada correctamente`);
            });
        }
        
        // Test function to verify navigation
        function testNavigation() {
            console.log('🧪 Probando sistema de navegación...');
            console.log('Elementos encontrados:');
            console.log('- mainContainer:', document.getElementById('mainContainer') ? '✅' : '❌');
            console.log('- iframeContainer:', document.getElementById('iframeContainer') ? '✅' : '❌');
            console.log('- contentIframe:', document.getElementById('contentIframe') ? '✅' : '❌');
            console.log('- backButton:', document.querySelector('.back-button') ? '✅' : '❌');
            
            // Test cards click events
            const cards = document.querySelectorAll('.card');
            console.log(`- Cards encontradas: ${cards.length}`);
            cards.forEach((card, index) => {
                const hasDataPage = card.getAttribute('data-page');
                const hasClickListener = card.onclick || card.addEventListener;
                const rect = card.getBoundingClientRect();
                console.log(`  Card ${index + 1}: ${hasDataPage ? '✅ tiene data-page' : '❌ sin data-page'} | ${hasClickListener ? '✅ tiene eventos' : '❌ sin eventos'}`);
                console.log(`    - Posición: top=${rect.top}, left=${rect.left}, width=${rect.width}, height=${rect.height}`);
                console.log(`    - Data-page: ${hasDataPage}`);
            });
        }
        
        // NUEVA: Función para debugging de posiciones
        function debugCardPositions() {
            console.log('🎯 DEBUG: Posiciones de las cards:');
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                const rect = card.getBoundingClientRect();
                const page = card.getAttribute('data-page');
                console.log(`Card ${index + 1} (${page}):`);
                console.log(`  - Top: ${rect.top}, Left: ${rect.left}`);
                console.log(`  - Bottom: ${rect.bottom}, Right: ${rect.right}`);
                console.log(`  - Width: ${rect.width}, Height: ${rect.height}`);
                console.log(`  - Center: x=${rect.left + rect.width/2}, y=${rect.top + rect.height/2}`);
            });
        }
        
        // Configuración similar a about-me.html para compatibilidad
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Box.html cargado completamente');
            
            // Configurar eventos de las cards primero
            setupCardEvents();
            
            // Test navigation system
            setTimeout(testNavigation, 500);
            
            // NUEVO: Debug de posiciones después de que se cargue todo
            setTimeout(debugCardPositions, 1000);
            
            // Rotate and flip horizontally to fix the mirror effect (same as about-me.html)
            document.body.style.transform = 'rotate(180deg) scaleX(-1)';
            console.log('🔄 Transformación 3D aplicada');
            
            let isActive = false;
            
            // Check if page is in an iframe
            function isInIframe() {
                try {
                    return window.self !== window.top;
                } catch (e) {
                    return true;
                }
            }
            
            // Listen for messages from the parent window
            window.addEventListener('message', function(event) {
                console.log("📨 Mensaje recibido en box.html:", event.data);
                
                // Check if the message is to turn on the screen
                if (event.data && event.data.action === 'turnOnScreen') {
                    console.log("🔛 Recibido mensaje para encender pantalla box");
                    isActive = true;
                    
                    // Send confirmation back to parent
                    try {
                        window.parent.postMessage({ action: 'aboutMeDuplicateScreenTurnedOn' }, '*');
                        console.log("✅ Confirmación enviada: pantalla box encendida (aboutMeDuplicateScreenTurnedOn)");
                    } catch (e) {
                        console.error("❌ Error enviando confirmación al padre:", e);
                    }
                }
                
                // Check if the message is to turn off the screen
                if (event.data && event.data.action === 'turnOffScreen') {
                    console.log("🔛 Recibido mensaje para apagar pantalla box");
                    isActive = false;
                    
                    // Send confirmation back to parent
                    try {
                        window.parent.postMessage({ action: 'aboutMeDuplicateScreenTurnedOff' }, '*');
                        console.log("✅ Confirmación enviada: pantalla box apagada (aboutMeDuplicateScreenTurnedOff)");
                    } catch (e) {
                        console.error("❌ Error enviando confirmación al padre:", e);
                    }
                }
                
                // Check if the message is to navigate back to box from child iframe
                if (event.data && event.data.action === 'navigateToBox') {
                    console.log("🔙 Recibido mensaje para volver al menú box");
                    goBack(); // Llamar la función goBack() para volver al menú principal
                }
            });
            
            // Send a message to the parent window to let it know we're ready
            if (isInIframe()) {
                try {
                    window.parent.postMessage({ action: 'boxReady' }, '*');
                    console.log("✅ Mensaje 'boxReady' enviado al padre");
                } catch (e) {
                    console.error("❌ Error enviando mensaje al padre:", e);
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="assets/css/screens.css">
    <style>
        /* Iframe de 765 x 606 px (ver index.html). Las subpáginas se cargan en
           #contentIframe y heredan la rotación aplicada a este body. */
        .profile-main { display: flex; flex-direction: column; height: 100%; }
        .screen-body { display: flex; flex-direction: column; overflow: hidden; }

        .cards-grid {
            flex: 1 1 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            min-height: 0;
        }

        /* Toda la tarjeta es el objetivo táctil (los clics reenviados desde la
           escena 3D deben caer siempre en la tarjeta, no en sus hijos) */
        .cards-grid .card {
            padding: 24px 22px;
            gap: 10px;
            user-select: none;
            -webkit-user-select: none;
            border-top-width: 6px;
        }
        .cards-grid .card * { pointer-events: none; user-select: none; }
        .experience-card { border-top-color: var(--co-yellow); }
        .skills-card { border-top-color: var(--co-blue); }
        .certifications-card { border-top-color: var(--co-red); }

        .nav-card .icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #EFE5D6;
            font-size: 30px;
            margin-bottom: 6px;
        }
        .nav-card .title { font-size: 25px; }
        .nav-card .desc { font-size: 16px; line-height: 1.45; }
        .nav-card .arrow {
            display: inline-flex;
            align-items: center;
            min-height: var(--tap);
            font-size: 16px;
        }

        .hint {
            flex: 0 0 auto;
            margin: 16px 0 0;
            font-size: 15px;
            color: var(--ink-soft);
            text-align: center;
        }

        /* Botón usado por navigateTo()/goBack(); queda debajo del iframe
           (cada subpágina trae su propio botón volver). */
        .back-button { display: none; position: absolute; z-index: 1; }

        /* Contenedor de las subpáginas */
        .iframe-container {
            position: absolute;
            inset: 0;
            background: var(--paper);
            display: none;
            z-index: 1000;
        }
        .iframe-container iframe { display: block; width: 100%; height: 100%; border: none; }
    </style>
    <!-- Mismo volteo que aplica el script al cargar, pero desde el primer instante
         (Safari alcanzaba a mostrar la página sin voltear = invertida en la escena 3D) -->
    <style>body { transform: rotate(180deg) scaleX(-1); }</style>
</head>
<body class="screen">
    <button class="back-button btn btn-ghost" onclick="goBack()" aria-hidden="true" tabindex="-1">&larr; Back</button>

    <div class="profile-main" id="mainContainer">
        <div class="tricolor"></div>
        <header class="screen-header">
            <p class="overline">Profile</p>
            <h1>My professional profile</h1>
            <p class="lead">Where I've worked, what I use and what I've studied.</p>
        </header>

        <main class="screen-body">
            <div class="cards-grid">
                <div class="card nav-card experience-card" role="button" tabindex="0" onclick="navigateTo('experience.html')" data-page="experience.html">
                    <span class="icon">💼</span>
                    <span class="title">Experience</span>
                    <span class="desc">My professional journey and featured projects</span>
                    <span class="arrow">Open &rarr;</span>
                </div>

                <div class="card nav-card skills-card" role="button" tabindex="0" onclick="navigateTo('skills.html')" data-page="skills.html">
                    <span class="icon">⚡</span>
                    <span class="title">Skills</span>
                    <span class="desc">Technologies and tools I work with</span>
                    <span class="arrow">Open &rarr;</span>
                </div>

                <div class="card nav-card certifications-card" role="button" tabindex="0" onclick="navigateTo('certifications.html')" data-page="certifications.html">
                    <span class="icon">🏆</span>
                    <span class="title">Certifications</span>
                    <span class="desc">Courses and certificates obtained</span>
                    <span class="arrow">Open &rarr;</span>
                </div>

                <!--
                <div class="card nav-card credits-card" role="button" tabindex="0" onclick="navigateTo('credits.html')" data-page="credits.html">
                    <span class="icon">✨</span>
                    <span class="title">Credits</span>
                    <span class="desc">Thanks and acknowledgements</span>
                    <span class="arrow">Open &rarr;</span>
                </div>
                -->
            </div>
            <p class="hint">Tap a card to open it</p>
        </main>
        <div class="wayuu-band"></div>
    </div>

    <!-- Iframe container for navigation -->
    <div class="iframe-container" id="iframeContainer">
        <iframe id="contentIframe" src="" title="Profile section"></iframe>
    </div>

    <script>
        // Navigation functions
        function navigateTo(page) {
            
            const mainContainer = document.getElementById('mainContainer');
            const iframeContainer = document.getElementById('iframeContainer');
            const contentIframe = document.getElementById('contentIframe');
            const backButton = document.querySelector('.back-button');
            
            // Verify that all elements exist
            if (!mainContainer || !iframeContainer || !contentIframe || !backButton) {
                return;
            }
            
            
            // Hide main content
            mainContainer.style.display = 'none';
            
            // Show iframe container
            iframeContainer.style.display = 'block';
            
            // Load the page in iframe
            contentIframe.src = page;
            
            // Show back button
            backButton.style.display = 'block';
            
            // Add error handling for iframe loading
            contentIframe.onload = function() {
            };
            
            contentIframe.onerror = function() {
                // Fallback: show error message
                contentIframe.srcdoc = `
                    <html>
                        <body style="margin:0; padding:40px; font-family:Arial; background:#f44336; color:white; text-align:center;">
                            <h1>Error loading page</h1>
                            <p>Could not load: ${page}</p>
                            <button onclick="parent.goBack()" style="padding:10px 20px; background:white; color:#f44336; border:none; border-radius:5px; cursor:pointer;">Go Back</button>
                        </body>
                    </html>
                `;
            };
            
        }
        
        function goBack() {
            
            const mainContainer = document.getElementById('mainContainer');
            const iframeContainer = document.getElementById('iframeContainer');
            const contentIframe = document.getElementById('contentIframe');
            const backButton = document.querySelector('.back-button');
            
            // Show main content
            mainContainer.style.display = 'flex';
            
            // Hide iframe container
            iframeContainer.style.display = 'none';
            
            // Clear iframe source
            contentIframe.src = '';
            
            // Hide back button
            backButton.style.display = 'none';
            
        }
        
        // Improve card event handling
        function setupCardEvents() {
            const cards = document.querySelectorAll('.card');
            
            cards.forEach((card, index) => {
                const page = card.getAttribute('data-page');
                
                // Remove existing events
                card.onclick = null;
                
                // Add more robust event listeners
                card.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log(`🎯 Event details:`, {
                        clientX: e.clientX,
                        clientY: e.clientY,
                        target: e.target,
                        currentTarget: e.currentTarget
                    });
                    
                    // The 3D scene (index.html) forwards clicks to this iframe as
                    // synthetic (untrusted) events whose X coordinate is mirrored
                    // (it uses iframeWidth - x), so the element that receives the
                    // event is the horizontal mirror of the card the user actually
                    // touched. Un-mirror X to find the card that is really visible
                    // there. Real (trusted) clicks/keyboard go straight to the card.
                    let targetPage = page;
                    if (!e.isTrusted && e.clientX) {
                        const hit = document.elementFromPoint(window.innerWidth - e.clientX, e.clientY);
                        const visibleCard = hit && hit.closest ? hit.closest('.card') : null;
                        targetPage = visibleCard ? visibleCard.getAttribute('data-page') : null;
                    }

                    if (targetPage) {
                        navigateTo(targetPage);
                    }
                });

                // Keyboard support (cards are role="button")
                card.addEventListener('keydown', function(e) {
                    if ((e.key === 'Enter' || e.key === ' ') && page) {
                        e.preventDefault();
                        navigateTo(page);
                    }
                });
                
                // Add additional events to improve interactivity
                card.addEventListener('mouseenter', function() {
                });
                
                card.addEventListener('mouseleave', function() {
                });
                
                // NEW: Add listener for synthetic events (from forwarding)
                card.addEventListener('mousedown', function(e) {
                });
                
                card.addEventListener('mouseup', function(e) {
                });
                
                console.log(`✅ Card ${index + 1} (${page}) configured correctly`);
            });
        }
        
        // Test function to verify navigation
        function testNavigation() {
            console.log('- mainContainer:', document.getElementById('mainContainer') ? '✅' : '❌');
            console.log('- iframeContainer:', document.getElementById('iframeContainer') ? '✅' : '❌');
            console.log('- contentIframe:', document.getElementById('contentIframe') ? '✅' : '❌');
            console.log('- backButton:', document.querySelector('.back-button') ? '✅' : '❌');
            
            // Test cards click events
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                const hasDataPage = card.getAttribute('data-page');
                const hasClickListener = card.onclick || card.addEventListener;
                const rect = card.getBoundingClientRect();
            });
        }
        
        // NEW: Function for debugging positions
        function debugCardPositions() {
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                const rect = card.getBoundingClientRect();
                const page = card.getAttribute('data-page');
                console.log(`Card ${index + 1} (${page}):`);
            });
        }
        
        // Configuration similar to about-me.html for compatibility
        document.addEventListener('DOMContentLoaded', function() {
            
            // Set up card events first
            setupCardEvents();
            
            // Test navigation system
            setTimeout(testNavigation, 500);
            
            // NEW: Debug positions after everything loads
            setTimeout(debugCardPositions, 1000);
            
            // Rotate and flip horizontally to fix the mirror effect (same as about-me.html)
            document.body.style.transform = 'rotate(180deg) scaleX(-1)';
            
            let isActive = false;
            
            // Check if page is in an iframe
            function isInIframe() {
                try {
                    return window.self !== window.top;
                } catch (e) {
                    return true;
                }
            }
            
            // Listen for messages from the parent window
            window.addEventListener('message', function(event) {
                
                // Check if the message is to turn on the screen
                if (event.data && event.data.action === 'turnOnScreen') {
                    isActive = true;
                    
                    // Send confirmation back to parent
                    try {
                        window.parent.postMessage({ action: 'aboutMeDuplicateScreenTurnedOn' }, '*');
                        console.log("✅ Confirmation sent: box screen turned on (aboutMeDuplicateScreenTurnedOn)");
                    } catch (e) {
                    }
                }
                
                // Check if the message is to turn off the screen
                if (event.data && event.data.action === 'turnOffScreen') {
                    isActive = false;
                    
                    // Send confirmation back to parent
                    try {
                        window.parent.postMessage({ action: 'aboutMeDuplicateScreenTurnedOff' }, '*');
                        console.log("✅ Confirmation sent: box screen turned off (aboutMeDuplicateScreenTurnedOff)");
                    } catch (e) {
                    }
                }
                
                // Check if the message is to navigate back to box from child iframe
                if (event.data && event.data.action === 'navigateToBox') {
                    goBack(); // Call the goBack() function to return to the main menu
                }
            });
            
            // Send a message to the parent window to let it know we're ready
            if (isInIframe()) {
                try {
                    window.parent.postMessage({ action: 'boxReady' }, '*');
                } catch (e) {
                }
            }
        });
    </script>
</body>
</html>

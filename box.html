<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Hub</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .main-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
            margin: 0;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            max-width: 600px;
            width: 100%;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .card:hover::before {
            left: 100%;
        }
        
        .card:hover {
            transform: translateY(-10px) scale(1.05);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
        
        .card-icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }
        
        .card-title {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
        }
        
        .card-description {
            font-size: 0.95em;
            opacity: 0.8;
            line-height: 1.4;
        }
        
        .experience-card {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.2), rgba(255, 107, 107, 0.1));
        }
        
        .skills-card {
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.2), rgba(78, 205, 196, 0.1));
        }
        
        .certifications-card {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.2), rgba(255, 193, 7, 0.1));
        }
        
        .credits-card {
            background: linear-gradient(135deg, rgba(156, 39, 176, 0.2), rgba(156, 39, 176, 0.1));
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        .animate-float:nth-child(2) { animation-delay: -1s; }
        .animate-float:nth-child(3) { animation-delay: -2s; }
        .animate-float:nth-child(4) { animation-delay: -3s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: none; /* Initially hidden */
        }
        
        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        /* Iframe container for navigation */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            z-index: 1000;
        }
        
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="goBack()">← Volver</button>
    
    <div class="main-container" id="mainContainer">
        <div class="header">
            <h1>🚀 Portfolio Hub</h1>
            <p>Explora mis habilidades y experiencia</p>
        </div>
        
        <div class="cards-grid">
            <div class="card experience-card animate-float" onclick="navigateTo('experience.html')">
                <div class="card-icon">💼</div>
                <div class="card-title">Experiencia</div>
                <div class="card-description">Mi trayectoria profesional y proyectos destacados</div>
            </div>
            
            <div class="card skills-card animate-float" onclick="navigateTo('skills.html')">
                <div class="card-icon">⚡</div>
                <div class="card-title">Habilidades</div>
                <div class="card-description">Tecnologías y herramientas que domino</div>
            </div>
            
            <div class="card certifications-card animate-float" onclick="navigateTo('certifications.html')">
                <div class="card-icon">🏆</div>
                <div class="card-title">Certificaciones</div>
                <div class="card-description">Cursos y certificados obtenidos</div>
            </div>
            
            <div class="card credits-card animate-float" onclick="navigateTo('credits.html')">
                <div class="card-icon">✨</div>
                <div class="card-title">Créditos</div>
                <div class="card-description">Agradecimientos y reconocimientos</div>
            </div>
        </div>
    </div>
    
    <!-- Iframe container for navigation -->
    <div class="iframe-container" id="iframeContainer">
        <iframe id="contentIframe" src=""></iframe>
    </div>

    <script>
        // Navigation functions
        function navigateTo(page) {
            const mainContainer = document.getElementById('mainContainer');
            const iframeContainer = document.getElementById('iframeContainer');
            const contentIframe = document.getElementById('contentIframe');
            const backButton = document.querySelector('.back-button');
            
            // Hide main content
            mainContainer.style.display = 'none';
            
            // Show iframe container
            iframeContainer.style.display = 'block';
            
            // Load the page in iframe
            contentIframe.src = page;
            
            // Show back button
            backButton.style.display = 'block';
            
            console.log(`Navigating to: ${page}`);
        }
        
        function goBack() {
            const mainContainer = document.getElementById('mainContainer');
            const iframeContainer = document.getElementById('iframeContainer');
            const contentIframe = document.getElementById('contentIframe');
            const backButton = document.querySelector('.back-button');
            
            // Show main content
            mainContainer.style.display = 'flex';
            
            // Hide iframe container
            iframeContainer.style.display = 'none';
            
            // Clear iframe source
            contentIframe.src = '';
            
            // Hide back button
            backButton.style.display = 'none';
            
            console.log('Returning to main hub');
        }
        
        // Configuración similar a about-me.html para compatibilidad
        document.addEventListener('DOMContentLoaded', function() {
            // Rotate and flip horizontally to fix the mirror effect (same as about-me.html)
            document.body.style.transform = 'rotate(180deg) scaleX(-1)';
            
            let isActive = false;
            
            // Check if page is in an iframe
            function isInIframe() {
                try {
                    return window.self !== window.top;
                } catch (e) {
                    return true;
                }
            }
            
            // Listen for messages from the parent window
            window.addEventListener('message', function(event) {
                console.log("Message received in box.html:", event.data);
                
                // Check if the message is to turn on the screen
                if (event.data && event.data.action === 'turnOnScreen') {
                    console.log("Received message to turn on box screen");
                    isActive = true;
                    
                    // Send confirmation back to parent
                    try {
                        window.parent.postMessage({ action: 'boxScreenTurnedOn' }, '*');
                        console.log("Sent confirmation that box screen was turned on");
                    } catch (e) {
                        console.error("Error sending confirmation to parent:", e);
                    }
                }
                
                // Check if the message is to turn off the screen
                if (event.data && event.data.action === 'turnOffScreen') {
                    console.log("Received message to turn off box screen");
                    isActive = false;
                    
                    // Send confirmation back to parent
                    try {
                        window.parent.postMessage({ action: 'boxScreenTurnedOff' }, '*');
                        console.log("Sent confirmation that box screen was turned off");
                    } catch (e) {
                        console.error("Error sending confirmation to parent:", e);
                    }
                }
            });
            
            // Send a message to the parent window to let it know we're ready
            if (isInIframe()) {
                try {
                    window.parent.postMessage({ action: 'boxReady' }, '*');
                    console.log("Sent ready message to parent");
                } catch (e) {
                    console.error("Error sending message to parent:", e);
                }
            }
        });
    </script>
</body>
</html>

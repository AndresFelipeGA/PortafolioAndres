<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Video</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #video-container {
            position: relative;
            width: 640px;
            height: 360px;
        }
        #background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #audio-player {
            display: none;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <!-- Use a background image from the media folder -->
        <img id="background-image" src="media/icons/logoCafe.png" alt="Background">
        
        <!-- Audio player -->
        <audio id="audio-player" autoplay loop>
            <source src="media/music/Soy Colombiano - Grupo Ritmo Latino.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <script>
        // Get the audio element
        const audioPlayer = document.getElementById('audio-player');
        
        // Set volume to 3%
        audioPlayer.volume = 0.03;
        
        // Function to try playing the audio
        function tryPlayAudio() {
            const playPromise = audioPlayer.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('Audio playing successfully at 3% volume');
                }).catch(error => {
                    console.error('Error playing audio:', error);
                });
            }
        }
        
        // Try to play audio when the page loads
        window.addEventListener('load', tryPlayAudio);
        
        // Also try to play on user interaction
        document.addEventListener('click', tryPlayAudio);
    </script>
</body>
</html>
